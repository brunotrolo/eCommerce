name: CI

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Validar JSON (.clasp.json, appsscript.json)
        run: node .github/scripts/validate-json.js

      - name: Validar filePushOrder (cobre exatamente src/**/*.js)
        run: node .github/scripts/validate-file-push-order.js

      - name: Validar sintaxe de src/**/*.js
        run: node .github/scripts/validate-js-syntax.js

      - name: "Auditoria de codigo morto (alias-aware: DataClient/FormatterService, ids, classes CSS, refs server, acoes describe)"
        run: node .github/scripts/validate-dead-code.js

      - name: "Testes Node (servicos reais no sandbox GAS: formatter, pricing, baixa FIFO)"
        run: node --test tests/*.test.js
