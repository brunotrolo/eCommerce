name: Deploy to Apps Script

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials (base64-decoded)
        run: |
          echo "${{ secrets.CLASP_CREDENTIALS_B64 }}" | base64 --decode > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Validate clasp credentials JSON
        run: |
          python3 -c "import json, sys, os; json.load(open(os.path.expanduser('~/.clasprc.json'))); print('✓ ~/.clasprc.json is valid JSON')"

      - name: Push source to Apps Script (dev)
        run: clasp push --force
