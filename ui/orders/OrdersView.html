<template id="orders-template">
  <div class="widget-grid">
    <div class="card">
      <h1>Pedidos</h1>
      <div class="filter-bar">
        <div class="form-field">
          <label for="marketplace-filter">Canal</label>
          <select id="marketplace-filter">
            <option value="all">Todos</option>
            <option value="shopee">Shopee</option>
            <option value="mercado_livre">Mercado Livre</option>
          </select>
        </div>
        <div class="form-field">
          <label for="limit-input">Limite</label>
          <input type="number" id="limit-input" value="30" min="1" max="100" />
        </div>
        <button class="btn" id="btn-refresh">Filtrar</button>
        <button class="btn btn--primary" id="btn-sync-shopee">Sincronizar Pedidos Shopee</button>
      </div>
      <div class="alert alert-error" id="error-box" hidden></div>
      <div class="alert alert-success" id="toast-box" hidden></div>
      <div id="result-box" hidden></div>
    </div>
    <div class="card table-container">
      <table class="table" id="orders-table">
        <thead><tr><th>ID</th><th>Canal</th><th>Status</th><th>Comprador</th><th>Total</th><th>Data</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</template>
<script>
  (function () {
    if (customElements.get('orders-widget')) return;

    class OrdersWidget extends HTMLElement {
      connectedCallback() {
        var template = document.getElementById('orders-template');
        var shadow = this.attachShadow({ mode: 'open' });
        shadow.adoptedStyleSheets = [window.__DESIGN_SHEET__];
        shadow.appendChild(template.content.cloneNode(true));
        shadow.getElementById('btn-refresh').addEventListener('click', () => this._load(shadow, true));
        shadow.getElementById('btn-sync-shopee').addEventListener('click', () => this._syncShopee(shadow));

        var ds = window.__DataStore;
        var cached = ds && ds.get('orders.all.30');
        var ordersData = cached && (cached.orders || (cached.data && cached.data.orders));
        if (ordersData) {
          renderRows(shadow, ordersData);
        }
        this._load(shadow, false);
      }

      _load(shadow, force) {
        var marketplace = shadow.getElementById('marketplace-filter').value;
        var limit = parseInt(shadow.getElementById('limit-input').value, 10) || 30;
        var cacheKey = 'orders.' + marketplace + '.' + limit;
        var ds = window.__DataStore;

        if (force && ds) ds.invalidate(cacheKey);

        withLoading(
          shadow.getElementById('btn-refresh'),
          (success, failure) =>
            google.script.run
              .withSuccessHandler(success)
              .withFailureHandler(failure)
              .apiDispatch('orders.listUnified', { marketplace: marketplace, limit: limit }),
          (data) => {
            if (ds) ds.set(cacheKey, data);
            renderRows(shadow, data.orders || []);
          },
          'Pedidos atualizados.'
        );
      }

      _syncShopee(shadow) {
        var ds = window.__DataStore;
        var self = this;
        var toastBox = shadow.getElementById('toast-box');

        withLoading(
          shadow.getElementById('btn-sync-shopee'),
          (success, failure) =>
            google.script.run
              .withSuccessHandler(success)
              .withFailureHandler(failure)
              .apiDispatch('ordersImport.importShopeeOrders', { limit: 100, offset: 0 }),
          (data) => {
            if (data && data.success) {
              var msg = data.message || ('Importados: ' + data.imported + ', Duplicatas: ' + data.duplicates);
              if (data.errors && data.errors.length > 0) {
                msg += ' (' + data.errors.length + ' erros)';
              }
              showToast(shadow, msg);
              if (ds) ds.invalidate('orders.all.30');
              self._load(shadow, true);
            } else {
              showToast(shadow, 'Erro: ' + (data && data.message ? data.message : 'Falha na importação.'), true);
            }
          },
          'Sincronizando pedidos Shopee...'
        );
      }
    }

    function escapeHtml_(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showToast(shadow, msg, isError) {
      var toast = shadow.getElementById('toast-box');
      toast.textContent = msg;
      toast.className = isError ? 'alert alert-error' : 'alert alert-success';
      toast.hidden = false;
      setTimeout(function () { toast.hidden = true; }, 5000);
    }

    function renderRows(shadow, orders) {
      var tbody = shadow.querySelector('#orders-table tbody');
      tbody.innerHTML = orders
        .map(function (o) {
          return (
            '<tr><td>' + escapeHtml_(o.id) + '</td><td><span class="badge badge-' +
            (o.marketplace === 'shopee' ? 'shopee' : 'mercado-livre') + '">' + escapeHtml_(o.marketplace) + '</span></td>' +
            '<td>' + escapeHtml_(o.status) + '</td><td>' + escapeHtml_(o.buyerName || '-') + '</td>' +
            '<td>' + (o.total != null ? FormatterService.formatCurrency(o.total) : '-') + '</td>' +
            '<td>' + escapeHtml_(o.createdAt || '-') + '</td></tr>'
          );
        })
        .join('') || '<tr><td colspan="6">Nenhum pedido encontrado.</td></tr>';
    }

    customElements.define('orders-widget', OrdersWidget);
  })();
</script>
