<template id="pricing-calculator-template">
  <style>
    .pc-hint {
      font-size: var(--font-size-xs, 12px);
      color: var(--color-text-secondary, #666);
      margin-top: calc(-1 * var(--space-xs, 4px));
      margin-bottom: var(--space-md, 12px);
    }

    .pc-segmented {
      display: flex;
      border: 1px solid var(--color-border, #e0e0e0);
      border-radius: var(--radius-md, 8px);
      overflow: hidden;
    }
    .pc-segmented input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .pc-segmented label {
      flex: 1;
      text-align: center;
      padding: var(--space-sm, 8px) var(--space-md, 12px);
      font-size: var(--font-size-sm, 13px);
      font-weight: var(--font-weight-medium, 500);
      color: var(--color-text-secondary, #666);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      user-select: none;
    }
    .pc-segmented label:not(:last-child) {
      border-right: 1px solid var(--color-border, #e0e0e0);
    }
    .pc-segmented input:checked + label {
      background: var(--color-primary, #1a1a2e);
      color: var(--color-on-primary, #fff);
    }
    .pc-segmented input:focus-visible + label {
      outline: 2px solid var(--color-accent, #00d4a4);
      outline-offset: -2px;
    }

    .result-card--shopee { border-top-color: var(--color-shopee); }
    .result-card--mercado_livre { border-top-color: var(--color-mercado-livre); }

    .pc-badge-row {
      margin-bottom: var(--space-md, 12px);
    }

    .pc-fee-breakdown {
      margin: var(--space-sm, 8px) 0;
      padding: var(--space-sm, 8px) var(--space-md, 12px);
      background: var(--color-surface-alt, #f7f7f7);
      border-radius: var(--radius-sm, 6px);
    }
    .pc-fee-breakdown .result-line:last-child { margin-bottom: 0; }

    .pc-empty-state {
      color: var(--color-text-secondary, #666);
      font-size: var(--font-size-sm, 13px);
      text-align: center;
      padding: var(--space-xl, 24px) 0;
    }
  </style>
  <div class="widget-grid">
    <div class="card">
      <h1>Calculadora de Precificação</h1>
      <p class="page-subtitle">Informe custos e margem alvo para comparar o preço sugerido por canal.</p>
      <div class="card-row">
        <div class="panel">
          <h3>Custos</h3>
          <div class="form-field">
            <label for="unitCost">Custo unitário (R$)</label>
            <input type="number" id="unitCost" step="0.01" min="0" placeholder="0,00" />
          </div>
          <div class="form-field">
            <label for="extraCosts">Custos extras por unidade (R$)</label>
            <input type="number" id="extraCosts" step="0.01" min="0" value="0" />
          </div>
        </div>
        <div class="panel">
          <h3>Margem alvo</h3>
          <div class="form-field">
            <label for="targetMarginPct">Margem alvo (%)</label>
            <input type="number" id="targetMarginPct" step="1" min="0" max="99" value="25" />
          </div>
          <div class="form-field">
            <label for="marginBasis">Margem calculada sobre</label>
            <select id="marginBasis">
              <option value="price">Preço de venda</option>
              <option value="cost">Custo</option>
            </select>
          </div>
          <div class="form-field">
            <label for="marketAveragePrice">Preço médio de mercado (opcional, R$)</label>
            <input type="number" id="marketAveragePrice" step="0.01" min="0" />
          </div>
        </div>
        <div class="panel">
          <h3>Cenário Shopee</h3>
          <div class="form-field">
            <label>Pagamento assumido</label>
            <div class="pc-segmented" id="paymentScenario">
              <input type="radio" name="paymentScenario" id="ps-cartao" value="cartao_avista" checked />
              <label for="ps-cartao">Cartão à vista</label>
              <input type="radio" name="paymentScenario" id="ps-pix" value="pix_ou_parcelado" />
              <label for="ps-pix">Pix / parcelado</label>
            </div>
          </div>
          <p class="pc-hint">Cartão à vista é o pior caso (comissão 18%) — default seguro para nunca subestimar a taxa.</p>
          <div class="form-field">
            <label for="itemCount">Itens no pedido</label>
            <input type="number" id="itemCount" step="1" min="1" value="1" />
          </div>
          <p class="pc-hint">Kits com vários itens pagam R$4 de taxa de serviço por item.</p>
        </div>
      </div>
      <button class="btn" id="btn-calc">Calcular</button>
      <div class="alert alert-error" id="error-box" hidden></div>
      <div id="result-box">
        <div class="pc-empty-state">Preencha os campos acima e clique em Calcular para comparar Shopee e Mercado Livre.</div>
      </div>
    </div>
  </div>
</template>
<script>
  (function () {
    if (customElements.get('pricing-calculator-widget')) return;

    var MARKETPLACE_LABELS = { shopee: 'Shopee', mercado_livre: 'Mercado Livre' };
    var MARKETPLACE_BADGE_CLASS = { shopee: 'badge-shopee', mercado_livre: 'badge-mercado-livre' };

    function formatBRL(value) {
      return FormatterService.formatCurrency(value);
    }

    function formatPct(value) {
      return FormatterService.formatPercent(value, 1);
    }

    class PricingCalculatorWidget extends HTMLElement {
      connectedCallback() {
        var template = document.getElementById('pricing-calculator-template');
        var shadow = this.attachShadow({ mode: 'open' });
        shadow.adoptedStyleSheets = [window.__DESIGN_SHEET__];
        shadow.appendChild(template.content.cloneNode(true));
        shadow.getElementById('btn-calc').addEventListener('click', () => this._calculate(shadow));
      }

      _calculate(shadow) {
        var paymentScenario = shadow.querySelector('input[name="paymentScenario"]:checked').value;
        var params = {
          unitCost: parseFloat(shadow.getElementById('unitCost').value),
          extraCosts: parseFloat(shadow.getElementById('extraCosts').value) || 0,
          targetMarginPct: parseFloat(shadow.getElementById('targetMarginPct').value) / 100,
          marginBasis: shadow.getElementById('marginBasis').value,
          marketAveragePrice: parseFloat(shadow.getElementById('marketAveragePrice').value) || undefined,
          itemCount: parseInt(shadow.getElementById('itemCount').value, 10) || 1,
          paymentScenario: paymentScenario
        };

        withLoading(
          shadow.getElementById('btn-calc'),
          (success, failure) =>
            google.script.run
              .withSuccessHandler(success)
              .withFailureHandler(failure)
              .apiDispatch('pricing.compareMarketplaces', params),
          (data) => renderResult(shadow, data),
          'Cálculo concluído.'
        );
      }
    }

    function renderFeeBreakdown(marketplace, row) {
      if (marketplace !== 'shopee' || typeof row.commission !== 'number') {
        return '<div class="result-line"><span>Taxa do canal</span><span>' + formatBRL(row.marketplaceFee) + '</span></div>';
      }
      return (
        '<div class="pc-fee-breakdown">' +
        '<div class="result-line"><span>Comissão</span><span>' + formatBRL(row.commission) + '</span></div>' +
        '<div class="result-line"><span>Taxa de serviço</span><span>' + formatBRL(row.serviceFee) + '</span></div>' +
        '<div class="result-line"><span><strong>Total de taxas</strong></span><span><strong>' + formatBRL(row.marketplaceFee) + '</strong></span></div>' +
        '</div>'
      );
    }

    function renderResult(shadow, data) {
      var box = shadow.getElementById('result-box');
      box.innerHTML = '<div class="card-row">' +
        Object.keys(data)
          .map(function (marketplace) {
            var row = data[marketplace];
            var body;
            if (row.error) {
              body = '<div class="result-error">' + row.error + '</div>';
            } else {
              var alertBadge = row.belowMarketAverage
                ? ' <span class="badge badge-warning">abaixo do mercado</span>'
                : '';
              body =
                '<div class="result-price">' + formatBRL(row.suggestedPrice) + alertBadge + '</div>' +
                renderFeeBreakdown(marketplace, row) +
                '<div class="result-line"><span>Margem líquida</span><span>' + formatPct(row.netMarginPct) + '</span></div>' +
                '<div class="result-line result-profit"><span>Lucro líquido</span><span>' + formatBRL(row.netProfit) + '</span></div>';
            }
            return (
              '<div class="result-card result-card--' + marketplace + ' ' + (row.error ? 'result-card--error' : 'result-card--success') + '">' +
              '<div class="pc-badge-row">' +
              '<span class="badge ' + MARKETPLACE_BADGE_CLASS[marketplace] + '">' + MARKETPLACE_LABELS[marketplace] + '</span>' +
              '</div>' + body +
              '</div>'
            );
          })
          .join('') +
        '</div>';
    }

    customElements.define('pricing-calculator-widget', PricingCalculatorWidget);
  })();
</script>
