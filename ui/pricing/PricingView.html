<template id="pricing-calculator-template">
  <div class="card">
    <h2>Calculadora de Precificação</h2>
    <div class="form-field">
      <label for="unitCost">Custo unitário (R$)</label>
      <input type="number" id="unitCost" step="0.01" min="0" />
    </div>
    <div class="form-field">
      <label for="extraCosts">Custos extras por unidade (R$)</label>
      <input type="number" id="extraCosts" step="0.01" min="0" value="0" />
    </div>
    <div class="form-field">
      <label for="targetMarginPct">Margem alvo (%)</label>
      <input type="number" id="targetMarginPct" step="1" min="0" max="99" value="25" />
    </div>
    <div class="form-field">
      <label for="marginBasis">Margem calculada sobre</label>
      <select id="marginBasis">
        <option value="price">Preço de venda</option>
        <option value="cost">Custo</option>
      </select>
    </div>
    <div class="form-field">
      <label for="marketAveragePrice">Preço médio de mercado (opcional, R$)</label>
      <input type="number" id="marketAveragePrice" step="0.01" min="0" />
    </div>
    <button class="btn" id="btn-calc">Calcular</button>
    <p class="alert alert-danger" id="error-box" hidden></p>
    <table class="table" id="result-table" hidden>
      <thead>
        <tr>
          <th>Canal</th>
          <th>Preço sugerido</th>
          <th>Taxa do canal</th>
          <th>Lucro líquido</th>
          <th>Margem líquida</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</template>
<script>
  (function () {
    if (customElements.get('pricing-calculator-widget')) return;

    var MARKETPLACE_LABELS = { shopee: 'Shopee', mercado_livre: 'Mercado Livre' };

    function formatBRL(value) {
      return 'R$ ' + Number(value).toFixed(2).replace('.', ',');
    }

    function formatPct(value) {
      return (Number(value) * 100).toFixed(1).replace('.', ',') + '%';
    }

    class PricingCalculatorWidget extends HTMLElement {
      connectedCallback() {
        var template = document.getElementById('pricing-calculator-template');
        var shadow = this.attachShadow({ mode: 'open' });
        shadow.adoptedStyleSheets = [window.__DESIGN_SHEET__];
        shadow.appendChild(template.content.cloneNode(true));
        this._bind(shadow);
      }

      _bind(shadow) {
        var self = this;
        shadow.getElementById('btn-calc').addEventListener('click', function () {
          self._calculate(shadow);
        });
      }

      _calculate(shadow) {
        var errorBox = shadow.getElementById('error-box');
        var resultTable = shadow.getElementById('result-table');
        errorBox.hidden = true;
        resultTable.hidden = true;

        var params = {
          unitCost: parseFloat(shadow.getElementById('unitCost').value),
          extraCosts: parseFloat(shadow.getElementById('extraCosts').value) || 0,
          targetMarginPct: parseFloat(shadow.getElementById('targetMarginPct').value) / 100,
          marginBasis: shadow.getElementById('marginBasis').value,
          marketAveragePrice: parseFloat(shadow.getElementById('marketAveragePrice').value) || undefined
        };

        google.script.run
          .withSuccessHandler(function (response) {
            if (response.error) {
              errorBox.textContent = response.error;
              errorBox.hidden = false;
              return;
            }
            renderResult(shadow, response.data);
          })
          .withFailureHandler(function (err) {
            errorBox.textContent = err.message || String(err);
            errorBox.hidden = false;
          })
          .apiDispatch('pricing.compareMarketplaces', params);
      }
    }

    function renderResult(shadow, data) {
      var tbody = shadow.querySelector('#result-table tbody');
      tbody.innerHTML = '';
      Object.keys(data).forEach(function (marketplace) {
        var row = data[marketplace];
        var tr = document.createElement('tr');
        if (row.error) {
          tr.innerHTML =
            '<td>' + MARKETPLACE_LABELS[marketplace] + '</td>' +
            '<td colspan="4"><span class="badge badge-danger">' + row.error + '</span></td>';
        } else {
          var alertBadge = row.belowMarketAverage
            ? ' <span class="badge badge-warning">abaixo do mercado</span>'
            : '';
          tr.innerHTML =
            '<td>' + MARKETPLACE_LABELS[marketplace] + '</td>' +
            '<td>' + formatBRL(row.suggestedPrice) + alertBadge + '</td>' +
            '<td>' + formatBRL(row.marketplaceFee) + '</td>' +
            '<td>' + formatBRL(row.netProfit) + '</td>' +
            '<td>' + formatPct(row.netMarginPct) + '</td>';
        }
        tbody.appendChild(tr);
      });
      shadow.getElementById('result-table').hidden = false;
    }

    customElements.define('pricing-calculator-widget', PricingCalculatorWidget);
  })();
</script>
