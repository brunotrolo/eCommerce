<template id="listings-template">
  <div class="widget-grid">
    <div class="card">
      <h1>Anúncios</h1>
      <div class="filter-bar">
        <div class="form-field">
          <label for="marketplace-filter">Canal</label>
          <select id="marketplace-filter">
            <option value="all">Todos</option>
            <option value="shopee">Shopee</option>
            <option value="mercado_livre">Mercado Livre</option>
          </select>
        </div>
        <button class="btn" id="btn-refresh">Filtrar</button>
      </div>
      <div class="alert alert-error" id="error-box" hidden></div>
      <div id="result-box" hidden></div>
    </div>
    <div class="card table-container">
      <table class="table" id="listings-table">
        <thead><tr><th>Título</th><th>Canal</th><th>Preço</th><th>Estoque</th><th>Status</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</template>
<script>
  (function () {
    if (customElements.get('listings-widget')) return;

    class ListingsWidget extends HTMLElement {
      connectedCallback() {
        var template = document.getElementById('listings-template');
        var shadow = this.attachShadow({ mode: 'open' });
        shadow.adoptedStyleSheets = [window.__DESIGN_SHEET__];
        shadow.appendChild(template.content.cloneNode(true));
        shadow.getElementById('btn-refresh').addEventListener('click', () => this._load(shadow, true));

        var ds = window.__DataStore;
        var cached = ds && ds.get('listings.all');
        if (cached) {
          this._renderRows(shadow, cached.listings || []);
        }
        this._load(shadow, false);
      }

      _load(shadow, force) {
        var marketplace = shadow.getElementById('marketplace-filter').value;
        var cacheKey = 'listings.' + marketplace;
        var ds = window.__DataStore;

        if (force && ds) ds.invalidate(cacheKey);

        withLoading(
          shadow.getElementById('btn-refresh'),
          (success, failure) =>
            google.script.run
              .withSuccessHandler(success)
              .withFailureHandler(failure)
              .apiDispatch('listings.listUnified', { marketplace: marketplace }),
          (data) => {
            if (ds) ds.set(cacheKey, data);
            this._renderRows(shadow, data.listings || []);
          },
          'Anúncios atualizados.'
        );
      }

      _renderRows(shadow, listings) {
        var tbody = shadow.querySelector('#listings-table tbody');
        tbody.innerHTML = '';
        listings.forEach((item) => {
          var tr = document.createElement('tr');
          var isActive = /active|ativo/i.test(item.status || '');
          tr.innerHTML =
            '<td>' + item.title + '</td>' +
            '<td><span class="badge badge-' + (item.marketplace === 'shopee' ? 'shopee' : 'mercado-livre') + '">' +
            item.marketplace + '</span></td>' +
            '<td>' + (item.price != null ? FormatterService.formatCurrency(item.price) : '-') + '</td>' +
            '<td>' + (item.stock != null ? item.stock : '-') + '</td>' +
            '<td><span class="badge badge-' + (isActive ? 'success' : 'warning') + '">' + item.status + '</span></td>' +
            '<td><button class="btn btn-secondary btn-toggle">' + (isActive ? 'Pausar' : 'Ativar') + '</button></td>';
          tr.querySelector('.btn-toggle').addEventListener('click', () =>
            this._toggle(shadow, tr.querySelector('.btn-toggle'), item, !isActive)
          );
          tbody.appendChild(tr);
        });
        if (!listings.length) {
          tbody.innerHTML = '<tr><td colspan="6">Nenhum anúncio encontrado.</td></tr>';
        }
      }

      _toggle(shadow, button, item, shouldActivate) {
        var ds = window.__DataStore;
        withLoading(
          button,
          (success, failure) =>
            google.script.run
              .withSuccessHandler(success)
              .withFailureHandler(failure)
              .apiDispatch(shouldActivate ? 'listings.activate' : 'listings.pause', {
                marketplace: item.marketplace,
                itemId: item.id
              }),
          () => {
            if (ds) ds.invalidate('listings.all');
            this._load(shadow, true);
          }
        );
      }
    }

    customElements.define('listings-widget', ListingsWidget);
  })();
</script>
