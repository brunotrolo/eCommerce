<template id="catalog-widget-template">
  <style>
    .catalog-table {
      width: 100%;
      border-collapse: collapse;
    }
    .catalog-table th {
      text-align: left;
      padding: var(--space-sm) var(--space-md);
      border-bottom: 2px solid var(--color-border);
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: var(--letter-spacing-micro);
      white-space: nowrap;
    }
    .catalog-table td {
      padding: var(--space-sm) var(--space-md);
      border-bottom: 1px solid var(--color-border);
      font-size: var(--font-size-sm);
      vertical-align: middle;
    }
    .catalog-table tbody tr:hover {
      background: var(--color-surface-hover);
    }
    th[data-sort] {
      cursor: pointer;
      user-select: none;
      position: relative;
      padding-right: 24px !important;
    }
    th[data-sort]:hover { background: var(--color-bg-secondary, #f7f8fa); }
    th[data-sort]::after {
      content: '';
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid var(--color-text-tertiary, #b0b7c3);
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    th[data-sort].sort-asc::after,
    th[data-sort].sort-desc::after { opacity: 1; }
    th[data-sort].sort-desc::after {
      border-top: none;
      border-bottom: 5px solid var(--color-text-tertiary, #b0b7c3);
    }
    .catalog-table .col-codigo {
      font-weight: var(--font-weight-semibold);
      white-space: nowrap;
    }
    .catalog-table .col-desc {
      color: var(--color-text-secondary);
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .catalog-table .col-custo {
      font-weight: var(--font-weight-semibold);
      white-space: nowrap;
    }
    .catalog-price-btn {
      padding: var(--space-xs) var(--space-sm);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
      display: inline-block;
      font-weight: var(--font-weight-semibold);
    }
    .catalog-price-btn.shopee {
      background: #EE4D2D;
      color: #fff;
    }
    .catalog-price-btn.shopee:hover {
      background: #D73211;
    }
    .catalog-price-btn.ml {
      background: #FFE600;
      color: #0D3277;
    }
    .catalog-price-btn.ml:hover {
      background: #E6CF00;
    }
    .catalog-price-label {
      font-size: var(--font-size-xs);
      display: block;
      opacity: 0.9;
    }
    .catalog-price-value {
      font-weight: var(--font-weight-semibold);
    }
    .catalog-margin {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      white-space: nowrap;
    }
    .catalog-margin.good { color: var(--color-success); }
    .catalog-margin.warn { color: var(--color-warning); }
    .catalog-margin.bad { color: var(--color-danger); }
    .catalog-history-btn {
      padding: var(--space-xs) var(--space-sm);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: none;
      cursor: pointer;
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      white-space: nowrap;
    }
    .catalog-history-btn:hover {
      background: var(--color-surface-alt);
      color: var(--color-text);
    }
    .catalog-empty {
      text-align: center;
      padding: var(--space-section);
      color: var(--color-text-secondary);
    }
    .catalog-header {
      flex-shrink: 0;
    }
    .catalog-table-scroll {
      flex: 1;
      overflow: auto;
      min-height: 0;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
    }
    .catalog-table-scroll .catalog-table thead th {
      position: sticky;
      top: 0;
      background: var(--color-surface);
      z-index: 1;
      box-shadow: inset 0 -2px 0 var(--color-border);
    }

    .catalog-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 9990;
      display: none;
    }
    .catalog-overlay[open] { display: block; }

    .catalog-sidebar {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 35vw;
      max-width: 500px;
      min-width: 300px;
      background: var(--color-surface);
      border-left: 1px solid var(--color-border);
      z-index: 9995;
      display: none;
      flex-direction: column;
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.15);
    }
    .catalog-sidebar[open] { display: flex; }
    .catalog-sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-sm) var(--space-md);
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    .catalog-sidebar-header h3 {
      margin: 0;
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-semibold);
    }
    .catalog-sidebar-close {
      background: none;
      border: none;
      font-size: var(--font-size-xl);
      cursor: pointer;
      color: var(--color-text-secondary);
      padding: var(--space-xs);
      line-height: 1;
    }
    .catalog-sidebar-close:hover { color: var(--color-text); }
    .catalog-sidebar-body {
      flex: 1;
      overflow: auto;
      padding: var(--space-md);
    }

    .calc-step {
      padding: var(--space-sm) 0;
      border-bottom: 1px solid var(--color-border);
    }
    .calc-step:last-child { border-bottom: none; }
    .calc-step-desc {
      font-weight: var(--font-weight-semibold);
      margin-bottom: var(--space-xs);
    }
    .calc-step-detail {
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
    }
    .calc-step-formula {
      font-size: var(--font-size-sm);
      font-family: monospace;
      color: var(--color-text-secondary);
      margin-top: var(--space-xs);
    }
    .calc-summary {
      margin-top: var(--space-md);
      padding: var(--space-md);
      background: var(--color-surface-alt);
      border-radius: var(--radius-sm);
    }
    .calc-summary-row {
      display: flex;
      justify-content: space-between;
      padding: var(--space-xs) 0;
      font-size: var(--font-size-sm);
    }
    .calc-summary-row.total {
      font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-md);
      border-top: 1px solid var(--color-border);
      padding-top: var(--space-sm);
      margin-top: var(--space-sm);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay[open] { display: flex; }
    .modal {
      background: var(--color-surface);
      border-radius: var(--radius-md);
      width: 90vw;
      max-width: 800px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-md);
      border-bottom: 1px solid var(--color-border);
    }
    .modal-header h3 { margin: 0; }
    .modal-close {
      background: none;
      border: none;
      font-size: var(--font-size-xl);
      cursor: pointer;
      color: var(--color-text-secondary);
    }
    .modal-body {
      flex: 1;
      overflow: auto;
      padding: var(--space-md);
    }
    .modal .table { width: 100%; }
  </style>

  <div class="widget-grid">
    <div class="card" style="display:flex;flex-direction:column;max-height:calc(100vh - 120px);">
      <div class="catalog-header">
        <h1>Catálogo de Produtos</h1>
        <p class="page-subtitle">Produtos recebidos com preços sugeridos para Shopee e Mercado Livre.</p>

        <div class="filter-bar">
          <input type="text" id="filter-codigo" placeholder="Código..." />
          <input type="text" id="filter-sku" placeholder="SKU..." />
          <input type="text" id="filter-descricao" placeholder="Descrição..." />
          <input type="text" id="filter-categoria" placeholder="Categoria..." />
          <label class="filter-label" for="marginInput">Margem %:</label>
          <input type="number" id="marginInput" value="25" min="0" max="99" step="1" />
          <label class="filter-label" for="sortBy">Ordenar por:</label>
          <select id="sortBy">
            <option value="code">Código</option>
            <option value="sku">SKU</option>
            <option value="categoria">Categoria</option>
            <option value="description">Descrição</option>
            <option value="unitCost">Custo</option>
            <option value="suggestedShopee">Preço Shopee</option>
          </select>
          <button class="btn btn-secondary" id="btn-sort-order">▲ ASC</button>
        </div>

        <div class="page-summary" id="catalog-summary"></div>

        <div id="error-box" class="alert alert-error" hidden></div>
        <div id="result-box" hidden></div>

        <button class="btn" id="btn-load-hidden" style="display:none;">Carregando...</button>
      </div>

      <div class="catalog-table-scroll" id="catalog-content">
        <div class="catalog-empty">Carregando catálogo...</div>
      </div>
    </div>
  </div>

  <div class="catalog-overlay" id="calc-overlay"></div>
  <div class="catalog-sidebar" id="calc-sidebar">
    <div class="catalog-sidebar-header">
      <h3 id="calc-sidebar-title">Memória de Cálculo</h3>
      <button class="catalog-sidebar-close" id="calc-close">&times;</button>
    </div>
    <div class="catalog-sidebar-body" id="calc-sidebar-body"></div>
  </div>

  <div class="modal-overlay" id="history-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="history-title">Histórico do Produto</h3>
        <button class="modal-close" id="history-close">&times;</button>
      </div>
      <div class="modal-body" id="history-body"></div>
    </div>
  </div>
</template>

<script>
  (function () {
    if (customElements.get('catalog-widget')) return;

    var SORT_LABELS = { code: 'Código', sku: 'SKU', categoria: 'Categoria', description: 'Descrição', unitCost: 'Custo', suggestedShopee: 'Preço Shopee' };

    function formatBRL(value) {
      return FormatterService.formatCurrency(value);
    }

    function formatPct(value) {
      return FormatterService.formatPercent(value, 1);
    }

    function marginClass(pct) {
      if (pct >= 20) return 'good';
      if (pct >= 15) return 'warn';
      return 'bad';
    }

    var DEFAULT_FEE_SHOPEE = { pct: 0.20, fixed: 0 };
    var DEFAULT_FEE_ML = { pct: 0.14, fixed: 6 };

    function calcPrice(cost, margin, fee) {
      var denom = 1 - fee.pct - margin;
      if (denom <= 0) return 0;
      return Math.round(((cost + fee.fixed) / denom) * 100) / 100;
    }

    function calcMargin(price, cost, fee) {
      var marketplaceFee = Math.round((price * fee.pct + fee.fixed) * 100) / 100;
      var netProfit = Math.round((price - marketplaceFee - cost) * 100) / 100;
      return price > 0 ? Math.round((netProfit / price) * 10000) / 10000 : 0;
    }

    class CatalogWidget extends HTMLElement {
      connectedCallback() {
        var template = document.getElementById('catalog-widget-template');
        var shadow = this.attachShadow({ mode: 'open' });
        shadow.adoptedStyleSheets = [window.__DESIGN_SHEET__];
        shadow.appendChild(template.content.cloneNode(true));

        this._shadow = shadow;
        this._sortOrder = 'asc';
        this._sortField = null;
        this._products = [];
        this._filteredProducts = [];
        this._margin = 0.25;
        this._feeShopee = DEFAULT_FEE_SHOPEE;
        this._feeML = DEFAULT_FEE_ML;
        this._filterDebounceTimer = null;

        shadow.getElementById('btn-sort-order').addEventListener('click', function () {
          this._sortOrder = this._sortOrder === 'asc' ? 'desc' : 'asc';
          shadow.getElementById('btn-sort-order').textContent = this._sortOrder === 'asc' ? '▲ ASC' : '▼ DESC';
          this._renderProducts(shadow);
        }.bind(this));

        shadow.getElementById('sortBy').addEventListener('change', function () {
          this._renderProducts(shadow);
        }.bind(this));

        ['filter-codigo', 'filter-sku', 'filter-descricao', 'filter-categoria'].forEach(function (id) {
          shadow.getElementById(id).addEventListener('input', function () {
            var self = this;
            clearTimeout(self._filterDebounceTimer);
            self._filterDebounceTimer = setTimeout(function () {
              self._applyFilterAndRender(shadow);
            }, 300);
          }.bind(this));
        }.bind(this));

        shadow.getElementById('marginInput').addEventListener('input', function () {
          var val = parseFloat(shadow.getElementById('marginInput').value);
          this._margin = isNaN(val) ? 0 : val / 100;
          this._recalcAndRender(shadow);
        }.bind(this));

        shadow.getElementById('calc-close').addEventListener('click', function () {
          this._closeCalcSidebar(shadow);
        }.bind(this));

        shadow.getElementById('calc-overlay').addEventListener('click', function () {
          this._closeCalcSidebar(shadow);
        }.bind(this));

        shadow.getElementById('history-close').addEventListener('click', function () {
          this._closeHistoryModal(shadow);
        }.bind(this));

        shadow.getElementById('history-overlay').addEventListener('click', function (e) {
          if (e.target === shadow.getElementById('history-overlay')) {
            this._closeHistoryModal(shadow);
          }
        }.bind(this));

        this._loadConfig(shadow);
      }

      _loadConfig(shadow) {
        var self = this;
        var ds = window.__DataStore;

        if (ds && ds.has('config.config')) {
          var data = ds.get('config.config');
          if (data && data.fees) {
            self._feeShopee = data.fees.shopee || DEFAULT_FEE_SHOPEE;
            self._feeML = data.fees.mercado_livre || DEFAULT_FEE_ML;
          }
          if (data && typeof data.defaultMargin === 'number') {
            self._margin = data.defaultMargin;
            shadow.getElementById('marginInput').value = Math.round(data.defaultMargin * 100);
          }
          self._loadProducts(shadow);
          return;
        }

        google.script.run
          .withSuccessHandler(function (response) {
            var outer = response.data || response;
            var data = outer.data || outer;
            if (ds) ds.set('config.config', data);
            if (data && data.fees) {
              self._feeShopee = data.fees.shopee || DEFAULT_FEE_SHOPEE;
              self._feeML = data.fees.mercado_livre || DEFAULT_FEE_ML;
            }
            if (data && typeof data.defaultMargin === 'number') {
              self._margin = data.defaultMargin;
              shadow.getElementById('marginInput').value = Math.round(data.defaultMargin * 100);
            }
            self._loadProducts(shadow);
          })
          .withFailureHandler(function (err) {
            showError(shadow, (err && err.message) || 'Erro ao carregar a configuração. Usando padrões.');
            self._loadProducts(shadow);
          })
          .apiDispatch('config.getConfig', {});
      }

      _loadProducts(shadow) {
        var self = this;
        var sortBy = shadow.getElementById('sortBy').value;
        var sortOrder = this._sortOrder;
        var ds = window.__DataStore;
        var cacheKey = 'catalog.products.' + sortBy + '.' + sortOrder;

        if (ds && ds.has(cacheKey)) {
          self._products = ds.get(cacheKey) || [];
          self._recalcAndRender(shadow);
          return;
        }

        withLoading(
          shadow.getElementById('btn-load-hidden'),
          function (success, failure) {
            google.script.run
              .withSuccessHandler(success)
              .withFailureHandler(failure)
              .apiDispatch('catalog.getProducts', {
                sortBy: sortBy,
                sortOrder: sortOrder
              });
          },
          function (data) {
            self._products = data.data || [];
            if (ds) ds.set(cacheKey, self._products);
            self._recalcAndRender(shadow);
          },
          null
        );
      }

      _recalcAndRender(shadow) {
        var margin = this._margin;
        var feeShopee = this._feeShopee;
        var feeML = this._feeML;
        var products = this._products;
        for (var i = 0; i < products.length; i++) {
          var p = products[i];
          var cost = p.valorUnitarioLiquido;
          p.precoShopee = calcPrice(cost, margin, feeShopee);
          p.precoMercadoLivre = calcPrice(cost, margin, feeML);
          p.margemCalculadaShopee = calcMargin(p.precoShopee, cost, feeShopee);
          p.margemCalculadaMercadoLivre = calcMargin(p.precoMercadoLivre, cost, feeML);
        }
        this._applyFilterAndRender(shadow);
      }

      _applyFilterAndRender(shadow) {
        var fCodigo = (shadow.getElementById('filter-codigo').value || '').toLowerCase().trim();
        var fSku = (shadow.getElementById('filter-sku').value || '').toLowerCase().trim();
        var fDescricao = (shadow.getElementById('filter-descricao').value || '').toLowerCase().trim();
        var fCategoria = (shadow.getElementById('filter-categoria').value || '').toLowerCase().trim();
        var products = this._products;
        var anyFilter = fCodigo || fSku || fDescricao || fCategoria;

        if (!anyFilter) {
          this._filteredProducts = products;
        } else {
          this._filteredProducts = products.filter(function (p) {
            if (fCodigo && (p.codigoProduto || '').toLowerCase().indexOf(fCodigo) === -1) return false;
            if (fSku && (p.sku || '').toLowerCase().indexOf(fSku) === -1) return false;
            if (fDescricao && (p.descricaoProduto || '').toLowerCase().indexOf(fDescricao) === -1) return false;
            if (fCategoria && (p.categoria || '').toLowerCase().indexOf(fCategoria) === -1) return false;
            return true;
          });
        }

        this._renderSummary(shadow, this._filteredProducts);
        this._renderProducts(shadow);
      }

      _renderSummary(shadow, products) {
        var total = products.length;
        var estoque = 0;
        var custoTotal = 0;
        var precoShopee = 0;
        var precoMercadoLivre = 0;
        for (var i = 0; i < products.length; i++) {
          var p = products[i];
          estoque += Number(p.estoqueDisponivel) || 0;
          custoTotal += (Number(p.valorUnitarioLiquido) || 0) * (Number(p.estoqueDisponivel) || 0);
          precoShopee += (Number(p.precoShopee) || 0) * (Number(p.estoqueDisponivel) || 0);
          precoMercadoLivre += (Number(p.precoMercadoLivre) || 0) * (Number(p.estoqueDisponivel) || 0);
        }
        var summaryEl = shadow.getElementById('catalog-summary');
        summaryEl.innerHTML =
          '<div class="stat"><div class="stat-value">' + total + '</div><div class="stat-label">Produtos</div></div>' +
          '<div class="stat"><div class="stat-value">' + estoque.toLocaleString('pt-BR') + '</div><div class="stat-label">Estoque (und)</div></div>' +
          '<div class="stat"><div class="stat-value">' + formatBRL(custoTotal) + '</div><div class="stat-label">Custo total</div></div>' +
          '<div class="stat"><div class="stat-value">' + formatBRL(precoShopee) + '</div><div class="stat-label">Preço Shopee</div></div>' +
          '<div class="stat"><div class="stat-value">' + formatBRL(precoMercadoLivre) + '</div><div class="stat-label">Preço ML</div></div>';
      }

      _renderProducts(shadow) {
        var container = shadow.getElementById('catalog-content');
        var products = this._filteredProducts;
        var sortOrder = this._sortOrder;

        if (!products || products.length === 0) {
          container.innerHTML = '<div class="catalog-empty">Nenhum produto encontrado.</div>';
          return;
        }

        var sortMap = {
          'codigo': 'codigoProduto',
          'sku': 'sku',
          'categoria': 'categoria',
          'descricao': 'descricaoProduto',
          'unitCost': 'valorUnitarioLiquido',
          'estoque': 'estoqueDisponivel',
          'vendido': 'quantidadeVendida',
          'shopee': 'precoShopee',
          'ml': 'precoMercadoLivre',
          'margin': 'margemCalculadaShopee'
        };
        var sortField = this._sortField
          ? (sortMap[this._sortField] || 'codigoProduto')
          : (sortMap[shadow.getElementById('sortBy').value] || 'codigoProduto');

        var sorted = products.slice();
        sorted.sort(function (a, b) {
          var valA = a[sortField];
          var valB = b[sortField];
          if (typeof valA === 'string') { valA = valA.toLowerCase(); valB = (valB || '').toLowerCase(); }
          if (valA < valB) return sortOrder === 'asc' ? -1 : 1;
          if (valA > valB) return sortOrder === 'asc' ? 1 : -1;
          return 0;
        });

        var html = '<table class="catalog-table" id="catalog-main-table"><thead><tr>';
        html += '<th data-sort="codigo">Código</th>';
        html += '<th data-sort="sku">SKU</th>';
        html += '<th data-sort="categoria">Categoria</th>';
        html += '<th data-sort="descricao">Descrição</th>';
        html += '<th data-sort="unitCost">Custo Unit.</th>';
        html += '<th data-sort="estoque">Em estoque</th>';
        html += '<th data-sort="vendido">Vendido</th>';
        html += '<th data-sort="shopee">Preço Shopee</th>';
        html += '<th data-sort="ml">Preço ML</th>';
        html += '<th data-sort="margin">Margem</th>';
        html += '<th></th>';
        html += '</tr></thead><tbody>';

        for (var i = 0; i < sorted.length; i++) {
          var p = sorted[i];
          var marginShopee = marginClass(p.margemCalculadaShopee);

          html += '<tr>';
          html += '<td class="col-codigo">' + (p.codigoProduto || '') + '</td>';
          html += '<td>' + (p.sku || '-') + '</td>';
          html += '<td>' + (p.categoria || '-') + '</td>';
          html += '<td class="col-desc" title="' + (p.descricaoProduto || '') + '">' + (p.descricaoProduto || '-') + '</td>';
          html += '<td class="col-custo">' + formatBRL(p.valorUnitarioLiquido) + '</td>';
          html += '<td>' + (p.estoqueDisponivel || 0) + '</td>';
          html += '<td>' + (p.quantidadeVendida || 0) + '</td>';
          html += '<td><button class="catalog-price-btn shopee" data-cod="' + (p.codigoProduto || '') + '" data-mp="shopee">';
          html += '<span class="catalog-price-label">Shopee</span>';
          html += '<span class="catalog-price-value">' + formatBRL(p.precoShopee) + '</span>';
          html += '</button></td>';
          html += '<td><button class="catalog-price-btn ml" data-cod="' + (p.codigoProduto || '') + '" data-mp="mercado_livre">';
          html += '<span class="catalog-price-label">ML</span>';
          html += '<span class="catalog-price-value">' + formatBRL(p.precoMercadoLivre) + '</span>';
          html += '</button></td>';
          html += '<td><span class="catalog-margin ' + marginShopee + '">' + formatPct(p.margemCalculadaShopee) + '</span></td>';
          html += '<td><button class="catalog-history-btn" data-cod="' + (p.codigoProduto || '') + '">Histórico</button></td>';
          html += '</tr>';
        }

        html += '</tbody></table>';

        container.innerHTML = html;

        var self = this;
        var tableEl = container.querySelector('#catalog-main-table');
        if (tableEl) {
          var ths = tableEl.querySelectorAll('th[data-sort]');
          for (var t = 0; t < ths.length; t++) {
            ths[t].classList.remove('sort-asc', 'sort-desc');
            if (this._sortField && ths[t].getAttribute('data-sort') === this._sortField) {
              ths[t].classList.add(sortOrder === 'asc' ? 'sort-asc' : 'sort-desc');
            }
          }
          for (var h = 0; h < ths.length; h++) {
            ths[h].addEventListener('click', function () {
              var field = this.getAttribute('data-sort');
              if (self._sortField === field) {
                self._sortOrder = self._sortOrder === 'asc' ? 'desc' : 'asc';
              } else {
                self._sortField = field;
                self._sortOrder = 'asc';
              }
              shadow.getElementById('btn-sort-order').textContent = self._sortOrder === 'asc' ? '▲ ASC' : '▼ DESC';
              self._renderProducts(shadow);
            });
          }
        }

        container.querySelectorAll('.catalog-price-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            self._openCalcSidebar(shadow, btn.dataset.cod, btn.dataset.mp);
          });
        });

        container.querySelectorAll('.catalog-history-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            self._openHistoryModal(shadow, btn.dataset.cod);
          });
        });
      }

      _openCalcSidebar(shadow, codigoProduto, marketplace) {
        var self = this;
        var overlay = shadow.getElementById('calc-overlay');
        var sidebar = shadow.getElementById('calc-sidebar');
        var title = shadow.getElementById('calc-sidebar-title');
        var body = shadow.getElementById('calc-sidebar-body');

        title.textContent = 'Memória de Cálculo — ' + (marketplace === 'shopee' ? 'Shopee' : 'Mercado Livre');
        body.innerHTML = '<div class="catalog-empty">Carregando...</div>';
        overlay.setAttribute('open', '');
        sidebar.setAttribute('open', '');

        google.script.run
          .withSuccessHandler(function (response) {
            var outer = response.data || response;
            var data = outer.data || outer;
            if (data.error) {
              body.innerHTML = '<div class="catalog-empty">' + data.error + '</div>';
              return;
            }
            self._renderCalcMemory(body, data);
          })
          .withFailureHandler(function (err) {
            body.innerHTML = '<div class="catalog-empty">Erro: ' + err.message + '</div>';
          })
          .apiDispatch('catalog.getCalculationMemory', {
            codigoProduto: codigoProduto,
            marketplace: marketplace,
            targetMargin: self._margin
          });
      }

      _renderCalcMemory(container, data) {
        var html = '<div style="margin-bottom: var(--space-md);"><strong>' + (data.codigoProduto || '') + '</strong> — ' + (data.descricao || '') + '</div>';

        if (data.passos && data.passos.length) {
          for (var i = 0; i < data.passos.length; i++) {
            var step = data.passos[i];
            html += '<div class="calc-step">';
            html += '<div class="calc-step-desc">' + step.descricao + '</div>';
            html += '<div class="calc-step-detail">' + step.detalhes + '</div>';
            html += '<div class="calc-step-formula">' + step.formula + '</div>';
            html += '</div>';
          }
        }

        if (data.resumo) {
          var r = data.resumo;
          html += '<div class="calc-summary">';
          html += '<div class="calc-summary-row"><span>Custo Unitário</span><span>' + formatBRL(r.valorUnitarioLiquido) + '</span></div>';
          html += '<div class="calc-summary-row"><span>Margem Alvo</span><span>' + (r.margemAlvo * 100).toFixed(0) + '%</span></div>';
          html += '<div class="calc-summary-row"><span>Taxa</span><span>' + r.taxaMarketplace.descricao + '</span></div>';
          html += '<div class="calc-summary-row total"><span>Preço Sugerido</span><span>' + formatBRL(r.precoSugerido) + '</span></div>';
          html += '<div class="calc-summary-row"><span>Margem Líquida</span><span>' + formatPct(r.margemLiquida) + '</span></div>';
          html += '<div class="calc-summary-row"><span>Lucro por Unidade</span><span>' + formatBRL(r.lucroLiquidoPorUnidade) + '</span></div>';
          html += '</div>';
        }

        container.innerHTML = html;
      }

      _closeCalcSidebar(shadow) {
        shadow.getElementById('calc-overlay').removeAttribute('open');
        shadow.getElementById('calc-sidebar').removeAttribute('open');
      }

      _openHistoryModal(shadow, codigoProduto) {
        var self = this;
        var overlay = shadow.getElementById('history-overlay');
        var title = shadow.getElementById('history-title');
        var body = shadow.getElementById('history-body');

        title.textContent = 'Histórico — ' + codigoProduto;
        body.innerHTML = '<div class="catalog-empty">Carregando...</div>';
        overlay.setAttribute('open', '');

        google.script.run
          .withSuccessHandler(function (response) {
            var outer = response.data || response;
            var data = outer.data || outer;
            if (data.error) {
              body.innerHTML = '<div class="catalog-empty">' + data.error + '</div>';
              return;
            }
            self._renderHistory(body, data);
          })
          .withFailureHandler(function (err) {
            body.innerHTML = '<div class="catalog-empty">Erro: ' + err.message + '</div>';
          })
          .apiDispatch('catalog.getProductByCode', {
            codigoProduto: codigoProduto
          });
      }

      _renderHistory(container, data) {
        var entries = Array.isArray(data) ? data : (data.data || []);
        if (!entries.length) {
          container.innerHTML = '<div class="catalog-empty">Nenhuma entrada encontrada.</div>';
          return;
        }

        var html = '<table class="table"><thead><tr>';
        html += '<th>NFe</th><th>Data</th><th>Fornecedor</th><th>Qtd</th><th>V Unit</th><th>V Líquido</th><th>Status</th>';
        html += '</tr></thead><tbody>';

        for (var i = 0; i < entries.length; i++) {
          var e = entries[i];
          html += '<tr>';
          html += '<td>' + (e.numeroNf || '') + '</td>';
          html += '<td>' + (e.dataEmissao ? FormatterService.formatDate(FormatterService.parseDate(e.dataEmissao)) : '-') + '</td>';
          html += '<td>' + (e.emitenteNome || '') + '</td>';
          html += '<td>' + (e.quantidade || 0) + '</td>';
          html += '<td>' + formatBRL(e.valorUnitario) + '</td>';
          html += '<td>' + formatBRL(e.valorUnitarioLiquido) + '</td>';
          html += '<td>' + (e.status || '') + '</td>';
          html += '</tr>';
        }

        html += '</tbody></table>';
        container.innerHTML = html;
      }

      _closeHistoryModal(shadow) {
        shadow.getElementById('history-overlay').removeAttribute('open');
      }
    }

    customElements.define('catalog-widget', CatalogWidget);
  })();
</script>
