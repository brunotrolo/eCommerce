<template id="manual-saida-list-template">
  <style>
    :host { display: block; }

    .container { padding: var(--space-xl); }

    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: var(--space-xl);
    }
    .header h1 {
      margin: 0; font-size: var(--font-size-xl); font-weight: var(--font-weight-bold);
      color: var(--color-text);
    }

    .btn {
      padding: var(--space-sm) var(--space-lg); border-radius: var(--radius-sm);
      font-size: var(--font-size-sm); font-weight: var(--font-weight-medium);
      cursor: pointer; border: 1px solid var(--color-border);
      background: var(--color-surface); color: var(--color-text);
    }
    .btn:hover { background: var(--color-surface-hover); }
    .btn-primary {
      background: var(--color-primary); color: var(--color-on-primary);
      border-color: var(--color-primary);
    }
    .btn-primary:hover { background: var(--color-primary-hover); }

    .search-bar {
      margin-bottom: var(--space-lg);
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-sm);
      align-items: center;
    }
    .filters input,
    .filters select {
      padding: var(--space-xs) var(--space-sm);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      color: var(--color-text);
      font-size: var(--font-size-sm);
    }
    .filters input { flex: 1 1 130px; min-width: 110px; }
    .filters input:focus,
    .filters select:focus {
      outline: none;
      border-color: var(--color-primary);
    }
    .filters-hint {
      margin-top: var(--space-xs);
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
    }

    .table-wrapper {
      overflow-x: auto; border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
    }

    table {
      width: 100%; border-collapse: collapse;
      font-size: var(--font-size-sm); color: var(--color-text);
    }

    th {
      text-align: left; padding: var(--space-sm) var(--space-md);
      background: var(--color-surface-alt); font-weight: var(--font-weight-semibold);
      border-bottom: 1px solid var(--color-border);
      white-space: nowrap; cursor: pointer; user-select: none;
    }
    th:hover { background: var(--color-surface-hover); }
    th .sort-icon { margin-left: var(--space-xs); color: var(--color-text-tertiary); }

    td {
      padding: var(--space-sm) var(--space-md);
      border-bottom: 1px solid var(--color-border-light);
      white-space: nowrap;
    }

    tr:hover td { background: var(--color-surface-hover); }

    .empty-state {
      text-align: center; padding: var(--space-3xl);
      color: var(--color-text-secondary);
    }
    .empty-state p { margin: 0; font-size: var(--font-size-md); }

    .stats {
      display: flex;
      gap: var(--space-lg);
      flex-wrap: wrap;
      margin-bottom: var(--space-lg);
    }
    .stats .stat { text-align: center; }
    .stats .stat-value {
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-semibold);
      letter-spacing: var(--letter-spacing-tight);
      color: var(--color-text);
    }
    .stats .stat-label {
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: var(--letter-spacing-micro);
    }

    .loading {
      text-align: center; padding: var(--space-3xl);
      color: var(--color-text-tertiary);
    }

    .badge {
      display: inline-block; padding: 2px var(--space-sm);
      border-radius: var(--radius-xs); font-size: var(--font-size-xs);
      font-weight: var(--font-weight-medium);
    }
    .badge-success {
      background: var(--color-success-light); color: var(--color-success-text);
    }
  </style>

  <div class="container">
    <div class="header">
      <h1>Saída Manual de Produtos</h1>
      <button class="btn btn-primary" id="btn-add">+ Inserir Novo Item</button>
    </div>

    <div class="stats" id="stats">
      <div class="stat"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total</div></div>
      <div class="stat"><div class="stat-value" id="stat-vendas">0</div><div class="stat-label">Vendas</div></div>
      <div class="stat"><div class="stat-value" id="stat-outros">0</div><div class="stat-label">Outros</div></div>
      <div class="stat"><div class="stat-value" id="stat-alertas">0</div><div class="stat-label">Alertas</div></div>
      <div class="stat" style="border-left: 1px solid var(--color-border); padding-left: var(--space-lg);"><div class="stat-value" id="stat-valor">R$ 0,00</div><div class="stat-label">Valor Total</div></div>
      <div class="stat"><div class="stat-value" id="stat-preco-shopee">R$ 0,00</div><div class="stat-label">Preco Shopee</div></div>
      <div class="stat"><div class="stat-value" id="stat-preco-ml">R$ 0,00</div><div class="stat-label">Preco ML</div></div>
    </div>

    <div class="search-bar">
      <div class="filters">
        <input type="text" id="filter-codigo" placeholder="Código..." />
        <input type="text" id="filter-categoria" placeholder="Categoria..." />
        <input type="text" id="filter-descricao" placeholder="Descrição..." />
        <input type="text" id="filter-cliente" placeholder="Cliente..." />
        <input type="text" id="filter-ncm" placeholder="NCM..." />
        <select id="filter-tipo">
          <option value="">Tipo: todos</option>
          <option value="Venda">Venda</option>
          <option value="Devolução">Devolução</option>
          <option value="Perda">Perda</option>
          <option value="Ajuste">Ajuste</option>
          <option value="Brinde">Brinde</option>
        </select>
      </div>
      <div class="filters-hint">Filtros combinados por coluna — digite e filtra na hora.</div>
    </div>

    <div id="content">
      <div class="loading">Carregando...</div>
    </div>
  </div>

  <manual-saida-widget id="modal-widget"></manual-saida-widget>
</template>

<script>
(function () {
  if (document.getElementById('manual-saida-list-widget')) return;

  var template = document.getElementById('manual-saida-list-template');
  if (!template) return;

  var TAG = 'manual-saida-list-widget';

  customElements.define(TAG, class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
      this.shadowRoot.appendChild(template.content.cloneNode(true));
      if (window.__DESIGN_SHEET__) {
        this.shadowRoot.adoptedStyleSheets = [window.__DESIGN_SHEET__];
      }
      this._entries = [];
      this._filtered = [];
      this._sortField = 'dataSaida';
      this._sortOrder = 'desc';
    }

    connectedCallback() {
      this._loadData();
      this._bindEvents();
    }

    _bindEvents() {
      var self = this;

      this.shadowRoot.getElementById('btn-add').addEventListener('click', function () {
        var modal = self.shadowRoot.getElementById('modal-widget');
        if (modal) {
          modal.setOnSaveCallback(function () {
            var ds = window.__DataStore;
            if (ds) ds.invalidate('manualSaida.listExits');
            self._loadData();
          });
          modal.open();
        }
      });

      var filterIds = ['filter-codigo', 'filter-categoria', 'filter-descricao', 'filter-cliente', 'filter-ncm', 'filter-tipo'];
      for (var f = 0; f < filterIds.length; f++) {
        (function (id) {
          var el = self.shadowRoot.getElementById(id);
          if (!el) return;
          el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', function () {
            self._applyFilters();
          });
        })(filterIds[f]);
      }
    }

    _loadData() {
      var self = this;
      var cacheKey = 'manualSaida.listExits';
      var ds = window.__DataStore;

      var cached = ds && ds.get(cacheKey);
      if (cached) {
        self._entries = cached.exits || cached.data && cached.data.exits || [];
        self._applyFilters();
        return;
      }

      self.shadowRoot.getElementById('content').innerHTML = '<div class="loading">Carregando...</div>';

      google.script.run
        .withSuccessHandler(function (result) {
          if (ds) ds.set(cacheKey, result);
          if (result && result.data) {
            self._entries = result.data.exits || [];
          } else if (result && result.exits) {
            self._entries = result.exits || [];
          } else {
            self._entries = [];
          }
          self._applyFilters();
        })
        .withFailureHandler(function (e) {
          self.shadowRoot.getElementById('content').innerHTML =
            '<div class="empty-state"><p>Erro ao carregar: ' + e.message + '</p></div>';
        })
        .apiDispatch('manualSaida.listExits', { limit: 500 });
    }

    _applyFilters() {
      var self = this;
      var v = function (id) {
        var el = self.shadowRoot.getElementById(id);
        return el ? el.value.trim().toLowerCase() : '';
      };
      var fCod = v('filter-codigo');
      var fCat = v('filter-categoria');
      var fDesc = v('filter-descricao');
      var fCli = v('filter-cliente');
      var fNcm = v('filter-ncm');
      var fTipo = v('filter-tipo');

      this._filtered = this._entries.filter(function (e) {
        if (fCod && String(e.codigoProduto || '').toLowerCase().indexOf(fCod) === -1) return false;
        if (fCat && String(e.categoria || '').toLowerCase().indexOf(fCat) === -1) return false;
        if (fDesc && String(e.descricaoProduto || '').toLowerCase().indexOf(fDesc) === -1) return false;
        if (fCli && String(e.clienteNome || '').toLowerCase().indexOf(fCli) === -1) return false;
        if (fNcm && String(e.ncm || '').toLowerCase().indexOf(fNcm) === -1) return false;
        if (fTipo && String(e.tipoSaida || '').toLowerCase() !== fTipo.toLowerCase()) return false;
        return true;
      });

      this._updateStats(this._filtered);
      this._render();
    }

    _updateStats(items) {
      var set = items || [];
      var total = 0;
      var vendas = 0;
      var outros = 0;
      var alertas = 0;
      var somaValor = 0;
      var somaShopee = 0;
      var somaML = 0;
      for (var i = 0; i < set.length; i++) {
        var qtd = parseFloat(set[i].quantidade) || 0;
        var tipo = String(set[i].tipoSaida || '').trim();
        total += qtd;
        if (tipo === 'Venda') vendas += qtd;
        else outros += qtd;
        var precoShopee = parseFloat(set[i].precoSugeridoShopee) || 0;
        var precoML = parseFloat(set[i].precoSugeridoMercadoLivre) || 0;
        if (precoShopee <= 0 && precoML <= 0) alertas++;
        somaShopee += qtd * precoShopee;
        somaML += qtd * precoML;
        somaValor += parseFloat(set[i].valorTotal) || 0;
      }
      this.shadowRoot.getElementById('stat-total').textContent = Math.round(total);
      this.shadowRoot.getElementById('stat-vendas').textContent = Math.round(vendas);
      this.shadowRoot.getElementById('stat-outros').textContent = Math.round(outros);
      this.shadowRoot.getElementById('stat-alertas').textContent = alertas;
      this.shadowRoot.getElementById('stat-valor').textContent = FormatterService.formatCurrency(somaValor);
      this.shadowRoot.getElementById('stat-preco-shopee').textContent = FormatterService.formatCurrency(somaShopee);
      this.shadowRoot.getElementById('stat-preco-ml').textContent = FormatterService.formatCurrency(somaML);
    }

    _render() {
      var self = this;
      var content = this.shadowRoot.getElementById('content');

      if (this._filtered.length === 0) {
        content.innerHTML = '<div class="empty-state"><p>Nenhuma saída manual registrada.</p></div>';
        return;
      }

      var sorted = this._filtered.slice().sort(function (a, b) {
        var field = self._sortField;
        var valA = a[field] || '';
        var valB = b[field] || '';
        if (typeof valA === 'number' && typeof valB === 'number') {
          return self._sortOrder === 'asc' ? valA - valB : valB - valA;
        }
        valA = String(valA).toLowerCase();
        valB = String(valB).toLowerCase();
        if (valA < valB) return self._sortOrder === 'asc' ? -1 : 1;
        if (valA > valB) return self._sortOrder === 'asc' ? 1 : -1;
        return 0;
      });

      var sortIcon = function (field) {
        if (self._sortField !== field) return '';
        return '<span class="sort-icon">' + (self._sortOrder === 'asc' ? '▲' : '▼') + '</span>';
      };

      var html = '<div class="table-wrapper"><table>' +
        '<thead><tr>' +
        '<th data-sort="codigoProduto">Código ' + sortIcon('codigoProduto') + '</th>' +
        '<th data-sort="categoria">Categoria ' + sortIcon('categoria') + '</th>' +
        '<th data-sort="descricaoProduto">Descrição ' + sortIcon('descricaoProduto') + '</th>' +
        '<th data-sort="tipoSaida">Tipo Saída ' + sortIcon('tipoSaida') + '</th>' +
        '<th data-sort="quantidade">Qtd ' + sortIcon('quantidade') + '</th>' +
        '<th data-sort="valorTotal">Valor Total ' + sortIcon('valorTotal') + '</th>' +
        '<th data-sort="clienteNome">Cliente ' + sortIcon('clienteNome') + '</th>' +
        '<th data-sort="dataSaida">Data Saída ' + sortIcon('dataSaida') + '</th>' +
        '<th data-sort="status">Status ' + sortIcon('status') + '</th>' +
        '</tr></thead><tbody>';

      for (var j = 0; j < sorted.length; j++) {
        var e = sorted[j];
        html += '<tr>' +
          '<td>' + (e.codigoProduto || '') + '</td>' +
          '<td>' + (e.categoria || '') + '</td>' +
          '<td>' + (e.descricaoProduto || '') + '</td>' +
          '<td>' + (e.tipoSaida || '') + '</td>' +
          '<td>' + (e.quantidade || 0) + '</td>' +
          '<td>' + FormatterService.formatCurrency(e.valorTotal || 0) + '</td>' +
          '<td>' + (e.clienteNome || '') + '</td>' +
          '<td>' + (e.dataSaida || '') + '</td>' +
          '<td><span class="badge badge-success">' + (e.status || 'Saído') + '</span></td>' +
          '</tr>';
      }

      html += '</tbody></table></div>';
      content.innerHTML = html;

      var ths = content.querySelectorAll('th[data-sort]');
      for (var k = 0; k < ths.length; k++) {
        ths[k].addEventListener('click', function () {
          var field = this.getAttribute('data-sort');
          if (self._sortField === field) {
            self._sortOrder = self._sortOrder === 'asc' ? 'desc' : 'asc';
          } else {
            self._sortField = field;
            self._sortOrder = 'asc';
          }
          self._render();
        });
      }
    }
  });
})();
</script>
