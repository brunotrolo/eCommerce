<template id="dashboard-template">
  <style>
    .modal-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0, 0, 0, 0.5);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-lg); width: 95vw; max-width: 480px;
      padding: var(--space-xl); box-shadow: var(--shadow-lg);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-lg); }
    .modal-header h2 { margin: 0; font-size: var(--font-size-lg); font-weight: var(--font-weight-bold); color: var(--color-text); }
    .btn-close {
      background: none; border: none; cursor: pointer;
      font-size: var(--font-size-lg); color: var(--color-text-secondary);
      padding: var(--space-xs); border-radius: var(--radius-xs);
    }
    .btn-close:hover { background: var(--color-surface-hover); }
    .btn-close:disabled { cursor: default; opacity: 0.4; }
    .sync-status { font-size: var(--font-size-base); font-weight: var(--font-weight-medium); color: var(--color-text); margin-bottom: var(--space-xs); }
    .sync-stage { font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--space-sm); min-height: 1.2em; }
    .progress-track { height: 8px; border-radius: var(--radius-full); background: var(--color-surface-alt); overflow: hidden; margin-bottom: var(--space-md); }
    .progress-fill { height: 100%; width: 0%; background: var(--color-primary); border-radius: var(--radius-full); transition: width 0.25s ease; }
    .sync-summary { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
  </style>
  <div class="widget-grid">
    <div class="card">
      <h1>Dashboard</h1>
      <p class="page-subtitle">Visao unificada de vendas, pedidos e estoque das duas lojas.</p>

      <div class="page-actions">
        <button class="btn btn-secondary" id="btn-refresh">Atualizar</button>
        <button class="btn" id="btn-sync-all">Sincronizar Tudo</button>
      </div>

      <div class="alert alert-error" id="error-box" hidden></div>
      <div id="result-box" hidden></div>
      <div class="loading-state" id="loading-state" hidden>Carregando resumo...</div>
    </div>
    <div class="stat-grid" id="stat-grid"></div>
    <div class="card table-container">
      <h3>Pedidos recentes</h3>
      <table class="table" id="orders-table">
        <thead><tr><th>ID</th><th>Canal</th><th>Status</th><th>Total</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="modal-overlay" id="sync-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Sincronizando Dados</h2>
        <button class="btn-close" id="btn-sync-close" title="Fechar">&times;</button>
      </div>
      <div class="sync-status" id="sync-status">Preparando...</div>
      <div class="sync-stage" id="sync-stage"></div>
      <div class="progress-track"><div class="progress-fill" id="sync-progress"></div></div>
      <div class="sync-summary" id="sync-summary"></div>
    </div>
  </div>
</template>
<script>
  (function () {
    if (customElements.get('dashboard-widget')) return;

    var STEP_LABELS = {
      'nfeEntrada.syncAndUpdateSheets': 'NF-e do Drive',
      'estoque.sincronizar': 'Estoque (NFs + Entradas)',
      'estoque.sincronizarPrecosCatalogo': 'Precos do Catalogo',
      'produtoSkuMap.syncListings': 'Anuncios Shopee (SKU)',
      'ordersImport.importShopeeOrders': 'Pedidos Shopee'
    };

    class DashboardWidget extends HTMLElement {
      connectedCallback() {
        var template = document.getElementById('dashboard-template');
        var shadow = this.attachShadow({ mode: 'open' });
        shadow.adoptedStyleSheets = [window.__DESIGN_SHEET__];
        shadow.appendChild(template.content.cloneNode(true));
        shadow.getElementById('btn-refresh').addEventListener('click', () => this._load(shadow, true));
        shadow.getElementById('btn-sync-all').addEventListener('click', () => this._syncAll(shadow));
        shadow.getElementById('btn-sync-close').addEventListener('click', function () {
          shadow.getElementById('sync-overlay').classList.remove('open');
        });

        var cached = window.__DataClient.snapshot('dashboard.getSummary', {}, { key: 'dashboard.summary' });
        if (cached) {
          render(shadow, cached);
        }
        this._load(shadow, false);
      }

      _load(shadow, force) {
        var self = this;
        var dc = window.__DataClient;
        if (force) dc.invalidate('dashboard.summary');
        if (!force) {
          var ls = shadow.getElementById('loading-state');
          if (ls) ls.hidden = false;
          dc.fetchData('dashboard.getSummary', {}, { key: 'dashboard.summary' }).then(function (data) {
            if (data) render(shadow, data);
            if (ls) ls.hidden = true;
          }).catch(function (err) {
            if (ls) ls.hidden = true;
            showError(shadow, (err && err.message) || 'Erro ao carregar o dashboard.');
          });
          return;
        }
        withLoading(
          shadow.getElementById('btn-refresh'),
          (success, failure) =>
            dc.run('dashboard.getSummary', { forceFresh: true }, { success: success, failure: failure }),
          (data) => {
            dc.set('dashboard.summary', data);
            render(shadow, data);
          },
          (data) => (data && data.fromCache ? 'Dados em cache (ate 5 min).' : 'Dados atualizados agora.')
        );
      }

      _syncAll(shadow) {
        var self = this;
        var overlay = shadow.getElementById('sync-overlay');
        var closeBtn = shadow.getElementById('btn-sync-close');
        var statusEl = shadow.getElementById('sync-status');
        var stageEl = shadow.getElementById('sync-stage');
        var summaryEl = shadow.getElementById('sync-summary');
        var fill = shadow.getElementById('sync-progress');
        var btnSync = shadow.getElementById('btn-sync-all');

        var steps = [];
        var current = 0;
        var results = [];
        var encerrado = false;

        function setStatus(t) { statusEl.textContent = t; }
        function setStage(t) { stageEl.textContent = t; }
        function setSummary(t) { summaryEl.textContent = t; }
        function setProgress(p) { fill.style.width = p + '%'; }

        function concluir(msg, erro) {
          if (encerrado) return;
          encerrado = true;
          closeBtn.disabled = false;
          btnSync.disabled = false;
          if (!erro) setProgress(100);
          setSummary(msg);
          var dc = window.__DataClient;
          dc.invalidate('dashboard.summary');
          dc.invalidate('estoque.Items.DISPONIVEL');
          dc.invalidate('estoque.Items.TODOS');
          self._load(shadow, true);
        }

        function executarPasso() {
          if (encerrado) return;
          if (current >= steps.length) {
            setStatus('Sincronizacao concluida');
            var ok = results.filter(function (r) { return r.ok; }).length;
            var falha = results.filter(function (r) { return !r.ok; }).length;
            concluir(ok + ' etapa(s) OK' + (falha > 0 ? ', ' + falha + ' falha(s).' : '.'));
            return;
          }

          var action = steps[current];
          var label = STEP_LABELS[action] || action;
          var pct = Math.round((current / steps.length) * 100);
          setProgress(pct);
          setStatus(label);
          setStage('Etapa ' + (current + 1) + ' de ' + steps.length);

          window.__DataClient.run(action, {}, {
            success: function (resp) {
              results.push({ action: action, ok: true });
              current++;
              executarPasso();
            },
            failure: function (err) {
              results.push({ action: action, ok: false, error: err.message || String(err) });
              current++;
              executarPasso();
            }
          });
        }

        closeBtn.disabled = true;
        btnSync.disabled = true;
        overlay.classList.add('open');
        setProgress(0);
        setStage('');
        setSummary('');
        setStatus('Lendo configuracao...');

        window.__DataClient.run('dashboard.getSyncOrder', {}, {
          success: function (resp) {
            var data = window.__DataClient.unwrap(resp);
            steps = (data && data.steps) ? data.steps : [];
            if (steps.length === 0) {
              concluir('Nenhuma etapa configurada. Verifique a aba CONFIG (chave sincronizar).', true);
              return;
            }
            executarPasso();
          },
          failure: function (err) {
            concluir('Erro ao ler config: ' + (err.message || err), true);
          }
        });
      }
    }

    function formatBRL(value) {
      if (value == null || isNaN(value)) return '-';
      return FormatterService.formatCurrency(value);
    }

    function marketplaceBadge(marketplace) {
      return (
        '<span class="badge badge-' + (marketplace === 'shopee' ? 'shopee' : 'mercado-livre') + '">' +
        marketplace + '</span>'
      );
    }

    function renderStats(shadow, data) {
      var counts = { shopee: 0, mercado_livre: 0 };
      (data.orders || []).forEach(function (order) {
        counts[order.marketplace] = (counts[order.marketplace] || 0) + 1;
      });
      var income = data.shopeeIncome || {};
      shadow.getElementById('stat-grid').innerHTML =
        '<div class="stat-card stat-card--featured">' +
        '<span class="stat-label">Pedidos recentes</span>' +
        '<span class="stat-value">' + (data.orders || []).length + '</span>' +
        '<span class="stat-meta">' + marketplaceBadge('shopee') + marketplaceBadge('mercado_livre') +
        ' <span>' + counts.shopee + ' / ' + counts.mercado_livre + '</span></span>' +
        '</div>' +
        '<div class="stat-card">' +
        '<span class="stat-label">Receita Shopee</span>' +
        '<span class="stat-value stat-value--primary">' + formatBRL(income.gmv) + '</span>' +
        '<span class="stat-meta">' + (income.orders || 0) + ' pedidos</span>' +
        '</div>';
    }

    function render(shadow, data) {
      renderStats(shadow, data);

      var orderRows = (data.orders || [])
        .slice(0, 10)
        .map(function (order) {
          return (
            '<tr><td>' + order.id + '</td><td>' + marketplaceBadge(order.marketplace) +
            '</td><td>' + order.status + '</td><td>' +
            (order.total != null ? formatBRL(order.total) : '-') + '</td></tr>'
          );
        })
        .join('');
      shadow.querySelector('#orders-table tbody').innerHTML =
        orderRows || '<tr><td colspan="4">Sem pedidos recentes.</td></tr>';
    }

    customElements.define('dashboard-widget', DashboardWidget);
  })();
</script>
