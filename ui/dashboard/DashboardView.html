<template id="dashboard-template">
  <div class="card">
    <h2>Dashboard</h2>
    <button class="btn" id="btn-refresh">Atualizar</button>
    <p class="alert alert-danger" id="error-box" hidden></p>
    <div id="result-box" hidden></div>
  </div>
</template>
<script>
  (function () {
    if (customElements.get('dashboard-widget')) return;

    class DashboardWidget extends HTMLElement {
      connectedCallback() {
        var template = document.getElementById('dashboard-template');
        var shadow = this.attachShadow({ mode: 'open' });
        shadow.adoptedStyleSheets = [window.__DESIGN_SHEET__];
        shadow.appendChild(template.content.cloneNode(true));
        shadow.getElementById('btn-refresh').addEventListener('click', () => this._load(shadow));
        this._load(shadow);
      }

      _load(shadow) {
        withLoading(
          shadow.getElementById('btn-refresh'),
          (success, failure) =>
            google.script.run
              .withSuccessHandler(success)
              .withFailureHandler(failure)
              .apiDispatch('dashboard.getSummary', {}),
          (data) => render(shadow, data),
          (data) => (data.fromCache ? 'Dados em cache (até 5 min).' : 'Dados atualizados agora.')
        );
      }
    }

    function render(shadow, data) {
      var box = shadow.getElementById('result-box');
      var lowStockRows = (data.lowStock || [])
        .map(function (item) {
          return (
            '<tr><td>' + item.title + '</td><td><span class="badge badge-' +
            (item.marketplace === 'shopee' ? 'shopee' : 'mercado-livre') + '">' +
            item.marketplace + '</span></td><td>' + item.stock + '</td></tr>'
          );
        })
        .join('');

      var orderRows = (data.orders || [])
        .slice(0, 10)
        .map(function (order) {
          return (
            '<tr><td>' + order.id + '</td><td><span class="badge badge-' +
            (order.marketplace === 'shopee' ? 'shopee' : 'mercado-livre') + '">' +
            order.marketplace + '</span></td><td>' + order.status + '</td><td>' +
            (order.total != null ? Number(order.total).toFixed(2) : '-') + '</td></tr>'
          );
        })
        .join('');

      box.innerHTML +=
        '<h3>Pedidos recentes</h3>' +
        '<table class="table"><thead><tr><th>ID</th><th>Canal</th><th>Status</th><th>Total</th></tr></thead>' +
        '<tbody>' + (orderRows || '<tr><td colspan="4">Sem pedidos recentes.</td></tr>') + '</tbody></table>' +
        '<h3>Estoque baixo (≤ 3 un.)</h3>' +
        '<table class="table"><thead><tr><th>Produto</th><th>Canal</th><th>Estoque</th></tr></thead>' +
        '<tbody>' + (lowStockRows || '<tr><td colspan="3">Nenhum alerta.</td></tr>') + '</tbody></table>';
    }

    customElements.define('dashboard-widget', DashboardWidget);
  })();
</script>
