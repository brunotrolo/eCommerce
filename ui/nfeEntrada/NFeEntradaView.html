<template id="nfe-entrada-template">
  <style>
    .nfe-table { margin-top: var(--space-lg); }
    .nfe-table .table { width: 100%; }
    .nfe-empty {
      text-align: center;
      padding: var(--space-section) var(--space-lg);
      color: var(--color-text-secondary);
    }
    .nfe-table .table tbody tr { cursor: pointer; }
    .nfe-table .table tbody tr:hover { background: var(--color-surface-hover); }
    .nfe-sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 9990;
      display: none;
    }
    .nfe-sidebar-overlay[open] { display: block; }
    .nfe-sidebar {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 90vw;
      max-width: 90vw;
      background: var(--color-surface);
      border-left: 1px solid var(--color-border);
      z-index: 9995;
      display: none;
      flex-direction: column;
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.15);
    }
    .nfe-sidebar[open] { display: flex; }
    .nfe-sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-sm) var(--space-md);
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    .nfe-sidebar-header h3 { margin: 0; font-size: var(--font-size-md); font-weight: var(--font-weight-semibold); }
    .nfe-sidebar-close {
      background: none;
      border: none;
      font-size: var(--font-size-xl);
      cursor: pointer;
      color: var(--color-text-secondary);
      padding: var(--space-xs);
      line-height: 1;
    }
    .nfe-sidebar-close:hover { color: var(--color-text); }
    .nfe-sidebar-body {
      flex: 1;
      overflow: auto;
      padding: var(--space-md);
    }
    .nfe-sidebar-body .table { width: 100%; }
    .nfe-sidebar-empty {
      text-align: center;
      padding: var(--space-section);
      color: var(--color-text-secondary);
    }
    .nfe-sidebar-nfinfo {
      margin-bottom: var(--space-md);
      padding: var(--space-sm);
      background: var(--color-surface-alt);
      border-radius: var(--radius-sm);
      font-size: var(--font-size-sm);
    }
    .nfe-sidebar-nfinfo strong { color: var(--color-text); }
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #ccc;
      border-radius: 22px;
      transition: 0.3s;
    }
    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.3s;
    }
    .toggle-switch input:checked + .toggle-slider {
      background-color: #22c55e;
    }
    .toggle-switch input:checked + .toggle-slider:before {
      transform: translateX(18px);
    }
    .sidebar-tabs {
      display: flex;
      gap: 0;
      margin-bottom: var(--space-md);
      border-bottom: 1px solid var(--color-border);
    }
    .sidebar-tab {
      padding: var(--space-sm) var(--space-md);
      border: none;
      background: none;
      cursor: pointer;
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .sidebar-tab:hover { color: var(--color-text); }
    .sidebar-tab.active {
      color: var(--color-primary);
      border-bottom-color: var(--color-primary);
      font-weight: var(--font-weight-semibold);
    }
    .sidebar-panel { display: none; }
    .sidebar-panel.active { display: block; }
    th[data-sort] {
      cursor: pointer;
      user-select: none;
      position: relative;
      padding-right: 24px !important;
    }
    th[data-sort]:hover { background: var(--color-bg-secondary, #f7f8fa); }
    th[data-sort]::after {
      content: '';
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid var(--color-text-tertiary, #b0b7c3);
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    th[data-sort].sort-asc::after,
    th[data-sort].sort-desc::after { opacity: 1; }
    th[data-sort].sort-desc::after {
      border-top: none;
      border-bottom: 5px solid var(--color-text-tertiary, #b0b7c3);
    }
  </style>

  <div class="widget-grid">
    <div class="card">
      <h1>NFe Entrada</h1>
      <p class="page-subtitle">Sincroniza XMLs e PDFs de Notas Fiscais de uma pasta do Drive para o Sheets.</p>

      <div class="page-actions">
        <button class="btn" id="btn-sync">Sincronizar com Drive</button>
        <span id="sync-status" class="status-text"></span>
      </div>

      <div id="error-box" class="alert alert-error" hidden></div>
      <div id="result-box" hidden></div>
    </div>

    <div class="card" id="recent-card" hidden>
      <h2>NFes Importadas</h2>
      <p class="card-hint">Clique em uma NF para ver detalhes e memória de cálculo.</p>
      <div class="nfe-table" id="nfe-table-container"></div>
      <div id="recent-hint" class="nfe-empty" hidden></div>
    </div>
  </div>

  <div class="nfe-sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="nfe-sidebar" id="sidebar">
    <div class="nfe-sidebar-header">
      <h3 id="sidebar-title">Detalhes da NF</h3>
      <button class="nfe-sidebar-close" id="sidebar-close" aria-label="Fechar">&times;</button>
    </div>
    <div class="nfe-sidebar-body" id="sidebar-body">
      <div class="nfe-sidebar-empty">Carregando...</div>
    </div>
  </aside>
</template>

<script>
  (function () {
    var template = document.getElementById('nfe-entrada-template');

    customElements.define(
      'nfe-entrada-widget',
      class extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: 'open' });
          this.shadowRoot.appendChild(template.content.cloneNode(true));
          if (window.__DESIGN_SHEET__) {
            this.shadowRoot.adoptedStyleSheets = [window.__DESIGN_SHEET__];
          }
          this._sortState = { field: null, asc: true };
          this._rawRows = [];
        }

        _sortIcon(field) {
          var s = this._sortState;
          if (s.field !== field) return ' <span class="sort-arrow"></span>';
          return s.asc
            ? ' <span class="sort-arrow sort-asc"></span>'
            : ' <span class="sort-arrow sort-desc"></span>';
        }

        _sortRows(rows) {
          var s = this._sortState;
          if (!s.field) return rows;
          var sorted = rows.slice();
          sorted.sort(function (a, b) {
            var va = a[s.field];
            var vb = b[s.field];
            if (va == null) return 1;
            if (vb == null) return -1;
            if (typeof va === 'string') {
              va = va.toLowerCase();
              vb = (vb || '').toLowerCase();
            }
            return va < vb ? -1 : va > vb ? 1 : 0;
          });
          return s.asc ? sorted : sorted.reverse();
        }

        _updateSortArrows(tableEl) {
          var self = this;
          var ths = tableEl.querySelectorAll('th[data-sort]');
          for (var i = 0; i < ths.length; i++) {
            var th = ths[i];
            var field = th.getAttribute('data-sort');
            th.classList.remove('sort-asc', 'sort-desc');
            var arrow = th.querySelector('.sort-arrow');
            if (!arrow) {
              arrow = document.createElement('span');
              arrow.className = 'sort-arrow';
              th.appendChild(arrow);
            }
            arrow.classList.remove('sort-asc', 'sort-desc');
            if (self._sortState.field === field) {
              arrow.classList.add(self._sortState.asc ? 'sort-asc' : 'sort-desc');
            }
          }
        }

        connectedCallback() {
          var self = this;
          var btn = this.shadowRoot.getElementById('btn-sync');
          var status = this.shadowRoot.getElementById('sync-status');
          var overlay = this.shadowRoot.getElementById('sidebar-overlay');
          var sidebar = this.shadowRoot.getElementById('sidebar');
          var closeBtn = this.shadowRoot.getElementById('sidebar-close');

          this._hideResults();

          var cached = window.__DataClient && window.__DataClient.get('nfeEntrada.recent');
          if (cached) {
            var rows = (Array.isArray(cached) && cached) || cached.rows || cached.data;
            if (Array.isArray(rows) && rows.length > 0) {
              this.shadowRoot.getElementById('recent-card').hidden = false;
              this._renderTable(rows);
            }
          }

          btn.addEventListener('click', function () {
            btn.disabled = true;
            btn.textContent = 'Sincronizando…';
            status.textContent = 'Lendo arquivos do Drive e processando…';
            self._hideResults();

            var folderId = '1tGl8zs9GOUA1L_i2FJNoimTl00_55qKu';

            window.__DataClient.mutateData('nfeEntrada.syncAndUpdateSheets', { driveFolder: folderId })
              .then(function (result) {
                btn.disabled = false;
                btn.textContent = 'Sincronizar com Drive';
                status.textContent = '';

                if (!result) {
                  showError(self.shadowRoot, 'Resposta vazia do servidor');
                  return;
                }
                self._showResult(result);
                self._loadRecent();
              })
              .catch(function (err) {
                btn.disabled = false;
                btn.textContent = 'Sincronizar com Drive';
                status.textContent = '';
                showError(self.shadowRoot, err.message || String(err));
              });
          });

          overlay.addEventListener('click', function () { self._closeSidebar(); });
          closeBtn.addEventListener('click', function () { self._closeSidebar(); });

          this._loadRecent();
        }

        _hideResults() {
          this.shadowRoot.getElementById('error-box').hidden = true;
          this.shadowRoot.getElementById('result-box').hidden = true;
        }

        _showResult(result) {
          var box = this.shadowRoot.getElementById('result-box');
          if (!result) {
            box.hidden = true;
            return;
          }
          var data = result.data || result || {};
          var inserted = data.inserted || 0;
          var duplicated = data.duplicated || 0;
          var errCount = (data.errors || []).length;

          var html = '<div class="alert alert-success">Sync concluída: ' +
            '<strong>' + inserted + '</strong> importada(s), ' +
            '<strong>' + duplicated + '</strong> duplicada(s), ' +
            '<strong>' + errCount + '</strong> erro(s).</div>';

          if (errCount > 0) {
            html += '<div class="alert alert-warning" style="margin-top: var(--space-md)">';
            for (var i = 0; i < data.errors.length; i++) {
              html += '<div>' + (data.errors[i].file || '') + ': ' + (data.errors[i].reason || '') + '</div>';
            }
            html += '</div>';
          }

          box.innerHTML = html;
          box.hidden = false;
        }

        _loadRecent() {
          var self = this;
          var dc = window.__DataClient;
          var recentCard = this.shadowRoot.getElementById('recent-card');
          var hint = this.shadowRoot.getElementById('recent-hint');

          // fetchData: resolve na hora do cache aquecido no boot (zero rede)
          // ou faz dedupe/SWR se estiver em voo/velho.
          dc.fetchData('nfeEntrada.getRecent', { limit: 20 }, { key: 'nfeEntrada.recent' })
            .then(function (env) {
              env = env || {};
              hint.hidden = true;

              if (env.sheetIdConfigured === false) {
                recentCard.hidden = false;
                hint.textContent = 'Sheet ID da NFe Entrada não configurado. Use o menu "NFe Entrada → Configurar Sheet ID" no editor do Apps Script e recarregue.';
                hint.hidden = false;
                return;
              }

              var rows = (Array.isArray(env) && env) || env.rows || env.data || [];
              if (rows.length === 0) {
                recentCard.hidden = false;
                hint.textContent = 'Nenhuma NF-e importada ainda. Clique em "Sincronizar com Drive".';
                hint.hidden = false;
                return;
              }

              recentCard.hidden = false;
              self._rawRows = rows;
              self._renderTable(rows);
            })
            .catch(function (err) {
              console.error('[NFeEntrada] getRecent failure:', err);
              recentCard.hidden = false;
              hint.textContent = 'Falha ao ler as últimas NFes: ' + ((err && err.message) || String(err));
              hint.hidden = false;
            });
        }

        _renderTable(rows) {
          var self = this;
          var container = this.shadowRoot.getElementById('nfe-table-container');
          var sorted = this._sortRows(rows);
          var html = '<div class="table-container"><table class="table" id="nfe-main-table">' +
            '<thead><tr>' +
            '<th data-sort="NUMERO_NF">Nº NF' + this._sortIcon('NUMERO_NF') + '</th>' +
            '<th data-sort="EMITENTE_NOME">Emitente' + this._sortIcon('EMITENTE_NOME') + '</th>' +
            '<th data-sort="DATA_EMISSAO">Data' + this._sortIcon('DATA_EMISSAO') + '</th>' +
            '<th data-sort="vProdutos">Produtos' + this._sortIcon('vProdutos') + '</th>' +
            '<th data-sort="VALOR_FRETE">Frete' + this._sortIcon('VALOR_FRETE') + '</th>' +
            '<th data-sort="vOutros">Outros' + this._sortIcon('vOutros') + '</th>' +
            '<th data-sort="VALOR_DESCONTO">Desconto' + this._sortIcon('VALOR_DESCONTO') + '</th>' +
            '<th data-sort="VALOR_TOTAL">Total' + this._sortIcon('VALOR_TOTAL') + '</th>' +
            '<th data-sort="STATUS_NFE">Status' + this._sortIcon('STATUS_NFE') + '</th>' +
            '</tr></thead><tbody>';

          for (var i = 0; i < sorted.length; i++) {
            var r = sorted[i];
            var statusClass = r.STATUS_NFE === 'Autorizado' ? 'badge-success' : 'badge-warning';
            var vProdutos = parseFloat(r.VALOR_PRODUTOS);
            if (isNaN(vProdutos)) vProdutos = parseFloat(r.VALOR_TOTAL) || 0;
            var vOutros = parseFloat(r.VALOR_OUTROS);
            if (isNaN(vOutros)) vOutros = 0;
            var row = Object.assign({}, r, { vProdutos: vProdutos, vOutros: vOutros });
            html += '<tr data-numero-nf="' + (r.NUMERO_NF || '') + '" data-chave-nf="' + (r.CHAVE_NF || '') + '" class="nfe-row">' +
              '<td>' + (r.NUMERO_NF || '') + '</td>' +
              '<td>' + (r.EMITENTE_NOME || '') + '</td>' +
              '<td>' + FormatterService.formatDate(r.DATA_EMISSAO) + '</td>' +
              '<td>' + FormatterService.formatCurrency(vProdutos) + '</td>' +
              '<td>' + FormatterService.formatCurrency(r.VALOR_FRETE) + '</td>' +
              '<td>' + FormatterService.formatCurrency(vOutros) + '</td>' +
              '<td>' + FormatterService.formatCurrency(r.VALOR_DESCONTO) + '</td>' +
              '<td>' + FormatterService.formatCurrency(r.VALOR_TOTAL) + '</td>' +
              '<td><span class="badge ' + statusClass + '">' + (r.STATUS_NFE || '-') + '</span></td>' +
              '</tr>';
          }

          html += '</tbody></table></div>';
          container.innerHTML = html;

          var tableEl = container.querySelector('#nfe-main-table');
          self._updateSortArrows(tableEl);
          var ths = tableEl.querySelectorAll('th[data-sort]');
          for (var t = 0; t < ths.length; t++) {
            ths[t].addEventListener('click', function () {
              var field = this.getAttribute('data-sort');
              if (self._sortState.field === field) {
                self._sortState.asc = !self._sortState.asc;
              } else {
                self._sortState.field = field;
                self._sortState.asc = true;
              }
              self._renderTable(self._rawRows);
            });
          }

          var nfRows = container.querySelectorAll('.nfe-row');
          for (var j = 0; j < nfRows.length; j++) {
            nfRows[j].addEventListener('click', function () {
              var numeroNf = this.getAttribute('data-numero-nf');
              self._openSidebar(numeroNf, self._rawRows);
            });
          }
        }

        _openSidebar(numeroNf, allRows) {
          var self = this;
          var overlay = this.shadowRoot.getElementById('sidebar-overlay');
          var sidebar = this.shadowRoot.getElementById('sidebar');
          var title = this.shadowRoot.getElementById('sidebar-title');
          var body = this.shadowRoot.getElementById('sidebar-body');

          var nfData = null;
          for (var i = 0; i < allRows.length; i++) {
            if (String(allRows[i].NUMERO_NF).trim() === String(numeroNf).trim()) {
              nfData = allRows[i];
              break;
            }
          }

          title.textContent = 'NF ' + numeroNf + ' — ' + (nfData ? nfData.EMITENTE_NOME : '');
          body.innerHTML = '<div class="nfe-sidebar-empty">Carregando produtos...</div>';
          overlay.setAttribute('open', '');
          sidebar.setAttribute('open', '');

          window.__DataClient.fetchData('nfeEntradaProdutos.getEstoqueByNf', { numeroNf: numeroNf }, { cache: false })
            .then(function (payload) {
              var items = Array.isArray(payload) ? payload : ((payload && payload.data) || []);
              if (items.length === 0) {
                body.innerHTML = '<div class="nfe-sidebar-empty">Nenhum produto encontrado para esta NF.</div>';
                return;
              }

              self._renderSidebar(body, nfData, items, numeroNf);
            })
            .catch(function (err) {
              body.innerHTML = '<div class="nfe-sidebar-empty">Erro: ' + (err.message || String(err)) + '</div>';
            });
        }

        _renderSidebar(body, nfData, items, numeroNf) {
          var self = this;
          var n = nfData || {};

          var totalQty = 0;
          for (var i = 0; i < items.length; i++) {
            totalQty += items[i].quantidadeTotal || 0;
          }

          var info = '<div class="nfe-sidebar-nfinfo">' +
            '<strong>NF:</strong> ' + numeroNf +
            ' &nbsp;|&nbsp; <strong>Emitente:</strong> ' + (n.EMITENTE_NOME || '-') +
            ' &nbsp;|&nbsp; <strong>Produtos:</strong> ' + items.length +
            ' &nbsp;|&nbsp; <strong>Qtd Total:</strong> ' + Math.round(totalQty) +
            '</div>';

          var html = info +
            '<div class="table-container"><table class="table">' +
            '<thead><tr>' +
            '<th>Código</th><th>Descrição</th><th>NCM</th><th>Emitente</th><th>Qtd</th><th>Vl Unit. Líquido</th><th>Vl Total</th><th>Última Entrada</th><th>NF Origem</th><th>Status</th>' +
            '</tr></thead><tbody>';

          for (var j = 0; j < items.length; j++) {
            var item = items[j];
            var isRecebido = (item.status || 'Recebido') === 'Recebido';
            var nfOrigem = item.ultimaNfOrigemNumero || '';
            var codProd = item.codigoProduto || '';
            html += '<tr>' +
              '<td>' + codProd + '</td>' +
              '<td>' + (item.descricao || '').toUpperCase() + '</td>' +
              '<td>' + (item.ncm || '') + '</td>' +
              '<td>' + (item.emitenteNome || '') + '</td>' +
              '<td>' + Math.round(item.quantidadeTotal || 0) + '</td>' +
              '<td>' + FormatterService.formatCurrency(item.valorUnitarioLiquido) + '</td>' +
              '<td>' + FormatterService.formatCurrency(item.valorTotal) + '</td>' +
              '<td>' + FormatterService.formatDateTime(item.ultimaEntrada) + '</td>' +
              '<td>' + nfOrigem + '</td>' +
              '<td><label class="toggle-switch"><input type="checkbox" data-nf="' + nfOrigem + '" data-cod="' + codProd + '"' + (isRecebido ? ' checked' : '') + ' /><span class="toggle-slider"></span></label></td>' +
              '</tr>';
          }

          html += '</tbody></table></div>';
          body.innerHTML = html;

          var toggles = body.querySelectorAll('.toggle-switch input');
          for (var k = 0; k < toggles.length; k++) {
            toggles[k].addEventListener('change', function () {
              var nf = this.getAttribute('data-nf');
              var cod = this.getAttribute('data-cod');
              var newStatus = this.checked ? 'Recebido' : 'Desconsiderar';
              self._updateStatus(nf, cod, newStatus);
            });
          }
        }

        _closeSidebar() {
          var overlay = this.shadowRoot.getElementById('sidebar-overlay');
          var sidebar = this.shadowRoot.getElementById('sidebar');
          overlay.removeAttribute('open');
          sidebar.removeAttribute('open');
        }

        _updateStatus(numeroNf, codigoProduto, status) {
          window.__DataClient.mutateData('nfeEntradaProdutos.updateStatus', {
            numeroNf: numeroNf,
            codigoProduto: codigoProduto,
            status: status
          }, { noLoading: true })
            .catch(function (err) {
              console.error('[NFeEntrada] updateStatus failure:', err);
            });
        }
      }
    );

  })();
</script>
