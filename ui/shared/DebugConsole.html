<template id="debug-console-template">
  <style>
    .dbg-fab[hidden], .dbg-overlay[hidden], .dbg-drawer[hidden] {
      display: none !important;
    }
    .dbg-fab {
      position: fixed;
      right: var(--space-lg);
      bottom: var(--space-lg);
      z-index: 10000;
      border-radius: 999px;
      min-width: 0;
      --animation: none;
    }
    .dbg-overlay {
      position: fixed;
      inset: 0;
      z-index: 9990;
      background: rgba(0, 0, 0, 0.45);
    }
    .dbg-drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(640px, 92vw);
      z-index: 9995;
      background: var(--color-surface);
      border-left: 1px solid var(--color-border);
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.25);
    }
    .dbg-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-sm) var(--space-md);
      border-bottom: 1px solid var(--color-border);
    }
    .dbg-head h3 { margin: 0; font-size: var(--font-size-md); font-weight: var(--font-weight-semibold); }
    .dbg-tabs { display: flex; gap: var(--space-xs); padding: var(--space-sm) var(--space-md); border-bottom: 1px solid var(--color-border); }
    .dbg-tab {
      padding: var(--space-xs) var(--space-sm);
      border: 1px solid var(--color-border);
      background: var(--color-surface-alt);
      color: var(--color-text-secondary);
      font-size: var(--font-size-xs);
      border-radius: var(--radius-sm);
      cursor: pointer;
    }
    .dbg-tab[data-active='true'] {
      background: var(--color-primary);
      color: var(--color-bg);
      border-color: var(--color-primary);
    }
    .dbg-body { flex: 1; overflow: auto; padding: var(--space-sm); display: flex; flex-direction: column; gap: var(--space-xs); }
    .dbg-empty { color: var(--color-text-tertiary); font-size: var(--font-size-sm); text-align: center; padding: var(--space-lg); }
    .dbg-row {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: var(--space-xs) var(--space-sm);
      font-size: var(--font-size-xs);
      background: var(--color-surface-alt);
      cursor: pointer;
    }
    .dbg-row:hover { background: var(--color-surface-hover); }
    .dbg-row--error { border-color: var(--color-warning); }
    .dbg-meta { display: flex; gap: var(--space-sm); flex-wrap: wrap; color: var(--color-text-secondary); margin-bottom: var(--space-xs); }
    .dbg-action { font-weight: var(--font-weight-semibold); color: var(--color-text); }
    .dbg-status--OK { color: var(--color-success-text); font-weight: var(--font-weight-semibold); }
    .dbg-status--ERROR { color: var(--color-warning-text); font-weight: var(--font-weight-semibold); }
    .dbg-sum { color: var(--color-text); word-break: break-word; }
    .dbg-error { color: var(--color-warning-text); word-break: break-word; margin-top: var(--space-xs); }
    .dbg-detail {
      margin-top: var(--space-xs);
      border-top: 1px dashed var(--color-border-light);
      padding-top: var(--space-xs);
      color: var(--color-text-secondary);
      word-break: break-all;
      white-space: pre-wrap;
      font-family: var(--font-family-mono);
      font-size: var(--font-size-2xs);
      display: none;
    }
    .dbg-row--expanded .dbg-detail { display: block; }
    .dbg-foot { display: flex; gap: var(--space-xs); padding: var(--space-sm) var(--space-md); border-top: 1px solid var(--color-border); flex-wrap: wrap; }
    .dbg-foot .btn { flex: 1 1 auto; white-space: nowrap; }
  </style>

  <button class="btn dbg-fab" id="dbg-fab" title="Abrir Debug Console (Ctrl+E)">Debug</button>
  <div class="dbg-overlay" id="dbg-overlay" hidden></div>
  <section class="dbg-drawer" id="dbg-drawer" hidden aria-label="Console de depuração">
    <div class="dbg-head">
      <h3>Debug Console</h3>
      <button class="btn" id="dbg-close" aria-label="Fechar">×</button>
    </div>
    <div class="dbg-tabs">
      <button class="dbg-tab" data-tab="calls" data-active="true">Chamadas</button>
      <button class="dbg-tab" data-tab="backend" data-active="false">Logs (backend)</button>
      <button class="dbg-tab" data-tab="front" data-active="false">Erros (browser)</button>
    </div>
    <div class="dbg-body" id="dbg-body"></div>
    <div class="dbg-foot">
      <button class="btn" id="dbg-reload">Atualizar logs</button>
      <button class="btn" id="dbg-clear">Limpar</button>
      <button class="btn" id="dbg-copy">Copiar JSON</button>
    </div>
  </section>
</template>

<script>
  (function () {
    if (window.__debugConsoleReady_) return;
    window.__debugConsoleReady_ = true;

    window.__debugEvents_ = window.__debugEvents_ || [];
    window.__debugErrors_ = window.__debugErrors_ || [];

    window.__debugCapture_ = function (evt) {
      window.__debugEvents_.unshift(evt);
      if (window.__debugEvents_.length > 200) window.__debugEvents_.pop();
    };

    window.addEventListener('error', function (e) {
      window.__debugErrors_.unshift({
        kind: 'window.onerror',
        message: e.message || 'Erro de script',
        file: e.filename || '',
        line: e.lineno || '',
        col: e.colno || '',
        stack: e.error && e.error.stack ? e.error.stack.split('\n').slice(0, 8).join('\n') : ''
      });
      if (window.__debugErrors_.length > 100) window.__debugErrors_.pop();
    });

    window.addEventListener('unhandledrejection', function (e) {
      var reason = e.reason || {};
      window.__debugErrors_.unshift({
        kind: 'unhandledrejection',
        message: (reason && (reason.message || reason.error)) || String(reason),
        stack: reason && reason.stack ? reason.stack.split('\n').slice(0, 8).join('\n') : ''
      });
      if (window.__debugErrors_.length > 100) window.__debugErrors_.pop();
    });
  })();

  customElements.define(
    'debug-console-widget',
    class extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: 'open' });
        this.shadowRoot.appendChild(document.getElementById('debug-console-template').content.cloneNode(true));
        if (window.__DESIGN_SHEET__) {
          this.shadowRoot.adoptedStyleSheets = [window.__DESIGN_SHEET__];
        }
        this.backendLogs = [];
        this.activeTab = 'calls';
      }

      connectedCallback() {
        this.shadowRoot.getElementById('dbg-fab').addEventListener('click', () => this.open());
        this.shadowRoot.getElementById('dbg-overlay').addEventListener('click', () => this.close());
        this.shadowRoot.getElementById('dbg-close').addEventListener('click', () => this.close());
        this.shadowRoot.getElementById('dbg-reload').addEventListener('click', () => this.loadBackendLogs());
        this.shadowRoot.getElementById('dbg-clear').addEventListener('click', () => this.clear());
        this.shadowRoot.getElementById('dbg-copy').addEventListener('click', () => this.copy());
        this.shadowRoot.querySelectorAll('.dbg-tab').forEach((btn) => {
          btn.addEventListener('click', () => {
            this.activeTab = btn.dataset.tab;
            this.shadowRoot.querySelectorAll('.dbg-tab').forEach((b) => {
              b.dataset.active = String(b === btn);
            });
            this.render();
          });
        });
        window.addEventListener('keydown', (e) => {
          if (e.ctrlKey && e.key.toLowerCase() === 'e') {
            e.preventDefault();
            if (this.shadowRoot.getElementById('dbg-drawer').hidden) this.open();
            else this.close();
          }
        });
      }

      open() {
        this.shadowRoot.getElementById('dbg-drawer').hidden = false;
        this.shadowRoot.getElementById('dbg-overlay').hidden = false;
        this.shadowRoot.getElementById('dbg-fab').hidden = true;
        this.render();
      }

      close() {
        this.shadowRoot.getElementById('dbg-drawer').hidden = true;
        this.shadowRoot.getElementById('dbg-overlay').hidden = true;
        this.shadowRoot.getElementById('dbg-fab').hidden = false;
      }

      clear() {
        window.__debugEvents_ = [];
        window.__debugErrors_ = [];
        this.backendLogs = [];
        this.render();
      }

      loadBackendLogs() {
        google.script.run
          .withSuccessHandler((res) => {
            var logs = (res && res.logs) || [];
            this.backendLogs = logs.map((log) => this._shapeLog(log));
            this.render();
          })
          .withFailureHandler((err) => {
            this.backendLogs = [{ ACTION: 'logging.getLogs', STATUS: 'ERROR', SUMMARY: err.message || String(err) }];
            this.render();
          })
          .apiDispatch('logging.getLogs', { limit: 50 });
      }

      _shapeLog(raw) {
        var pick = function (u, l) { return raw[u] !== undefined ? raw[u] : raw[l]; };
        return {
          UPDATED_AT: pick('UPDATED_AT', 'updatedAt'),
          SERVICE: pick('SERVICE', 'service'),
          ACTION: pick('ACTION', 'action'),
          STATUS: pick('STATUS', 'status'),
          SUMMARY: pick('SUMMARY', 'summary'),
          DURATION_MS: pick('DURATION_MS', 'durationMs'),
          ERROR_MESSAGE: pick('ERROR_MESSAGE', 'errorMessage'),
          CONTEXT: pick('CONTEXT', 'context'),
          ENVIRONMENT: pick('ENVIRONMENT', 'environment')
        };
      }

      render() {
        var body = this.shadowRoot.getElementById('dbg-body');
        body.innerHTML = '';

        var items = [];
        if (this.activeTab === 'calls') {
          items = window.__debugEvents_ || [];
        } else if (this.activeTab === 'backend') {
          items = this.backendLogs;
        } else {
          items = window.__debugErrors_ || [];
        }

        if (!items.length) {
          var empty = document.createElement('div');
          empty.className = 'dbg-empty';
          if (this.activeTab === 'calls') {
            empty.textContent = 'Nenhuma chamada registrada. Faça uma ação no app.';
          } else if (this.activeTab === 'backend') {
            empty.textContent = 'Clique "Atualizar logs" para buscar do servidor.';
          } else {
            empty.textContent = 'Nenhum erro no browser.';
          }
          body.appendChild(empty);
          return;
        }

        var self = this;
        items.slice(0, 50).forEach(function (item) {
          body.appendChild(self._renderRow(item));
        });
      }

      _renderRow(item) {
        var self = this;
        var isCall = item.action && item.durationMs !== undefined;
        var isApiError = item.result && item.result.error;
        var isBrowserError = item.kind && (item.kind.indexOf('onerror') !== -1 || item.kind.indexOf('rejection') !== -1);
        var isError = isApiError || isBrowserError || String(item.STATUS || '').toUpperCase() === 'ERROR';

        var row = document.createElement('div');
        row.className = 'dbg-row' + (isError ? ' dbg-row--error' : '');

        var meta = document.createElement('div');
        meta.className = 'dbg-meta';

        var action = document.createElement('span');
        action.className = 'dbg-action';
        if (isCall) {
          action.textContent = item.action;
        } else if (item.ACTION) {
          action.textContent = item.ACTION;
        } else {
          action.textContent = item.kind || '—';
        }

        var status = document.createElement('span');
        if (isCall) {
          status.className = isApiError ? 'dbg-status--ERROR' : 'dbg-status--OK';
          status.textContent = isApiError ? 'ERROR' : 'OK';
        } else {
          status.className = item.STATUS === 'ERROR' ? 'dbg-status--ERROR' : 'dbg-status--OK';
          status.textContent = item.STATUS || '';
        }

        var info = document.createElement('span');
        info.style.color = 'var(--color-text-tertiary)';
        info.style.fontSize = 'var(--font-size-2xs)';
        if (isCall) {
          info.textContent = item.durationMs + 'ms · ' + (item.ts || '');
        } else {
          info.textContent = (item.SERVICE || '') + ' · ' + (item.ENVIRONMENT || '') + ' · ' + (item.UPDATED_AT || '');
        }

        meta.appendChild(action);
        meta.appendChild(status);
        meta.appendChild(info);
        row.appendChild(meta);

        var sum = document.createElement('div');
        sum.className = 'dbg-sum';
        if (isCall) {
          var paramsStr = JSON.stringify(item.params || {});
          if (paramsStr.length > 120) paramsStr = paramsStr.substring(0, 120) + '...';
          sum.textContent = '→ ' + paramsStr;
        } else {
          sum.textContent = item.SUMMARY || item.message || '—';
        }
        row.appendChild(sum);

        var detail = document.createElement('div');
        detail.className = 'dbg-detail';
        if (isCall) {
          var resultStr = JSON.stringify(item.result || {}, null, 2);
          if (resultStr.length > 2000) resultStr = resultStr.substring(0, 2000) + '\n... (truncado)';
          detail.textContent = 'PARAMS:\n' + JSON.stringify(item.params || {}, null, 2) + '\n\nRESULT:\n' + resultStr;
        } else if (item.CONTEXT) {
          detail.textContent = typeof item.CONTEXT === 'string' ? item.CONTEXT : JSON.stringify(item.CONTEXT, null, 2);
        } else if (item.stack) {
          detail.textContent = item.stack;
        }
        if (detail.textContent) {
          row.appendChild(detail);
          row.addEventListener('click', function () {
            row.classList.toggle('dbg-row--expanded');
          });
        }

        return row;
      }

      copy() {
        var payload = {
          exportedAt: _fmtBrTs_(new Date()),
          url: window.location.href,
          calls: (window.__debugEvents_ || []).slice(0, 50),
          backend: this.backendLogs.slice(0, 50),
          errors: window.__debugErrors_ || []
        };
        var text = JSON.stringify(redact_(payload), null, 2);
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => { this._flash('Copiado'); });
        } else {
          var ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          ta.remove();
          this._flash('Copiado');
        }
      }

      _flash(msg) {
        var btn = this.shadowRoot.getElementById('dbg-copy');
        var original = btn.textContent;
        btn.textContent = msg;
        setTimeout(function () { btn.textContent = original; }, 1500);
      }
    }
  );

    function _fmtBrTs_(d) {
      var pad = function (n) { return String(n).padStart(2, '0'); };
      return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear()
        + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }

    function redact_(value, depth) {
      depth = depth || 0;
      if (depth > 6) return '[depth]';
      if (value === null || value === undefined) return value;
      if (typeof value !== 'object') return value;
      if (value instanceof Date) return _fmtBrTs_(value);
    if (Array.isArray(value)) return value.map(function (v) { return redact_(v, depth + 1); });
    var out = {};
    var SENSITIVE = /(api[_-]?key|secret|password|passwd|access[_-]?token|client[_-]?secret|authorization|token|key)/i;
    Object.keys(value).forEach(function (k) {
      if (SENSITIVE.test(k)) { out[k] = '[REDACTED]'; return; }
      out[k] = redact_(value[k], depth + 1);
    });
    return out;
  }
</script>
