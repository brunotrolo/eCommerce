<style id="design-tokens-source">
  /* ============================================================
     DESIGN SYSTEM — eCommerce Control Panel
     Fonte única de truth: DESIGN.md (Mintlify design analysis).
     Todos os tokens mapeiam diretamente para os tokens Mintlify
     ({colors.*}, {typography.*}, {rounded.*}, {spacing.*}).
     ============================================================ */

  :root {
    /* ========== PALETTE — LIGHT THEME (Mintlify light) ========== */
    /* Surface */
    --color-bg: #ffffff;                /* canvas */
    --color-surface: #ffffff;           /* canvas */
    --color-surface-hover: #f7f7f7;     /* surface */
    --color-surface-alt: #f7f7f7;       /* surface */
    --color-border: #e5e5e5;            /* hairline */
    --color-border-light: #ededed;      /* hairline-soft */
    --color-disabled: #a8a8aa;          /* muted */

    /* Text */
    --color-text: #0a0a0a;              /* ink */
    --color-text-secondary: #5a5a5c;    /* steel */
    --color-text-tertiary: #888888;     /* stone */

    /* Primary — black pill buttons */
    --color-primary: #0a0a0a;           /* primary */
    --color-primary-hover: #1c1c1e;     /* charcoal */
    --color-primary-active: #000000;
    --color-primary-light: rgba(10, 10, 10, 0.06);
    --color-on-primary: #ffffff;        /* on-primary */

    /* Accent — Mintlify mint (só acentos/estados ativos) */
    --color-accent: #00d4a4;            /* brand-green */
    --color-accent-deep: #00b48a;       /* brand-green-deep */
    --color-accent-soft: rgba(0, 212, 164, 0.14);

    /* Semantic */
    --color-success: #00b48a;           /* brand-green-deep (bordas) */
    --color-success-light: rgba(0, 212, 164, 0.14);
    --color-success-text: #0f7a5f;
    --color-warning: #c37d0d;           /* brand-warn */
    --color-warning-light: rgba(195, 125, 13, 0.14);
    --color-warning-text: #9a6108;
    --color-error: #d45656;             /* brand-error */
    --color-error-light: rgba(212, 86, 86, 0.12);
    --color-error-text: #b02a2a;
    --color-info: #3772cf;              /* brand-tag */
    --color-info-light: rgba(55, 114, 207, 0.15);
    --color-info-text: #2b5cb0;

    /* Marketplace badges (identidade de marca, fora do sistema Mintlify) */
    --color-shopee: #ee4d2d;
    --color-shopee-light: #ee4d2d;
    --color-shopee-text: #ffffff;
    --color-mercado-livre: #ffe600;
    --color-mercado-livre-light: #fffbcc;
    --color-mercado-livre-text: #3d3d00;
    --color-mercado-livre-blue: #2968c8;

    /* ========== TYPOGRAPHY (Inter + fallbacks do sistema) ========== */
    --font-family-base: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-family-mono: "SF Mono", Menlo, Consolas, "Roboto Mono", monospace;

    --font-size-xs: 12px;               /* micro */
    --font-size-sm: 14px;               /* body-sm */
    --font-size-base: 14px;
    --font-size-md: 16px;               /* body-md */
    --font-size-lg: 18px;               /* heading-5 */
    --font-size-xl: 24px;
    --font-size-2xl: 32px;

    --font-weight-regular: 400;
    --font-weight-medium: 500;          /* body-sm-medium */
    --font-weight-semibold: 600;
    --font-weight-bold: 700;

    --line-height-tight: 1.3;
    --line-height-normal: 1.5;          /* body 1.50 */
    --line-height-relaxed: 1.6;
    --line-height-base: 1.5;
    --line-height-heading: 1.25;

    --letter-spacing-tight: -0.5px;
    --letter-spacing-micro: 0.5px;      /* micro-uppercase */

    /* ========== SPACING (4px base, escala Mintlify) ========== */
    --space-xs: 4px;                    /* xxs */
    --space-sm: 8px;                    /* xs */
    --space-md: 12px;                   /* sm */
    --space-lg: 16px;                   /* md */
    --space-xl: 24px;                   /* xl */
    --space-2xl: 32px;                  /* xxl */
    --space-3xl: 48px;                  /* section-sm */

    /* Aliases semânticos (Mintlify: cards xl 24px, sections 48px) */
    --space-element: var(--space-lg);   /* 16px — espaçamento entre elementos */
    --space-card: var(--space-xl);      /* 24px — padding de cards */
    --space-section: var(--space-3xl);  /* 48px — respiro entre seções */

    /* ========== RADII (escala Mintlify) ========== */
    --radius-xs: 4px;
    --radius-sm: 6px;
    --radius-md: 8px;                   /* inputs, compact UI */
    --radius-lg: 12px;                  /* cards */
    --radius-xl: 16px;
    --radius-xxl: 24px;
    --radius-full: 9999px;              /* pills: botões e badges SEMPRE */

    /* ========== SHADOWS (elevação Mintlify: flat por padrão) ========== */
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 24px 48px -8px rgba(0, 0, 0, 0.12);
    --shadow-brand: 0 8px 24px rgba(0, 212, 164, 0.08);

    /* ========== Z-INDEX SCALE ========== */
    --z-base: 1;
    --z-dropdown: 100;
    --z-modal: 1000;
    --z-tooltip: 1100;
    --z-notification: 1200;
    --z-shell: var(--z-base);
    --z-overlay: var(--z-modal);

    /* ========== TRANSITIONS (Mintlify: 150–200ms ease) ========== */
    --ease-out: cubic-bezier(0, 0, 0.2, 1);
    --ease-in: cubic-bezier(0.4, 0, 1, 1);
    --transition-fast: 150ms var(--ease-out);
    --transition-normal: 200ms var(--ease-out);
    --transition-slow: 300ms var(--ease-in);
  }

  /* ========== DARK THEME (Mintlify canvas-dark) ========== */
  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #0a0a0a;              /* canvas-dark */
      --color-surface: #1c1c1e;         /* surface-code tone */
      --color-surface-hover: #242426;
      --color-surface-alt: #242426;
      --color-border: #1f1f1f;          /* hairline-dark */
      --color-border-light: #2a2a2c;
      --color-disabled: #555557;

      --color-text: #ffffff;            /* on-dark */
      --color-text-secondary: #b3b3b3;  /* on-dark-muted */
      --color-text-tertiary: #888888;   /* stone */

      /* Primary inverte: white pill sobre dark */
      --color-primary: #ffffff;
      --color-primary-hover: #e5e5e5;
      --color-primary-active: #cfcfcf;
      --color-primary-light: rgba(255, 255, 255, 0.1);
      --color-on-primary: #0a0a0a;

      --color-accent: #00d4a4;
      --color-accent-deep: #00b48a;
      --color-accent-soft: rgba(0, 212, 164, 0.18);

      --color-success: #00b48a;
      --color-success-light: rgba(0, 212, 164, 0.16);
      --color-success-text: #7cebcb;
      --color-warning: #c37d0d;
      --color-warning-light: rgba(195, 125, 13, 0.2);
      --color-warning-text: #d9a44a;
      --color-error: #d45656;
      --color-error-light: rgba(212, 86, 86, 0.16);
      --color-error-text: #f0a8a8;
      --color-info: #3772cf;
      --color-info-light: rgba(55, 114, 207, 0.25);
      --color-info-text: #7da8e8;

      --color-shopee: #ee4d2d;
      --color-shopee-light: #ee4d2d;
      --color-shopee-text: #ffffff;
      --color-mercado-livre: #ffd966;
      --color-mercado-livre-light: #3d3d00;
      --color-mercado-livre-text: #ffe08a;
      --color-mercado-livre-blue: #2968c8;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 24px 48px -8px rgba(0, 0, 0, 0.6);
      --shadow-brand: 0 8px 24px rgba(0, 212, 164, 0.14);
    }
  }

  /* ========== THEME TOGGLE OVERRIDES ========== */
  :root[data-theme="light"] {
    --color-bg: #ffffff;
    --color-surface: #ffffff;
    --color-surface-hover: #f7f7f7;
    --color-surface-alt: #f7f7f7;
    --color-border: #e5e5e5;
    --color-border-light: #ededed;
    --color-text: #0a0a0a;
    --color-text-secondary: #5a5a5c;
  }

  :root[data-theme="dark"] {
    --color-bg: #0a0a0a;
    --color-surface: #1c1c1e;
    --color-surface-hover: #242426;
    --color-surface-alt: #242426;
    --color-border: #1f1f1f;
    --color-border-light: #2a2a2c;
    --color-text: #ffffff;
    --color-text-secondary: #b3b3b3;
  }

  /* ============================================================
     BASE STYLES
     ============================================================ */
  * { box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    font-family: var(--font-family-base);
    font-size: var(--font-size-sm);
    line-height: var(--line-height-base);
    color: var(--color-text);
    background: var(--color-bg);
  }

  /* ============================================================
     TYPOGRAPHY (escala Mintlify: heading-5 → heading-3)
     ============================================================ */
  h1 { font-size: var(--font-size-xl); font-weight: var(--font-weight-semibold); line-height: var(--line-height-heading); letter-spacing: var(--letter-spacing-tight); }
  h2 { font-size: var(--font-size-lg); font-weight: var(--font-weight-semibold); line-height: var(--line-height-heading); }
  h3 { font-size: var(--font-size-md); font-weight: var(--font-weight-semibold); line-height: var(--line-height-tight); }
  h4 { font-size: var(--font-size-sm); font-weight: var(--font-weight-semibold); line-height: var(--line-height-normal); }

  small { font-size: var(--font-size-xs); color: var(--color-text-secondary); }
  code { font-family: var(--font-family-mono); }

  .page-subtitle {
    margin-top: var(--space-xs);
    color: var(--color-text-secondary);
    font-size: var(--font-size-sm);
    line-height: var(--line-height-normal);
    max-width: 72ch;
  }

  .card > .btn {
    margin-top: var(--space-element);
  }

  /* ============================================================
     CARD — flat, hairline border, radius lg (Mintlify card-base)
     ============================================================ */
  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-card);
    margin-bottom: var(--space-section);
  }

  .card:last-child {
    margin-bottom: 0;
  }

  .card h2 {
    margin: 0 0 var(--space-md) 0;
    font-size: var(--font-size-lg);
    font-weight: var(--font-weight-semibold);
  }

  .card h3 {
    margin: 0 0 var(--space-md) 0;
    font-size: var(--font-size-md);
    font-weight: var(--font-weight-semibold);
  }

  /* Panel — bloco neutro dentro de um card (evita aninhamento de cards) */
  .panel {
    background: var(--color-surface-alt);
    border-radius: var(--radius-md);
    padding: var(--space-lg);
  }

  .panel h3 {
    margin: 0 0 var(--space-md) 0;
    font-size: var(--font-size-md);
    font-weight: var(--font-weight-semibold);
  }

  /* ============================================================
     BUTTONS — pills SEMPRE ({rounded.full}), Mintlify button-*
     ============================================================ */
  .btn {
    font-family: inherit;
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-medium);
    line-height: 1.3;
    padding: 10px 20px;
    border-radius: var(--radius-full);
    border: 1px solid transparent;
    cursor: pointer;
    background: var(--color-primary);
    color: var(--color-on-primary);
    transition: background var(--transition-fast), border-color var(--transition-fast);
    display: inline-block;
  }

  .btn:hover { background: var(--color-primary-hover); }
  .btn:active { background: var(--color-primary-active); }
  .btn:disabled {
    background: var(--color-border);
    color: var(--color-disabled);
    cursor: not-allowed;
  }

  .btn:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 2px;
  }

  .btn.btn-secondary {
    background: transparent;
    border: 1px solid var(--color-border);
    color: var(--color-text);
  }

  .btn.btn-secondary:hover {
    background: var(--color-surface-hover);
  }

  .btn.btn-tertiary {
    background: transparent;
    border: none;
    color: var(--color-text);
    text-decoration: underline;
    padding: var(--space-sm) 0;
  }

  .btn.btn-tertiary:hover {
    text-decoration: none;
  }

  .btn.btn--ghost {
    background: transparent;
    border: 1px solid transparent;
    color: var(--color-text);
    padding: var(--space-sm) var(--space-md);
    border-radius: var(--radius-md);
  }

  .btn.btn--ghost:hover {
    background: var(--color-surface-hover);
  }

  /* Loading state com spinner */
  .btn.loading {
    opacity: 0.7;
    cursor: wait;
    pointer-events: none;
  }

  .btn.loading::after {
    content: '';
    display: inline-block;
    width: 1em;
    height: 1em;
    margin-left: var(--space-sm);
    vertical-align: -0.125em;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: var(--radius-full);
    animation: btn-spin 0.8s linear infinite;
  }

  @keyframes btn-spin {
    to { transform: rotate(360deg); }
  }

  /* ============================================================
     FORM FIELDS — Mintlify text-input (40px, focus = mint border)
     ============================================================ */
  .form-field {
    display: flex;
    flex-direction: column;
    gap: var(--space-xs);
    margin-bottom: var(--space-element);
  }

  .form-field label {
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-medium);
    color: var(--color-text);
  }

  .form-field input,
  .form-field select,
  .form-field textarea {
    font-family: inherit;
    font-size: var(--font-size-md);
    padding: var(--space-sm) var(--space-md);
    height: 40px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    background: var(--color-surface);
    color: var(--color-text);
    transition: border-color var(--transition-fast);
  }

  .form-field textarea {
    height: auto;
  }

  .form-field input:focus,
  .form-field select:focus,
  .form-field textarea:focus {
    outline: none;
    border: 2px solid var(--color-accent);
  }

  .form-field input:disabled,
  .form-field select:disabled {
    background: var(--color-surface-alt);
    color: var(--color-text-tertiary);
    cursor: not-allowed;
  }

  .form-field.error input,
  .form-field.error select,
  .form-field.error textarea {
    border-color: var(--color-error);
    background: var(--color-error-light);
  }

  /* ============================================================
     TABLE — Mintlify feature-comparison (flat, hairline rows)
     ============================================================ */
  .table {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--font-size-sm);
    line-height: var(--line-height-base);
  }

  .table thead {
    background: var(--color-surface-alt);
  }

  .table th {
    text-align: left;
    padding: var(--space-sm) var(--space-lg);
    font-size: var(--font-size-xs);
    font-weight: var(--font-weight-semibold);
    text-transform: uppercase;
    letter-spacing: var(--letter-spacing-micro);
    color: var(--color-text-secondary);
    border-bottom: 1px solid var(--color-border);
  }

  .table td {
    padding: var(--space-md) var(--space-lg);
    border-bottom: 1px solid var(--color-border-light);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .table tbody tr {
    transition: background var(--transition-fast);
  }

  .table tbody tr:hover {
    background: var(--color-surface-hover);
  }

  /* ============================================================
     BADGE — pills ({rounded.full}), caption-bold 13px
     Ícone + cor, nunca cor sozinha (ícones: ✓ ⚠ ✕ i •)
     ============================================================ */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
    padding: 2px 8px;
    border-radius: var(--radius-full);
    font-size: 13px;
    font-weight: var(--font-weight-semibold);
    line-height: 1.4;
    text-transform: uppercase;
    letter-spacing: var(--letter-spacing-micro);
  }

  .badge::before {
    font-weight: var(--font-weight-bold);
  }

  .badge.badge-success {
    background: var(--color-success-light);
    color: var(--color-success-text);
  }
  .badge.badge-success::before { content: '\2713'; } /* ✓ */

  .badge.badge-warning {
    background: var(--color-warning-light);
    color: var(--color-warning-text);
  }
  .badge.badge-warning::before { content: '\26A0'; } /* ⚠ */

  .badge.badge-error {
    background: var(--color-error-light);
    color: var(--color-error-text);
  }
  .badge.badge-error::before { content: '\2715'; } /* ✕ */

  .badge.badge-info {
    background: var(--color-info-light);
    color: var(--color-info-text);
  }
  .badge.badge-info::before { content: 'i'; }

  .badge.badge-primary {
    background: var(--color-primary);
    color: var(--color-on-primary);
  }
  .badge.badge-primary::before { content: '\2022'; } /* • */

  .badge.badge-secondary {
    background: var(--color-surface-hover);
    color: var(--color-text-secondary);
  }
  .badge.badge-secondary::before { content: '\2022'; } /* • */

  .badge.badge-shopee {
    background: var(--color-shopee-light);
    color: var(--color-shopee-text);
  }
  .badge.badge-shopee::before { content: '\2022'; }

  .badge.badge-mercado-livre {
    background: var(--color-mercado-livre-light);
    color: var(--color-mercado-livre-text);
  }
  .badge.badge-mercado-livre::before { content: '\2022'; }

  /* ============================================================
     ALERTS — ícone + dismiss (Mintlify callouts)
     ============================================================ */
  .alert {
    display: flex;
    align-items: flex-start;
    gap: var(--space-sm);
    padding: var(--space-element);
    border-radius: var(--radius-md);
    border-left: 4px solid;
    font-size: var(--font-size-sm);
    line-height: var(--line-height-normal);
    margin-bottom: var(--space-element);
  }

  .alert[hidden] {
    display: none !important;
  }

  .alert:last-child {
    margin-bottom: 0;
  }

  .alert::before {
    font-weight: var(--font-weight-bold);
    line-height: var(--line-height-tight);
  }

  .alert.alert-success {
    background: var(--color-success-light);
    border-color: var(--color-success);
    color: var(--color-success-text);
  }
  .alert.alert-success::before { content: '\2713'; } /* ✓ */

  .alert.alert-warning {
    background: var(--color-warning-light);
    border-color: var(--color-warning);
    color: var(--color-warning-text);
  }
  .alert.alert-warning::before { content: '\26A0'; } /* ⚠ */

  .alert.alert-error,
  .alert.alert-danger {
    background: var(--color-error-light);
    border-color: var(--color-error);
    color: var(--color-error-text);
  }
  .alert.alert-error::before,
  .alert.alert-danger::before { content: '\2715'; } /* ✕ */

  .alert.alert-info {
    background: var(--color-info-light);
    border-color: var(--color-info);
    color: var(--color-info-text);
  }
  .alert.alert-info::before { content: 'i'; }

  .alert a {
    color: inherit;
    font-weight: var(--font-weight-semibold);
    text-decoration: underline;
  }

  .alert .alert-dismiss {
    margin-left: auto;
    background: transparent;
    border: none;
    color: inherit;
    font-size: var(--font-size-md);
    line-height: 1;
    cursor: pointer;
    opacity: 0.7;
    padding: 0 var(--space-xs);
  }

  .alert .alert-dismiss:hover {
    opacity: 1;
  }

  /* ============================================================
     EMPTY / LOADING STATES — lista sem registros e primeira carga
     ============================================================ */
  .empty-state {
    text-align: center;
    padding: var(--space-3xl);
    color: var(--color-text-secondary);
    font-size: var(--font-size-md);
  }
  .empty-state p { margin: 0; }

  .loading-state {
    text-align: center;
    padding: var(--space-3xl);
    color: var(--color-text-tertiary);
    font-size: var(--font-size-md);
  }

  /* ============================================================
     STAT CARDS — flat; destaque = top accent + brand glow
     ============================================================ */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: var(--space-2xl);
    width: 80%;
    margin-bottom: var(--space-section);
  }

  .stat-grid:last-child {
    margin-bottom: 0;
  }

  .stat-card {
    background: var(--color-surface-alt);
    border: 1px solid var(--color-border);
    border-top: 3px solid transparent;
    border-radius: var(--radius-lg);
    padding: var(--space-card);
    text-align: center;
    transition: box-shadow var(--transition-fast);
  }

  .stat-card:hover {
    box-shadow: var(--shadow-sm);
  }

  .stat-card--featured {
    background: var(--color-surface);
    border-top: 3px solid var(--color-accent);
    box-shadow: var(--shadow-brand);
  }

  .stat-card .stat-label {
    display: block;
    font-size: var(--font-size-xs);
    font-weight: var(--font-weight-semibold);
    text-transform: uppercase;
    letter-spacing: var(--letter-spacing-micro);
    color: var(--color-text-secondary);
    margin-bottom: var(--space-sm);
  }

  .stat-card .stat-value {
    display: block;
    font-size: var(--font-size-2xl);
    font-weight: var(--font-weight-semibold);
    line-height: var(--line-height-heading);
    letter-spacing: var(--letter-spacing-tight);
  }

  .stat-card .stat-value--primary { color: var(--color-text); }

  .stat-card .stat-meta {
    display: block;
    margin-top: var(--space-sm);
    font-size: var(--font-size-xs);
    color: var(--color-text-secondary);
  }

  .stat-meta .badge + .badge { margin-left: var(--space-xs); }

  /* ============================================================
     FILTER BAR — controles de filtro acima de tabelas
     ============================================================ */
