<style id="design-tokens-source">
  /* ============================================================
     DESIGN SYSTEM — eCommerce Control Panel
     Fonte única de truth para todos os tokens visuais.
     Nenhum widget usa cor/espaçamento/sombra solto; sempre via token.
     ============================================================ */

  :root {
    /* ========== PALETTE — LIGHT THEME ========== */
    /* Neutrals (grays with a subtle blue hue) */
    --color-bg: #f8f9fa;
    --color-surface: #ffffff;
    --color-surface-hover: #f1f3f5;
    --color-surface-alt: #f1f3f5;
    --color-border: #dee2e6;
    --color-border-light: #e9ecef;
    --color-text: #212529;
    --color-text-secondary: #6c757d;
    --color-text-tertiary: #adb5bd;
    --color-disabled: rgba(0, 0, 0, 0.25);

    /* Primary (blue — trust, professional) */
    --color-primary: #0d6efd;
    --color-primary-hover: #0b5ed7;
    --color-primary-active: #0a58ca;
    --color-primary-light: #cfe2ff;
    --color-on-primary: #ffffff;

    /* Semantic (success, warning, error, info) */
    --color-success: #198754;
    --color-success-light: #d1e7dd;
    --color-success-text: #0f5132;
    --color-warning: #ffc107;
    --color-warning-light: #fff3cd;
    --color-warning-text: #664d00;
    --color-error: #dc3545;
    --color-error-light: #f8d7da;
    --color-error-text: #842029;
    --color-info: #0d6efd;
    --color-info-light: #cfe2ff;
    --color-info-text: #0a58ca;

    /* Marketplace badges */
    --color-shopee: #ee4d2d;
    --color-shopee-light: #fdece7;
    --color-shopee-text: #b3351c;
    --color-mercado-livre: #ffe600;
    --color-mercado-livre-light: #fffbcc;
    --color-mercado-livre-text: #3d3d00;

    /* ========== TYPOGRAPHY ========== */
    --font-family-base: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-family-mono: "Roboto Mono", monospace;

    --font-size-xs: 12px;
    --font-size-sm: 14px;
    --font-size-base: 14px;
    --font-size-md: 16px;
    --font-size-lg: 18px;
    --font-size-xl: 24px;
    --font-size-2xl: 32px;

    --font-weight-regular: 400;
    --font-weight-medium: 500;
    --font-weight-semibold: 600;
    --font-weight-bold: 700;

    --line-height-tight: 1.4;
    --line-height-normal: 1.6;
    --line-height-relaxed: 1.8;
    --line-height-base: 1.5;
    --line-height-heading: 1.2;

    /* ========== SPACING (4px base unit) ========== */
    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 12px;
    --space-lg: 16px;
    --space-xl: 24px;
    --space-2xl: 32px;
    --space-3xl: 48px;

    /* Aliases semânticos */
    --space-element: var(--space-lg);   /* 1rem — espaçamento entre elementos de um grupo */
    --space-card: var(--space-2xl);     /* 2rem — padding interno de cards */
    --space-section: var(--space-3xl);  /* 3rem — respiro entre seções */

    /* ========== LAYOUT ========== */
    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 8px;
    --radius-xl: 12px;
    --radius-full: 9999px;

    --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.1);
    --shadow-md: 0 2px 4px rgba(16, 24, 40, 0.06), 0 4px 12px rgba(16, 24, 40, 0.1);
    --shadow-lg: 0 4px 8px rgba(16, 24, 40, 0.08), 0 12px 32px rgba(16, 24, 40, 0.14);

    /* ========== Z-INDEX SCALE ========== */
    --z-base: 1;
    --z-dropdown: 100;
    --z-modal: 1000;
    --z-tooltip: 1100;
    --z-notification: 1200;
    --z-shell: var(--z-base);
    --z-overlay: var(--z-modal);

    /* ========== TRANSITIONS ========== */
    --ease-out: cubic-bezier(0, 0, 0.2, 1);
    --ease-in: cubic-bezier(0.4, 0, 1, 1);
    --transition-fast: 150ms var(--ease-out);
    --transition-normal: 300ms var(--ease-out);
    --transition-slow: 500ms var(--ease-in);
  }

  /* ========== DARK THEME ========== */
  @media (prefers-color-scheme: dark) {
    :root {
      --color-bg: #1a1d23;
      --color-surface: #242830;
      --color-surface-hover: #2d3139;
      --color-surface-alt: #2d3139;
      --color-border: #3d414d;
      --color-border-light: #4a505a;
      --color-text: #e9ecef;
      --color-text-secondary: #b8bcc4;
      --color-text-tertiary: #868e99;
      --color-disabled: rgba(255, 255, 255, 0.25);

      --color-primary: #0d6efd;
      --color-primary-hover: #31a8ff;
      --color-primary-active: #54b3ff;
      --color-primary-light: #1e3a8a;
      --color-on-primary: #ffffff;

      --color-success: #75b798;
      --color-success-light: #1e4620;
      --color-success-text: #9fd3b2;
      --color-warning: #ffc107;
      --color-warning-light: #664d00;
      --color-warning-text: #ffe08a;
      --color-error: #f17575;
      --color-error-light: #5a1a1a;
      --color-error-text: #f0a8a8;
      --color-info: #54b3ff;
      --color-info-light: #0f3460;
      --color-info-text: #8fc9ff;

      --color-shopee: #ee4d2d;
      --color-shopee-light: #4d2416;
      --color-shopee-text: #ff9b84;
      --color-mercado-livre: #ffd966;
      --color-mercado-livre-light: #3d3d00;
      --color-mercado-livre-text: #ffe08a;

      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 3px rgba(0, 0, 0, 0.4);
      --shadow-md: 0 2px 4px rgba(0, 0, 0, 0.3), 0 4px 12px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 4px 8px rgba(0, 0, 0, 0.35), 0 12px 32px rgba(0, 0, 0, 0.5);
    }
  }

  /* ========== THEME TOGGLE OVERRIDES ========== */
  :root[data-theme="light"] {
    --color-bg: #f8f9fa;
    --color-surface: #ffffff;
    --color-surface-hover: #f1f3f5;
    --color-surface-alt: #f1f3f5;
    --color-border: #dee2e6;
    --color-text: #212529;
    --color-text-secondary: #6c757d;
  }

  :root[data-theme="dark"] {
    --color-bg: #1a1d23;
    --color-surface: #242830;
    --color-surface-hover: #2d3139;
    --color-surface-alt: #2d3139;
    --color-border: #3d414d;
    --color-text: #e9ecef;
    --color-text-secondary: #b8bcc4;
  }

  /* ============================================================
     BASE STYLES
     ============================================================ */
  * { box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    font-family: var(--font-family-base);
    font-size: var(--font-size-sm);
    line-height: var(--line-height-base);
    color: var(--color-text);
    background: var(--color-bg);
  }

  /* ============================================================
     TYPOGRAPHY
     ============================================================ */
  h1 { font-size: var(--font-size-2xl); font-weight: var(--font-weight-bold); line-height: var(--line-height-heading); }
  h2 { font-size: var(--font-size-xl); font-weight: var(--font-weight-semibold); line-height: var(--line-height-heading); }
  h3 { font-size: var(--font-size-lg); font-weight: var(--font-weight-semibold); line-height: var(--line-height-heading); }
  h4 { font-size: var(--font-size-md); font-weight: var(--font-weight-semibold); line-height: var(--line-height-normal); }

  small { font-size: var(--font-size-xs); color: var(--color-text-secondary); }
  code { font-family: var(--font-family-mono); }

  .page-subtitle {
    margin-top: var(--space-xs);
    color: var(--color-text-secondary);
    font-size: var(--font-size-sm);
  }

  .card > .btn {
    margin-top: var(--space-element);
  }

  /* ============================================================
     CARD — container para sections
     ============================================================ */
  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    padding: var(--space-card);
    margin-bottom: var(--space-section);
  }

  .card:last-child {
    margin-bottom: 0;
  }

  .card--elevated {
    box-shadow: var(--shadow-lg);
  }

  .card h2 {
    margin: 0 0 var(--space-md) 0;
    font-size: var(--font-size-lg);
    font-weight: var(--font-weight-semibold);
  }

  .card h3 {
    margin: 0 0 var(--space-md) 0;
    font-size: var(--font-size-lg);
    font-weight: var(--font-weight-semibold);
  }

  /* Panel — bloco neutro dentro de um card (evita aninhamento de cards) */
  .panel {
    background: var(--color-surface-alt);
    border-radius: var(--radius-md);
    padding: var(--space-element);
  }

  .panel h3 {
    margin: 0 0 var(--space-md) 0;
    font-size: var(--font-size-md);
    font-weight: var(--font-weight-semibold);
  }

  /* ============================================================
     BUTTONS — primary (default), secondary, tertiary, ghost
     ============================================================ */
  .btn {
    font-family: inherit;
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-semibold);
    padding: var(--space-sm) var(--space-lg);
    border-radius: var(--radius-md);
    border: 1px solid transparent;
    cursor: pointer;
    background: var(--color-primary);
    color: var(--color-on-primary);
    transition: background var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
    display: inline-block;
  }

  .btn:hover { background: var(--color-primary-hover); }
  .btn:active { background: var(--color-primary-active); }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .btn:focus-visible {
    outline: 2px solid var(--color-primary);
    outline-offset: 2px;
  }

  .btn.btn-secondary {
    background: transparent;
    border: 1px solid var(--color-border);
    color: var(--color-text);
  }

  .btn.btn-secondary:hover {
    background: var(--color-surface-hover);
    border-color: var(--color-border-light);
  }

  .btn.btn-tertiary {
    background: transparent;
    border: none;
    color: var(--color-primary);
    text-decoration: underline;
    padding: var(--space-sm) 0;
  }

  .btn.btn-tertiary:hover {
    text-decoration: none;
  }

  .btn.btn--ghost {
    background: transparent;
    border: 1px solid transparent;
    color: var(--color-primary);
  }

  .btn.btn--ghost:hover {
    background: var(--color-surface-hover);
  }

  /* Loading state com spinner */
  .btn.loading {
    opacity: 0.7;
    cursor: wait;
    pointer-events: none;
  }

  .btn.loading::after {
    content: '';
    display: inline-block;
    width: 1em;
    height: 1em;
    margin-left: var(--space-sm);
    vertical-align: -0.125em;
    border: 2px solid currentColor;
    border-top-color: transparent;
    border-radius: var(--radius-full);
    animation: btn-spin 0.8s linear infinite;
  }

  @keyframes btn-spin {
    to { transform: rotate(360deg); }
  }

  /* ============================================================
     FORM FIELDS — inputs, selects, labels
     ============================================================ */
  .form-field {
    display: flex;
    flex-direction: column;
    gap: var(--space-xs);
    margin-bottom: var(--space-element);
  }

  .form-field label {
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-medium);
    color: var(--color-text);
  }

  .form-field input,
  .form-field select,
  .form-field textarea {
    font-family: inherit;
    font-size: var(--font-size-base);
    padding: var(--space-sm) var(--space-md);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    background: var(--color-surface);
    color: var(--color-text);
    transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
  }

  .form-field input:focus,
  .form-field select:focus,
  .form-field textarea:focus {
    outline: none;
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px var(--color-primary-light);
  }

  .form-field input:disabled,
  .form-field select:disabled {
    background: var(--color-bg);
    color: var(--color-text-tertiary);
    cursor: not-allowed;
  }

  .form-field.error input,
  .form-field.error select,
  .form-field.error textarea {
    border-color: var(--color-error);
    background: var(--color-error-light);
  }

  .form-field.error .form-error-text {
    color: var(--color-error-text);
    font-size: var(--font-size-xs);
  }

  /* ============================================================
     TABLE — data presentation
     ============================================================ */
  .table {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--font-size-sm);
  }

  .table thead {
    background: var(--color-surface-alt);
  }

  .table th {
    text-align: left;
    padding: var(--space-md) var(--space-lg);
    font-weight: var(--font-weight-semibold);
    color: var(--color-text-secondary);
    border-bottom: 1px solid var(--color-border);
  }

  .table td {
    padding: var(--space-md) var(--space-lg);
    border-bottom: 1px solid var(--color-border);
    font-variant-numeric: tabular-nums;
  }

  .table tbody tr:nth-child(odd) {
    background: var(--color-surface-alt);
  }

  .table tbody tr {
    transition: background var(--transition-fast);
  }

  .table tbody tr:hover {
    background: var(--color-surface-hover);
  }

  /* ============================================================
     BADGE — status indicators (ícone + cor, nunca cor sozinha)
     ============================================================ */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
    padding: 4px var(--space-sm);
    border-radius: var(--radius-sm);
    font-size: var(--font-size-xs);
    font-weight: var(--font-weight-semibold);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .badge::before {
    font-weight: var(--font-weight-bold);
  }

  .badge.badge-success {
    background: var(--color-success-light);
    color: var(--color-success-text);
  }
  .badge.badge-success::before { content: '\2713'; } /* ✓ */

  .badge.badge-warning {
    background: var(--color-warning-light);
    color: var(--color-warning-text);
  }
  .badge.badge-warning::before { content: '\26A0'; } /* ⚠ */

  .badge.badge-error {
    background: var(--color-error-light);
    color: var(--color-error-text);
  }
  .badge.badge-error::before { content: '\2715'; } /* ✕ */

  .badge.badge-info {
    background: var(--color-info-light);
    color: var(--color-info-text);
  }
  .badge.badge-info::before { content: 'i'; }

  .badge.badge-primary {
    background: var(--color-primary-light);
    color: var(--color-primary);
  }
  .badge.badge-primary::before { content: '\2022'; } /* • */

  .badge.badge-secondary {
    background: var(--color-surface-hover);
    color: var(--color-text-secondary);
  }
  .badge.badge-secondary::before { content: '\2022'; } /* • */

  .badge.badge-shopee {
    background: var(--color-shopee-light);
    color: var(--color-shopee-text);
  }
  .badge.badge-shopee::before { content: '\2022'; }

  .badge.badge-mercado-livre {
    background: var(--color-mercado-livre-light);
    color: var(--color-mercado-livre-text);
  }
  .badge.badge-mercado-livre::before { content: '\2022'; }

  /* ============================================================
     ALERTS — error, success, warning, info (ícone + dismiss)
     ============================================================ */
  .alert {
    display: flex;
    align-items: flex-start;
    gap: var(--space-sm);
    padding: var(--space-element);
    border-radius: var(--radius-md);
    border-left: 4px solid;
    font-size: var(--font-size-sm);
    line-height: var(--line-height-relaxed);
    margin-bottom: var(--space-element);
  }

  .alert:last-child {
    margin-bottom: 0;
  }

  .alert::before {
    font-weight: var(--font-weight-bold);
    line-height: var(--line-height-tight);
  }

  .alert.alert-success {
    background: var(--color-success-light);
    border-color: var(--color-success);
    color: var(--color-success-text);
  }
  .alert.alert-success::before { content: '\2713'; } /* ✓ */

  .alert.alert-warning {
    background: var(--color-warning-light);
    border-color: var(--color-warning);
    color: var(--color-warning-text);
  }
  .alert.alert-warning::before { content: '\26A0'; } /* ⚠ */

  .alert.alert-error,
  .alert.alert-danger {
    background: var(--color-error-light);
    border-color: var(--color-error);
    color: var(--color-error-text);
  }
  .alert.alert-error::before,
  .alert.alert-danger::before { content: '\2715'; } /* ✕ */

  .alert.alert-info {
    background: var(--color-info-light);
    border-color: var(--color-primary);
    color: var(--color-info-text);
  }
  .alert.alert-info::before { content: 'i'; }

  .alert a {
    color: inherit;
    font-weight: var(--font-weight-semibold);
    text-decoration: underline;
  }

  .alert .alert-dismiss {
    margin-left: auto;
    background: transparent;
    border: none;
    color: inherit;
    font-size: var(--font-size-md);
    line-height: 1;
    cursor: pointer;
    opacity: 0.7;
    padding: 0 var(--space-xs);
  }

  .alert .alert-dismiss:hover {
    opacity: 1;
  }

  /* ============================================================
     STAT CARDS — métricas de destaque (dashboard)
     ============================================================ */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: var(--space-card);
    margin-bottom: var(--space-section);
  }

  .stat-grid:last-child {
    margin-bottom: 0;
  }

  .stat-card {
    background: var(--color-surface-alt);
    border: 1px solid var(--color-border);
    border-left: 4px solid var(--color-primary);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: var(--space-card);
    text-align: center;
    transition: box-shadow var(--transition-fast);
  }

  .stat-card:hover {
    box-shadow: var(--shadow-md);
  }

  .stat-card--warning { border-left-color: var(--color-warning); }
  .stat-card--success { border-left-color: var(--color-success); }
  .stat-card--featured { background: var(--color-surface); box-shadow: var(--shadow-md); }

  .stat-card .stat-label {
    display: block;
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-medium);
    color: var(--color-text-secondary);
    margin-bottom: var(--space-xs);
  }

  .stat-card .stat-value {
    display: block;
    font-size: var(--font-size-2xl);
    font-weight: var(--font-weight-bold);
    line-height: var(--line-height-heading);
  }

  .stat-card .stat-value--primary { color: var(--color-primary); }
  .stat-card .stat-value--warning { color: var(--color-warning-text); }
  .stat-card .stat-value--success { color: var(--color-success-text); }

  .stat-card .stat-meta {
    display: block;
    margin-top: var(--space-sm);
    font-size: var(--font-size-xs);
    color: var(--color-text-secondary);
  }

  .stat-meta .badge + .badge { margin-left: var(--space-xs); }

  /* ============================================================
     FILTER BAR — controles de filtro acima de tabelas
     ============================================================ */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-element);
    align-items: flex-end;
  }

  .filter-bar .form-field {
    flex: 0 0 auto;
    min-width: 160px;
    margin-bottom: 0;
  }

  /* ============================================================
     TABLE CONTAINER — wrapper de tabela com scroll horizontal
     ============================================================ */
  .table-container {
    overflow-x: auto;
  }

  /* ============================================================
     RESULT CARDS — resultado destacado (pricing, inventory)
     ============================================================ */
  .result-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-left: 4px solid var(--color-border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: var(--space-card);
  }

  .result-card--success { border-left-color: var(--color-success); }
  .result-card--error { border-left-color: var(--color-error); }

  .result-card h3 {
    margin: 0 0 var(--space-md) 0;
    font-size: var(--font-size-md);
    font-weight: var(--font-weight-semibold);
  }

  .result-card .result-price {
    font-size: var(--font-size-xl);
    font-weight: var(--font-weight-bold);
    color: var(--color-primary);
    margin-bottom: var(--space-sm);
  }

  .result-card .result-line {
    display: flex;
    justify-content: space-between;
    gap: var(--space-md);
    font-size: var(--font-size-sm);
    color: var(--color-text-secondary);
    margin-bottom: var(--space-xs);
  }

  .result-card .result-profit {
    font-size: var(--font-size-lg);
    font-weight: var(--font-weight-semibold);
    color: var(--color-success-text);
    margin-top: var(--space-sm);
  }

  .result-card .result-error {
    font-size: var(--font-size-sm);
    color: var(--color-error-text);
  }

  /* ============================================================
     LAYOUT — estrutura de widgets (breathing room, grids)
     ============================================================ */
  .widget-grid {
    display: flex;
    flex-direction: column;
  }

  .card-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: var(--space-card);
    align-items: stretch;
    margin-bottom: var(--space-element);
  }

  .card-row:last-child {
    margin-bottom: 0;
  }

  /* ============================================================
     SHELL (navbar, layout)
     ============================================================ */
  .app-shell {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
