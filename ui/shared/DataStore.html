<script>
  // DataStore — delegate fino para __DataClient (spec data-client.md).
  // Código novo usa __DataClient diretamente; esta API antiga continua
  // funcionando delegando 1:1 (mesma cache, mesmo dedupe, mesmo unwrap).
  (function () {
    if (window.__DataStore) return;

    function delegate(name) {
      return function () {
        var client = window.__DataClient;
        if (client) return client[name].apply(client, arguments);
        throw new Error('__DataClient não carregado.');
      };
    }

    window.__DataStore = {
      get: delegate('get'),
      has: delegate('has'),
      set: delegate('set'),
      invalidate: delegate('invalidate'),
      // Compat legacy: getOrFetch resolvia {error} em falha (nunca cacheia o
      // erro). Chamadas novas devem usar __DataClient.fetchData (rejeita).
      getOrFetch: function (key, action, params) {
        var client = window.__DataClient;
        if (!client) return Promise.reject(new Error('__DataClient não carregado.'));
        return client.fetchData(action, params || {}, { key: key }).then(
          function (data) { return data; },
          function (err) { return { error: err && err.message ? err.message : String(err) }; }
        );
      },
      preFetch: function (entries) {
        var client = window.__DataClient;
        if (!client) return Promise.resolve([]);
        return client.preFetch(entries);
      }
    };
  })();
</script>
