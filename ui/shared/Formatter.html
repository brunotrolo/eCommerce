<script>
/**
 * FormatterService — Client-side version for Web App UI.
 * Same logic as src/00_config/FormatterService.js but available in browser.
 * Use: FormatterService.formatCurrency(value), FormatterService.parseDate(value), etc.
 */
var FormatterService = (function () {

  var LOCALE_CONFIG = {
    code: 'pt-BR',
    currency: { symbol: 'R$', position: 'left', decimalSeparator: ',', thousandsSeparator: '.' },
    date: { format: 'DD/MM/YYYY', separator: '/', dayFirst: true },
    time: { format: 'HH:MM:SS', separator: ':' },
    number: { decimalSeparator: ',', thousandsSeparator: '.', groupSize: 3 },
    percent: { decimalSeparator: ',', symbol: '%', position: 'right' }
  };

  function padZero(val, length) {
    length = length || 2;
    var s = String(val);
    while (s.length < length) s = '0' + s;
    return s;
  }

  function removeNonDigits(str) {
    return String(str).replace(/\D/g, '');
  }

  function roundDecimal(value, decimals) {
    if (value === null || value === undefined) return 0;
    var n = Number(value);
    if (isNaN(n) || !isFinite(n)) return 0;
    decimals = decimals !== undefined ? decimals : 2;
    var factor = Math.pow(10, decimals);
    return Math.round(n * factor) / factor;
  }

  function toNumber(value) {
    if (value === null || value === undefined) return 0;
    var n = Number(value);
    return isNaN(n) ? 0 : n;
  }

  function ensureString(value) {
    if (value === null || value === undefined) return '';
    return String(value);
  }

  function formatWithSeparators(intPart, decPart, decSeparator, thousandsSeparator, decimals) {
    var formatted = '';
    var count = 0;
    for (var i = intPart.length - 1; i >= 0; i--) {
      formatted = intPart[i] + formatted;
      count++;
      if (count % 3 === 0 && i > 0) {
        formatted = thousandsSeparator + formatted;
      }
    }
    if (decimals > 0 && decPart) {
      formatted = formatted + decSeparator + decPart;
    }
    return formatted;
  }

  // ─── Formatação ──────────────────────────────────────────────────

  function formatCurrency(value, options) {
    if (value === null || value === undefined) return '';
    var num = toNumber(value);
    var opts = options || {};
    var showSymbol = opts.symbol !== false;
    var decimals = opts.decimals !== undefined ? opts.decimals : 2;

    var isNegative = num < 0;
    if (isNegative) num = Math.abs(num);

    var fixed = num.toFixed(decimals);
    var parts = fixed.split('.');
    var formatted = formatWithSeparators(parts[0], parts[1], LOCALE_CONFIG.currency.decimalSeparator, LOCALE_CONFIG.currency.thousandsSeparator, decimals);

    if (isNegative) formatted = '-' + formatted;
    if (showSymbol) formatted = LOCALE_CONFIG.currency.symbol + ' ' + formatted;
    return formatted;
  }

  function formatDate(date, format) {
    if (date === null || date === undefined) return '';
    var d;
    if (date instanceof Date) {
      d = date;
    } else if (typeof date === 'number') {
      d = new Date(date);
    } else if (typeof date === 'string') {
      var str = date.trim();
      var brParts = str.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
      if (brParts) {
        var day = parseInt(brParts[1], 10);
        var month = parseInt(brParts[2], 10) - 1;
        var year = parseInt(brParts[3], 10);
        d = new Date(year, month, day);
        if (d.getFullYear() !== year || d.getMonth() !== month || d.getDate() !== day) return '';
      } else {
        d = new Date(str);
      }
    } else {
      return '';
    }
    if (isNaN(d.getTime())) return '';

    format = format || LOCALE_CONFIG.date.format;
    var day = d.getDate();
    var month = d.getMonth() + 1;
    var year = d.getFullYear();

    return format.replace('DD', padZero(day)).replace('MM', padZero(month)).replace('YYYY', String(year)).replace('YY', String(year).slice(-2));
  }

  function formatTime(date, format) {
    if (date === null || date === undefined) return '';
    var d;
    if (date instanceof Date) d = date;
    else if (typeof date === 'number') d = new Date(date);
    else if (typeof date === 'string') d = new Date(date);
    else return '';
    if (isNaN(d.getTime())) return '';

    format = format || LOCALE_CONFIG.time.format;
    return format.replace('HH', padZero(d.getHours())).replace('MM', padZero(d.getMinutes())).replace('SS', padZero(d.getSeconds()));
  }

  function formatDateTime(date, format) {
    if (date === null || date === undefined) return '';
    var d;
    if (date instanceof Date) d = date;
    else if (typeof date === 'number') d = new Date(date);
    else if (typeof date === 'string') d = new Date(date);
    else return '';
    if (isNaN(d.getTime())) return '';

    format = format || 'DD/MM/YYYY HH:MM:SS';
    var datePart = formatDate(d, format.split(' ')[0]);
    var timeFormat = format.substring(format.indexOf(' ') + 1);
    var timePart = formatTime(d, timeFormat);
    return datePart + ' ' + timePart;
  }

  function formatPercent(value, decimals) {
    if (value === null || value === undefined) return '';
    var num = toNumber(value);
    decimals = decimals !== undefined ? decimals : 2;

    var percent = num * 100;
    var fixed = percent.toFixed(decimals);
    var parts = fixed.split('.');
    var formatted = formatWithSeparators(parts[0], parts[1], LOCALE_CONFIG.percent.decimalSeparator, LOCALE_CONFIG.number.thousandsSeparator, decimals);
    return formatted + LOCALE_CONFIG.percent.symbol;
  }

  function formatNumber(value, decimals) {
    if (value === null || value === undefined) return '';
    var num = toNumber(value);
    decimals = decimals !== undefined ? decimals : 2;

    var isNegative = num < 0;
    if (isNegative) num = Math.abs(num);

    var fixed = num.toFixed(decimals);
    var parts = fixed.split('.');
    var formatted = formatWithSeparators(parts[0], parts[1], LOCALE_CONFIG.number.decimalSeparator, LOCALE_CONFIG.number.thousandsSeparator, decimals);

    if (isNegative) formatted = '-' + formatted;
    return formatted;
  }

  function formatCNPJ(cnpj) {
    var digits = removeNonDigits(cnpj);
    if (digits.length !== 14) return ensureString(cnpj);
    return digits.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
  }

  function formatCPF(cpf) {
    var digits = removeNonDigits(cpf);
    if (digits.length !== 11) return ensureString(cpf);
    return digits.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/, '$1.$2.$3-$4');
  }

  function formatPhone(phone) {
    var digits = removeNonDigits(phone);
    if (digits.length === 11) return digits.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
    if (digits.length === 10) return digits.replace(/^(\d{2})(\d{4})(\d{4})$/, '($1) $2-$3');
    return ensureString(phone);
  }

  function formatCEP(cep) {
    var digits = removeNonDigits(cep);
    if (digits.length !== 8) return ensureString(cep);
    return digits.replace(/^(\d{5})(\d{3})$/, '$1-$2');
  }

  // ─── Parsing ─────────────────────────────────────────────────────

  function parseCurrency(value) {
    if (value === null || value === undefined) return 0;
    var str = ensureString(value).replace(/R\$/gi, '').trim().replace(/\./g, '').replace(',', '.');
    var num = parseFloat(str);
    return isNaN(num) ? 0 : roundDecimal(num);
  }

  function parseDate(value, format) {
    if (value === null || value === undefined) return null;
    var str = ensureString(value).trim();
    if (!str) return null;
    format = format || 'DD/MM/YYYY';

    if (format === 'DD/MM/YYYY') {
      var parts = str.split('/');
      if (parts.length !== 3) return null;
      var day = parseInt(parts[0], 10), month = parseInt(parts[1], 10) - 1, year = parseInt(parts[2], 10);
      if (isNaN(day) || isNaN(month) || isNaN(year)) return null;
      var d = new Date(year, month, day);
      if (d.getFullYear() !== year || d.getMonth() !== month || d.getDate() !== day) return null;
      return d;
    }

    if (format === 'YYYY-MM-DD') {
      var p = str.split('-');
      if (p.length !== 3) return null;
      var y = parseInt(p[0], 10), m = parseInt(p[1], 10) - 1, dd = parseInt(p[2], 10);
      if (isNaN(y) || isNaN(m) || isNaN(dd)) return null;
      var d2 = new Date(y, m, dd);
      if (d2.getFullYear() !== y || d2.getMonth() !== m || d2.getDate() !== dd) return null;
      return d2;
    }

    var d3 = new Date(str);
    return isNaN(d3.getTime()) ? null : d3;
  }

  function parseTime(value) {
    if (value === null || value === undefined) return null;
    var parts = ensureString(value).trim().split(':');
    if (parts.length < 2) return null;
    var hours = parseInt(parts[0], 10), minutes = parseInt(parts[1], 10), seconds = parts.length > 2 ? parseInt(parts[2], 10) : 0;
    if (isNaN(hours) || isNaN(minutes) || isNaN(seconds)) return null;
    if (hours < 0 || hours > 23 || minutes < 0 || minutes > 59 || seconds < 0 || seconds > 59) return null;
    return { hours: hours, minutes: minutes, seconds: seconds };
  }

  function parseDateTime(value, format) {
    if (value === null || value === undefined) return null;
    var str = ensureString(value).trim();
    if (!str) return null;
    format = format || 'DD/MM/YYYY HH:MM:SS';
    var spaceIdx = str.indexOf(' ');
    if (spaceIdx === -1) return parseDate(str, format.split(' ')[0]);
    var d = parseDate(str.substring(0, spaceIdx), format.split(' ')[0]);
    if (!d) return null;
    var t = parseTime(str.substring(spaceIdx + 1));
    if (!t) return null;
    return new Date(d.getFullYear(), d.getMonth(), d.getDate(), t.hours, t.minutes, t.seconds);
  }

  function parsePercent(value) {
    if (value === null || value === undefined) return 0;
    var str = ensureString(value).trim().replace(/%/g, '').trim().replace(/\./g, '').replace(',', '.');
    var num = parseFloat(str);
    if (isNaN(num)) return 0;
    if (Math.abs(num) > 1) return roundDecimal(num / 100);
    return roundDecimal(num);
  }

  function parseNumber(value) {
    if (value === null || value === undefined) return 0;
    var str = ensureString(value).trim().replace(/\./g, '').replace(',', '.');
    var num = parseFloat(str);
    return isNaN(num) ? 0 : num;
  }

  function parseCNPJ(cnpj) { return removeNonDigits(cnpj); }
  function parseCPF(cpf) { return removeNonDigits(cpf); }
  function parsePhone(phone) { return removeNonDigits(phone); }
  function parseCEP(cep) { return removeNonDigits(cep); }

  return {
    formatCurrency: formatCurrency,
    formatDate: formatDate,
    formatTime: formatTime,
    formatDateTime: formatDateTime,
    formatPercent: formatPercent,
    formatNumber: formatNumber,
    formatCNPJ: formatCNPJ,
    formatCPF: formatCPF,
    formatPhone: formatPhone,
    formatCEP: formatCEP,
    parseCurrency: parseCurrency,
    parseDate: parseDate,
    parseTime: parseTime,
    parseDateTime: parseDateTime,
    parsePercent: parsePercent,
    parseNumber: parseNumber,
    parseCNPJ: parseCNPJ,
    parseCPF: parseCPF,
    parsePhone: parsePhone,
    parseCEP: parseCEP
  };
})();
</script>
