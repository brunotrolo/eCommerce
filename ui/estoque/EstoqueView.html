<template id="estoque-widget-template">
  <style>
    :host { display: block; }
    .container { padding: var(--space-xl); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-xl); }
    .header h1 { margin: 0; font-size: var(--font-size-xl); font-weight: var(--font-weight-bold); color: var(--color-text); }
    .btn { padding: var(--space-sm) var(--space-lg); border-radius: var(--radius-sm); font-size: var(--font-size-sm); font-weight: var(--font-weight-medium); cursor: pointer; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); transition: background var(--transition-fast); }
    .btn:hover { background: var(--color-surface-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--color-primary); color: var(--color-on-primary); border-color: var(--color-primary); }
    .btn-primary:hover { background: var(--color-primary-hover); }
    .btn-sm { padding: 2px var(--space-xs); font-size: var(--font-size-xs); }
    .btn-catalog { background: var(--color-info-light); color: var(--color-info-text); border-color: var(--color-info); font-size: var(--font-size-xs); padding: 2px 6px; }
    .btn-catalog:hover { background: var(--color-info); color: white; }
    .stats { display: flex; gap: var(--space-xl); margin-bottom: var(--space-lg); font-size: var(--font-size-sm); color: var(--color-text-secondary); }
    .stats-value { font-weight: var(--font-weight-semibold); color: var(--color-text); }
    .filter-bar { display: flex; gap: var(--space-md); margin-bottom: var(--space-lg); flex-wrap: wrap; }
    .filter-bar input, .filter-bar select { padding: var(--space-xs) var(--space-sm); border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-size: var(--font-size-sm); background: var(--color-surface); color: var(--color-text); }
    .table-wrapper { overflow-x: auto; border: 1px solid var(--color-border); border-radius: var(--radius-sm); }
    table { width: 100%; border-collapse: collapse; font-size: var(--font-size-sm); color: var(--color-text); }
    th { text-align: left; padding: var(--space-sm) var(--space-md); background: var(--color-surface-alt); font-weight: var(--font-weight-semibold); border-bottom: 1px solid var(--color-border); white-space: nowrap; cursor: pointer; user-select: none; }
    th:hover { background: var(--color-surface-hover); }
    td { padding: var(--space-sm) var(--space-md); border-bottom: 1px solid var(--color-border-light); white-space: nowrap; }
    tr:hover td { background: var(--color-surface-hover); }
    .badge { display: inline-block; padding: 2px var(--space-sm); border-radius: var(--radius-xs); font-size: var(--font-size-xs); font-weight: var(--font-weight-medium); }
    .badge-success { background: var(--color-success-light); color: var(--color-success-text); }
    .badge-warning { background: var(--color-warning-light); color: var(--color-warning-text); }
    .badge-error { background: var(--color-error-light); color: var(--color-error-text); }
    .badge-info { background: var(--color-info-light); color: var(--color-info-text); }
    .alert-icon { color: var(--color-warning); font-size: var(--font-size-lg); cursor: help; }
    .empty-state { text-align: center; padding: var(--space-3xl); color: var(--color-text-secondary); }
    .loading { text-align: center; padding: var(--space-3xl); color: var(--color-text-tertiary); }
    .detail-row { display: none; }
    .detail-row.open { display: table-row; }
    .detail-cell { padding: var(--space-md) var(--space-xl); background: var(--color-surface-alt); font-size: var(--font-size-xs); color: var(--color-text-secondary); }
    .margem-positive { color: var(--color-success-text); }
    .margem-warning { color: var(--color-warning-text); }
    .margem-negative { color: var(--color-error-text); }
    .sort-arrow { margin-left: 4px; font-size: 10px; }
    .inline-input { width: 90px; padding: 2px 4px; border: 1px solid var(--color-border); border-radius: var(--radius-xs); font-size: var(--font-size-sm); background: var(--color-surface); color: var(--color-text); text-align: right; }
    .inline-input:focus { border-color: var(--color-primary); outline: none; box-shadow: 0 0 0 2px var(--color-primary-light); }
    .inline-input.saving { border-color: var(--color-warning); background: var(--color-warning-light); }
    .inline-select { padding: 2px 4px; border: 1px solid var(--color-border); border-radius: var(--radius-xs); font-size: var(--font-size-xs); background: var(--color-surface); color: var(--color-text); cursor: pointer; }
    .inline-select:focus { border-color: var(--color-primary); outline: none; }
    .price-group { display: flex; align-items: center; gap: 4px; }
    .catalog-btn { cursor: pointer; border: none; background: none; color: var(--color-info); font-size: 12px; padding: 0; line-height: 1; title: { content: 'Preencher com preço do catálogo'; } }
    .catalog-btn:hover { color: var(--color-info-hover); }
    .row-edited td { background: var(--color-info-light) !important; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: var(--space-md); }
    .header-actions { display: flex; align-items: center; gap: var(--space-sm); }
    .view-toggle {
      display: inline-flex; border: 1px solid var(--color-border); border-radius: var(--radius-sm); overflow: hidden;
    }
    .view-toggle button {
      padding: var(--space-xs) var(--space-md); border: none; background: var(--color-surface);
      color: var(--color-text-secondary); font-size: var(--font-size-sm); cursor: pointer;
      transition: background var(--transition-fast), color var(--transition-fast);
    }
    .view-toggle button + button { border-left: 1px solid var(--color-border); }
    .view-toggle button.active {
      background: var(--color-primary); color: var(--color-on-primary); font-weight: var(--font-weight-medium);
    }
    .view-toggle button:hover:not(.active) { background: var(--color-surface-hover); }
    .consolidado-th { text-align: right; }

    .modal-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0, 0, 0, 0.5);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      width: 95vw; max-width: 480px;
      padding: var(--space-xl);
      box-shadow: var(--shadow-lg);
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: var(--space-lg);
    }
    .modal-header h2 {
      margin: 0; font-size: var(--font-size-lg); font-weight: var(--font-weight-bold);
      color: var(--color-text);
    }
    .btn-close {
      background: none; border: none; cursor: pointer;
      font-size: var(--font-size-lg); color: var(--color-text-secondary);
      padding: var(--space-xs); border-radius: var(--radius-xs);
    }
    .btn-close:hover { background: var(--color-surface-hover); }
    .btn-close:disabled { cursor: default; opacity: 0.4; }
    .sync-status {
      font-size: var(--font-size-base); font-weight: var(--font-weight-medium);
      color: var(--color-text); margin-bottom: var(--space-xs);
    }
    .sync-stage {
      font-size: var(--font-size-sm); color: var(--color-text-secondary);
      margin-bottom: var(--space-sm); min-height: 1.2em;
    }
    .progress-track {
      height: 8px; border-radius: var(--radius-full);
      background: var(--color-surface-alt); overflow: hidden;
      margin-bottom: var(--space-md);
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: var(--color-primary);
      border-radius: var(--radius-full);
      transition: width 0.25s ease;
    }
    .sync-summary { font-size: var(--font-size-sm); color: var(--color-text-secondary); }
  </style>
  <div class="container">
    <div class="header">
      <h1>Controle de Estoque</h1>
      <div class="header-actions">
        <div class="view-toggle" id="view-toggle">
          <button class="active" data-view="completo">Completo</button>
          <button data-view="consolidado">Consolidado</button>
        </div>
        <button class="btn" id="btn-reprocess" title="Lê todos os pedidos da aba PEDIDOS e aplica baixa FIFO para os que ainda não foram baixados">Reprocessar Pendentes</button>
        <button class="btn" id="btn-sync-prices" title="Preenche/atualiza preços Shopee e ML de TODOS os itens a partir do catálogo">Sincronizar Preços Catálogo</button>

    <div class="stats" id="stats-bar">

      <span>Vendido: <span class="stats-value" id="stat-vendido">0</span></span>

    <div class="filter-bar">
      <input type="text" id="filter-codigo" placeholder="Filtrar por codigo..." />
      <input type="text" id="filter-nome" placeholder="Filtrar por nome do produto..." />
      <input type="text" id="filter-categoria" placeholder="Filtrar por categoria..." />
      <select id="filter-status">
        <option value="">Todos</option>
        <option value="DISPONIVEL" selected>DISPONIVEL</option>
        <option value="VENDIDO">VENDIDO</option>
        <option value="DEVOLVIDO">DEVOLVIDO</option>
        <option value="QUEBRADO">QUEBRADO</option>
        <option value="COM_DEFEITO">COM DEFEITO</option>
      </select>
    </div>
    <div class="table-wrapper">
      <table id="estoque-table">
        <thead>
          <tr>
            <th data-sort="estoque_id">ESTOQUE_ID <span class="sort-arrow"></span></th>
            <th data-sort="categoria">Categoria <span class="sort-arrow"></span></th>
            <th data-sort="codigo">Código <span class="sort-arrow"></span></th>
            <th data-sort="descricao">Descrição <span class="sort-arrow"></span></th>
            <th data-sort="data_entrada">Data Entrada <span class="sort-arrow"></span></th>
            <th data-sort="preco_custo">Custo <span class="sort-arrow"></span></th>
            <th>Preco Shopee</th>
            <th>Preco ML</th>
            <th data-sort="margem">Margem% <span class="sort-arrow"></span></th>
            <th>Status</th>
            <th>Baixado</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="estoque-tbody"></tbody>
      </table>
    </div>
    <div class="table-wrapper" id="consolidado-wrapper" style="display:none;">
      <table id="consolidado-table">
        <thead>
          <tr>
            <th data-sort="categoria">Categoria <span class="sort-arrow"></span></th>
            <th data-sort="codigo">Código <span class="sort-arrow"></span></th>
            <th data-sort="descricao">Descrição <span class="sort-arrow"></span></th>
            <th data-sort="qtd" class="consolidado-th">Qtd <span class="sort-arrow"></span></th>
            <th data-sort="preco_custo" class="consolidado-th">Custo Médio <span class="sort-arrow"></span></th>
            <th class="consolidado-th">Preco Shopee</th>
            <th class="consolidado-th">Preco ML</th>
            <th data-sort="margem" class="consolidado-th">Margem% <span class="sort-arrow"></span></th>
            <th data-sort="alerta">Alerta <span class="sort-arrow"></span></th>
            <th>Baixado</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="consolidado-tbody"></tbody>
      </table>
    </div>
    <div class="loading" id="loading-state">Carregando estoque...</div>
    <div id="error-box" class="alert alert-error" hidden></div>
    <div id="result-box" hidden></div>
  </div>

  <div class="modal-overlay" id="sync-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Sincronizando Estoque</h2>
        <button class="btn-close" id="btn-sync-close" title="Fechar">&times;</button>
      </div>
      <div class="sync-status" id="sync-status">Preparando sincronização...</div>
      <div class="sync-stage" id="sync-stage"></div>
      <div class="progress-track"><div class="progress-fill" id="sync-progress"></div></div>
      <div class="sync-summary" id="sync-summary"></div>
    </div>
  </div>

  <div class="modal-overlay" id="baixa-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Dar Baixa - Estoque</h2>
        <button class="btn-close" id="btn-baixa-close" title="Fechar">&times;</button>
      </div>
      <div style="margin-bottom: var(--space-md);">
        <label style="font-size: var(--font-size-sm); font-weight: var(--font-weight-medium);">Produto</label>
        <div id="baixa-produto" style="font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-top: 4px;"></div>
      </div>
      <div style="margin-bottom: var(--space-md);">
        <label style="font-size: var(--font-size-sm); font-weight: var(--font-weight-medium);">Quantidade</label>
        <input type="number" id="baixa-qty" min="1" value="1" style="width: 80px; padding: 4px 8px; border: 1px solid var(--color-border); border-radius: var(--radius-sm); font-size: var(--font-size-sm); margin-top: 4px;" />
      </div>
      <div id="baixa-status" style="font-size: var(--font-size-sm); color: var(--color-text-secondary); margin-bottom: var(--space-sm); min-height: 1.2em;"></div>
      <div style="display: flex; gap: var(--space-sm); justify-content: flex-end;">
        <button class="btn" id="btn-baixa-cancel">Cancelar</button>
        <button class="btn btn-primary" id="btn-baixa-confirm">Confirmar Baixa</button>
      </div>

</template>
<script>
  (function () {
    if (document.getElementById('estoque-widget')) return;
    if (customElements.get('estoque-widget')) return;

    var STATUS_OPTIONS = [
      { value: 'DISPONIVEL', label: 'DISPONIVEL' },
      { value: 'VENDIDO', label: 'VENDIDO' },
      { value: 'DEVOLVIDO', label: 'DEVOLVIDO' },
      { value: 'QUEBRADO', label: 'QUEBRADO' },
      { value: 'COM_DEFEITO', label: 'COM DEFEITO' }
    ];

    var STATUS_BADGE = {
      'DISPONIVEL': 'badge-success',
      'VENDIDO': 'badge-info',
      'DEVOLVIDO': 'badge-warning',
      'QUEBRADO': 'badge-error',
      'COM_DEFEITO': 'badge-error'
    };

    // Parser de datas BR (dd/MM/yyyy[ HH:mm:ss]) e ISO legado para ordenação.
    // Necessário porque new Date("05/08/2026") em V8 é interpretado como US (May 8).
    function _parseBrDate_(str) {
      if (!str) return 0;
      var s = String(str).trim();
      var m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
      if (m) {
        var d = new Date(
          Number(m[3]), Number(m[2]) - 1, Number(m[1]),
          Number(m[4]) || 0, Number(m[5]) || 0, Number(m[6]) || 0
        );
        if (!isNaN(d.getTime())) return d.getTime();
      }
      var legacy = new Date(s);
      return isNaN(legacy.getTime()) ? 0 : legacy.getTime();
    }

    class EstoqueWidget extends HTMLElement {
      connectedCallback() {
        var template = document.getElementById('estoque-widget-template');
        var shadow = this.attachShadow({ mode: 'open' });
        shadow.adoptedStyleSheets = [window.__DESIGN_SHEET__];
        shadow.appendChild(template.content.cloneNode(true));
        this._shadow = shadow;
        this._items = [];
        this._filtered = [];
        this._sortField = 'data_entrada';
        this._sortOrder = 'asc';
        this._openRows = {};
        this._saving = {};
        this._viewMode = 'completo';
        this._consolidatedSortField = 'qtd';
        this._consolidatedSortOrder = 'desc';

        var self = this;
        shadow.getElementById('btn-sync').addEventListener('click', function () { self._sync(); });
        shadow.getElementById('btn-sync-prices').addEventListener('click', function () { self._syncPrecos(); });
        shadow.getElementById('btn-reprocess').addEventListener('click', function () { self._reprocessar(); });
        shadow.getElementById('btn-baixa-close').addEventListener('click', function () {
          shadow.getElementById('baixa-overlay').classList.remove('open');
        });
        shadow.getElementById('btn-baixa-cancel').addEventListener('click', function () {
          shadow.getElementById('baixa-overlay').classList.remove('open');
        });
        shadow.getElementById('btn-baixa-confirm').addEventListener('click', function () { self._confirmarBaixa(); });
        shadow.getElementById('btn-sync-close').addEventListener('click', function () {
          shadow.getElementById('sync-overlay').classList.remove('open');
        });
        shadow.getElementById('filter-codigo').addEventListener('input', function () { self._applyFilters(); });
        shadow.getElementById('filter-nome').addEventListener('input', function () { self._applyFilters(); });
        shadow.getElementById('filter-categoria').addEventListener('input', function () { self._applyFilters(); });
        shadow.getElementById('filter-status').addEventListener('change', function () { self._applyFilters(); });

        var toggleBtns = shadow.querySelectorAll('#view-toggle button');
        for (var t = 0; t < toggleBtns.length; t++) {
          (function (btn) {
            btn.addEventListener('click', function () {
              self._viewMode = btn.getAttribute('data-view');
              for (var j = 0; j < toggleBtns.length; j++) toggleBtns[j].classList.remove('active');
              btn.classList.add('active');
              self._render();
            });
          })(toggleBtns[t]);
        }

        var cThs = shadow.querySelectorAll('#consolidado-table th[data-sort]');
        for (var ct = 0; ct < cThs.length; ct++) {
          (function (th) {
            th.addEventListener('click', function () {
              var field = th.getAttribute('data-sort');
              if (self._consolidatedSortField === field) self._consolidatedSortOrder = self._consolidatedSortOrder === 'asc' ? 'desc' : 'asc';
              else { self._consolidatedSortField = field; self._consolidatedSortOrder = 'desc'; }
              self._render();
            });
          })(cThs[ct]);
        }

        var ths = shadow.querySelectorAll('th[data-sort]');
        for (var i = 0; i < ths.length; i++) {
          (function (th) {
            th.addEventListener('click', function () { self._onSort(th.getAttribute('data-sort')); });
          })(ths[i]);
        }

        this._load();
      }

      _el(id) {
        return this._shadow.getElementById(id);
      }

      _invalidateCache() {
        var ds = window.__DataStore;
        if (!ds) return;
        var statuses = ['DISPONIVEL', 'VENDIDO', 'DEVOLVIDO', 'QUEBRADO', 'COM_DEFEITO'];
        for (var i = 0; i < statuses.length; i++) {
          ds.invalidate('estoque.Items.' + statuses[i]);
        }
      }

      _load() {
        var self = this;
        var loadingEl = this._el('loading-state');
        if (loadingEl) loadingEl.style.display = 'block';

        var statusVal = this._el('filter-status').value || 'DISPONIVEL';
        var params = { status: statusVal };
        var cacheKey = 'estoque.Items.' + statusVal;
        var ds = window.__DataStore;

        if (ds) {
          ds.getOrFetch(cacheKey, 'estoque.getItems', params)
            .then(function (resp) {
              if (loadingEl) loadingEl.style.display = 'none';
              var data = self._unwrap(resp);
              self._items = (data && data.items) ? data.items : (Array.isArray(data) ? data : []);
              self._applyFilters();
            })
            .catch(function (err) {
              if (loadingEl) loadingEl.style.display = 'none';
              showError(self._shadow, 'Erro ao carregar estoque: ' + (err.message || err));
            });
        } else {
          google.script.run
            .withSuccessHandler(function (resp) {
              if (loadingEl) loadingEl.style.display = 'none';
              var data = self._unwrap(resp);
              self._items = (data && data.items) ? data.items : (Array.isArray(data) ? data : []);
              self._applyFilters();
            })
            .withFailureHandler(function (err) {
              if (loadingEl) loadingEl.style.display = 'none';
              showError(self._shadow, 'Erro ao carregar estoque: ' + (err.message || err));
            })
            .apiDispatch('estoque.getItems', params);
        }
      }

      _unwrap(resp) {
        if (!resp) return null;
        if (resp.data && resp.data.data !== undefined) return resp.data.data;
        if (resp.data !== undefined) return resp.data;
        return resp;
      }

      _sync() {
        var self = this;
        var btn = this._el('btn-sync');
        var overlay = this._el('sync-overlay');
        var closeBtn = this._el('btn-sync-close');
        var statusEl = this._el('sync-status');
        var stageEl = this._el('sync-stage');
        var summaryEl = this._el('sync-summary');
        var fill = this._el('sync-progress');

        var totalPassos = 0;
        var passoAtual = 0;
        var totalImportado = 0;
        var fila = [];
        var encerrado = false;

        function setStatus(text) { statusEl.textContent = text; }
        function setStage(text) { stageEl.textContent = text; }
        function setSummary(text) { summaryEl.textContent = text; }
        function setProgress(pct) { fill.style.width = pct + '%'; }

        function abrir() {
          overlay.classList.add('open');
          closeBtn.disabled = true;
          btn.disabled = true;
          setProgress(0);
          setStage('');
          setSummary('');
          setStatus('Preparando sincronização...');
        }

        function concluir(mensagem, erro) {
          if (encerrado) return;
          encerrado = true;
          closeBtn.disabled = false;
          btn.disabled = false;
          if (!erro) setProgress(100);
          setSummary(mensagem);
          self._invalidateCache();
          self._load();
        }

        function proximo() {
          if (encerrado) return;
          if (passoAtual >= totalPassos) {
            setStatus('Sincronização concluída');
            concluir(totalImportado + ' unidade(s) importada(s).');
            return;
          }
          var item = fila[passoAtual];
          setStatus(item.label);
          setProgress(Math.round((passoAtual / totalPassos) * 100));

          google.script.run
            .withSuccessHandler(function (resp) {
              var data = self._unwrap(resp);
              if (data && data.error) {
                setStatus('Erro no passo ' + item.label);
                concluir(data.error, true);
                return;
              }
              var imp = (data && data.itemsImported) ? data.itemsImported : 0;
              totalImportado += imp;
              passoAtual++;
              setStage('Passo ' + passoAtual + ' de ' + totalPassos);
              proximo();
            })
            .withFailureHandler(function (err) {
              setStatus('Erro');
              concluir('Erro no passo ' + item.label + ': ' + (err.message || err), true);
            })
            .apiDispatch('estoque.sincronizarPasso', item.acoes);
        }

        abrir();

        google.script.run
          .withSuccessHandler(function (resp) {
            var data = self._unwrap(resp);
            if (data && data.error) {
              setStatus('Erro ao preparar');
              concluir(data.error, true);
              return;
            }
            var nfes = (data && data.nfes) ? data.nfes : [];
            var manuais = (data && data.manuais) ? data.manuais : [];
            totalPassos = nfes.length + manuais.length;

            if (totalPassos === 0) {
              setStatus('Nada novo para sincronizar');
              concluir('Tudo em dia — nenhuma NF ou entrada manual pendente.');
              return;
            }

            for (var i = 0; i < nfes.length; i++) {
              fila.push({
                label: 'Sincronizando NF ' + nfes[i].numeroNf + '...',
                acoes: { tipo: 'nf', numeroNf: nfes[i].numeroNf, chaveNf: nfes[i].chaveNf }
              });
            }
            for (var j = 0; j < manuais.length; j++) {
              fila.push({
                label: 'Sincronizando entrada manual ' + manuais[j].logId + '...',
                acoes: { tipo: 'manual', logId: manuais[j].logId }
              });
            }

            setStage('Encontrado(s) ' + totalPassos + ' passo(s) pendente(s)');
            proximo();
          })
          .withFailureHandler(function (err) {
            setStatus('Erro ao preparar');
            concluir('Erro ao preparar sincronização: ' + (err.message || err), true);
          })
          .apiDispatch('estoque.sincronizarPreparar', {});
      }

      _syncPrecos() {
        var self = this;
        var btn = this._el('btn-sync-prices');
        var originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Sincronizando preços...';

        google.script.run
          .withSuccessHandler(function (resp) {
            btn.disabled = false;
            btn.textContent = originalText;
            var data = self._unwrap(resp);
            if (data && data.error) {
              showError(self._shadow, data.error);
            } else if (data) {
              var msg = data.atualizados + ' item(ns) atualizado(s).';
              if (data.semPrecoCatalogo > 0) {
                msg += ' ' + data.semPrecoCatalogo + ' sem preço no catálogo.';
              }
              showSuccess(self._shadow, msg);
              self._invalidateCache();
              self._load();
            }
          })
          .withFailureHandler(function (err) {
            btn.disabled = false;
            btn.textContent = originalText;
            showError(self._shadow, 'Erro ao sincronizar preços: ' + (err.message || err));
          })
          .apiDispatch('estoque.sincronizarPrecosCatalogo', {});
      }

      _applyFilters() {
        var codigo = (this._el('filter-codigo').value || '').toLowerCase().trim();
        var nome = (this._el('filter-nome').value || '').toLowerCase().trim();
        var categoria = (this._el('filter-categoria').value || '').toLowerCase().trim();
        var status = this._el('filter-status').value;

        var items = this._items;
        if (status) {
          var statusNorm = status.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
          items = items.filter(function (it) {
            var st = (it.STATUS || '').toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            return st === statusNorm;
          });
        }
        if (codigo) {
          items = items.filter(function (it) {
            return (it.CODIGO_PRODUTO || '').toLowerCase().indexOf(codigo) !== -1;
          });
        }
        if (nome) {
          items = items.filter(function (it) {
            return (it.DESCRICAO_PRODUTO || '').toLowerCase().indexOf(nome) !== -1;
          });
        }
        if (categoria) {
          items = items.filter(function (it) {
            return ((it.CATEGORIA || '') + ' ' + (it.CATEGORIA_PRODUTO || '')).toLowerCase().indexOf(categoria) !== -1;
          });
        }

        this._filtered = items;
        this._render();
      }

      _onSort(field) {
        if (this._sortField === field) {
          this._sortOrder = this._sortOrder === 'asc' ? 'desc' : 'asc';
        } else {
          this._sortField = field;
          this._sortOrder = 'asc';
        }
        this._applyFilters();
        this._updateSortArrows();
      }

      _updateSortArrows() {
        var ths = this._shadow.querySelectorAll('th[data-sort]');
        for (var i = 0; i < ths.length; i++) {
          var arrow = ths[i].querySelector('.sort-arrow');
          if (ths[i].getAttribute('data-sort') === this._sortField) {
            arrow.textContent = this._sortOrder === 'asc' ? '\u25B2' : '\u25BC';
          } else {
            arrow.textContent = '';
          }
        }
      }

      _sortItems(items) {
        var field = this._sortField;
        var order = this._sortOrder;
        var sortMap = {
          'estoque_id': 'ESTOQUE_ID',
          'categoria': 'CATEGORIA',
          'codigo': 'CODIGO_PRODUTO',
          'descricao': 'DESCRICAO_PRODUTO',
          'data_entrada': 'DATA_ENTRADA',
          'preco_custo': 'PRECO_CUSTO_ORIGINAL',
          'margem': 'MARGEM_SHOPEE'
        };
        var key = sortMap[field] || 'DATA_ENTRADA';

        return items.slice().sort(function (a, b) {
          var valA = a[key];
          var valB = b[key];
          if (key === 'DATA_ENTRADA') {
            valA = _parseBrDate_(valA);
            valB = _parseBrDate_(valB);
            return order === 'asc' ? valA - valB : valB - valA;
          }
          if (key === 'CATEGORIA' || key === 'ESTOQUE_ID' || key === 'CODIGO_PRODUTO' || key === 'DESCRICAO_PRODUTO') {
            valA = String(valA || '').toLowerCase();
            valB = String(valB || '').toLowerCase();
            return order === 'asc' ? (valA < valB ? -1 : valA > valB ? 1 : 0) : (valA < valB ? 1 : valA > valB ? -1 : 0);
          }
          valA = parseFloat(valA) || 0;
          valB = parseFloat(valB) || 0;
          return order === 'asc' ? valA - valB : valB - valA;
        });
      }

      _render() {
        var completoWrapper = this._el('estoque-table').closest('.table-wrapper');
        var consolidadoWrapper = this._el('consolidado-wrapper');
        if (this._viewMode === 'consolidado') {
          completoWrapper.style.display = 'none';
          consolidadoWrapper.style.display = '';
          this._renderConsolidated();
        } else {
          completoWrapper.style.display = '';
          consolidadoWrapper.style.display = 'none';
          this._renderCompleto();
        }
      }

      _consolidate() {
        var groups = {};
        for (var i = 0; i < this._filtered.length; i++) {
          var it = this._filtered[i];
          var code = it.CODIGO_PRODUTO || '';
          if (!groups[code]) {
            groups[code] = {
              CODIGO_PRODUTO: code,
              DESCRICAO_PRODUTO: it.DESCRICAO_PRODUTO || '',
              CATEGORIA: it.CATEGORIA || '',
              itens: [],
              qtd: 0,
              custoTotal: 0,
              custoCount: 0,
              PRECO_VENDA_SHOPEE: it.PRECO_VENDA_SHOPEE,
              PRECO_VENDA_MERCADO_LIVRE: it.PRECO_VENDA_MERCADO_LIVRE,
              MARGEM_SHOPEE: it.MARGEM_SHOPEE,
              MARGEM_MERCADO_LIVRE: it.MARGEM_MERCADO_LIVRE,
              hasAlerta: false
            };
          }
          var g = groups[code];
          g.itens.push(it);
          g.qtd++;
          var custo = parseFloat(it.PRECO_CUSTO_ORIGINAL);
          if (!isNaN(custo) && custo > 0) { g.custoTotal += custo; g.custoCount++; }
          if (it.ALERTA_ESTOQUE_BAIXO === true || it.ALERTA_ESTOQUE_BAIXO === 'true') g.hasAlerta = true;
          if (it.PRECO_VENDA_SHOPEE != null && it.PRECO_VENDA_SHOPEE !== '') g.PRECO_VENDA_SHOPEE = it.PRECO_VENDA_SHOPEE;
          if (it.PRECO_VENDA_MERCADO_LIVRE != null && it.PRECO_VENDA_MERCADO_LIVRE !== '') g.PRECO_VENDA_MERCADO_LIVRE = it.PRECO_VENDA_MERCADO_LIVRE;
        }
        var result = [];
        var keys = Object.keys(groups);
        for (var k = 0; k < keys.length; k++) {
          var g = groups[keys[k]];
          g.custoMedio = g.custoCount > 0 ? g.custoTotal / g.custoCount : 0;
          result.push(g);
        }
        return result;
      }

      _sortConsolidated(items) {
        var field = this._consolidatedSortField;
        var order = this._consolidatedSortOrder;
        var sortMap = {
          'categoria': 'CATEGORIA', 'codigo': 'CODIGO_PRODUTO', 'descricao': 'DESCRICAO_PRODUTO',
          'qtd': '__qtd', 'preco_custo': '__custoMedio', 'margem': '__margem', 'alerta': '__alerta'
        };
        var key = sortMap[field] || '__qtd';
        return items.slice().sort(function (a, b) {
          var va, vb;
          if (key === '__qtd') { va = a.qtd; vb = b.qtd; return order === 'asc' ? va - vb : vb - va; }
          if (key === '__custoMedio') { va = a.custoMedio; vb = b.custoMedio; return order === 'asc' ? va - vb : vb - va; }
          if (key === '__margem') {
            va = parseFloat(a.MARGEM_SHOPEE) || 0; vb = parseFloat(b.MARGEM_SHOPEE) || 0;
            return order === 'asc' ? va - vb : vb - va;
          }
          if (key === '__alerta') {
            va = a.hasAlerta ? 1 : 0; vb = b.hasAlerta ? 1 : 0;
            return order === 'asc' ? va - vb : vb - va;
          }
          va = String(a[key] || '').toLowerCase(); vb = String(b[key] || '').toLowerCase();
          return order === 'asc' ? (va < vb ? -1 : va > vb ? 1 : 0) : (va < vb ? 1 : va > vb ? -1 : 0);
        });
      }

      _renderConsolidated() {
        var groups = this._consolidate();
        var sorted = this._sortConsolidated(groups);
        var tbody = this._el('consolidado-tbody');
        var loadingEl = this._el('loading-state');
        if (loadingEl) loadingEl.style.display = 'none';

        var totalItens = 0;
        for (var i = 0; i < sorted.length; i++) totalItens += sorted[i].qtd;
        this._el('stat-total').textContent = totalItens;
        this._el('stat-disponivel').textContent = this._items.length;
        this._el('stat-vendido').textContent = '—';
        this._el('stat-alertas').textContent = '—';

        if (!sorted.length) {
          tbody.innerHTML = '<tr><td colspan="11" class="empty-state">Nenhum item encontrado.</td></tr>';
          return;
        }

        var html = '';
        for (var i = 0; i < sorted.length; i++) {
          var g = sorted[i];
          var custoFmt = g.custoMedio > 0 ? this._fmtCurrency(g.custoMedio) : '-';
          var precoShopee = g.PRECO_VENDA_SHOPEE != null && g.PRECO_VENDA_SHOPEE !== '' ? this._fmtCurrency(g.PRECO_VENDA_SHOPEE) : '-';
          var precoML = g.PRECO_VENDA_MERCADO_LIVRE != null && g.PRECO_VENDA_MERCADO_LIVRE !== '' ? this._fmtCurrency(g.PRECO_VENDA_MERCADO_LIVRE) : '-';

          var margem = g.MARGEM_SHOPEE;
          var margemClass = '';
          var margemText = '-';
          if (margem !== '' && margem != null) {
            var m = parseFloat(margem);
            margemText = m.toFixed(1) + '%';
            if (m > 30) margemClass = 'margem-positive';
            else if (m >= 10) margemClass = 'margem-warning';
            else margemClass = 'margem-negative';
          }

          var alertIcon = g.hasAlerta ? '<span class="alert-icon" title="Estoque baixo em 1+ unidades deste grupo">\u26A0</span>' : '';

          html += '<tr data-codigo="' + (g.CODIGO_PRODUTO || '') + '" class="estoque-row consolidado-row">';
          html += '<td>' + (g.CATEGORIA || '') + '</td>';
          html += '<td>' + (g.CODIGO_PRODUTO || '') + '</td>';
          html += '<td>' + (g.DESCRICAO_PRODUTO || '') + '</td>';
          html += '<td class="consolidado-th">' + g.qtd + '</td>';
          html += '<td class="consolidado-th">' + custoFmt + '</td>';
          html += '<td class="consolidado-th">' + precoShopee + '</td>';
          html += '<td class="consolidado-th">' + precoML + '</td>';
          html += '<td class="consolidado-th ' + margemClass + '">' + margemText + '</td>';
          html += '<td>' + alertIcon + '</td>';
          var anyBaixado = false;
          for (var bi = 0; bi < g.itens.length; bi++) {
            if (g.itens[bi].BAIXADO === 'S') { anyBaixado = true; break; }
          }
          var baixadoBadge = anyBaixado ? '<span class="badge badge-info">SIM</span>' : '<span class="badge badge-secondary">NÃO</span>';
          html += '<td>' + baixadoBadge + '</td>';
          html += '<td><button class="btn btn-sm btn-primary" data-action="dar-baixa" data-codigo="' + (g.CODIGO_PRODUTO || '') + '" data-qty="' + g.qtd + '" title="Dar baixa manual (FIFO)">Dar Baixa</button></td>';
          html += '</tr>';
        }
        tbody.innerHTML = html;

        var self = this;
        var rows = tbody.querySelectorAll('.consolidado-row');
        for (var r = 0; r < rows.length; r++) {
          (function (row) {
            row.addEventListener('click', function (e) {
              if (e.target.tagName === 'BUTTON') return;
              var codigo = row.getAttribute('data-codigo');
              self._viewMode = 'completo';
              var toggleBtns = self._shadow.querySelectorAll('#view-toggle button');
              for (var j = 0; j < toggleBtns.length; j++) {
                toggleBtns[j].classList.toggle('active', toggleBtns[j].getAttribute('data-view') === 'completo');
              }
              self._el('filter-codigo').value = codigo;
              self._applyFilters();
            });
          })(rows[r]);
        }

        var baixaBtns = tbody.querySelectorAll('[data-action="dar-baixa"]');
        for (var bb = 0; bb < baixaBtns.length; bb++) {
          (function (btn) {
            btn.addEventListener('click', function (e) {
              e.stopPropagation();
              self._darBaixa(btn.getAttribute('data-codigo'));
            });
          })(baixaBtns[bb]);
        }
      }

      _renderCompleto() {
        var items = this._sortItems(this._filtered);
        var tbody = this._el('estoque-tbody');
        var loadingEl = this._el('loading-state');
        if (loadingEl) loadingEl.style.display = 'none';

        this._updateStats(items);

        if (!items.length) {
          tbody.innerHTML = '<tr><td colspan="11" class="empty-state">Nenhum item encontrado.</td></tr>';
          return;
        }

        var html = '';
        for (var i = 0; i < items.length; i++) {
          var it = items[i];
          var id = it.ESTOQUE_ID || '';
          var isOpen = this._openRows[id];
          var isSaving = this._saving[id];
          var badgeClass = STATUS_BADGE[it.STATUS] || 'badge-info';

          var margem = it.MARGEM_SHOPEE;
          var margemClass = '';
          var margemText = '-';
          if (margem !== '' && margem != null && margem !== undefined) {
            var m = parseFloat(margem);
            margemText = m.toFixed(1) + '%';
            if (m > 30) margemClass = 'margem-positive';
            else if (m >= 10) margemClass = 'margem-warning';
            else margemClass = 'margem-negative';
          }

          var alertReasons = [];
          if (it.ALERTA_ESTOQUE_BAIXO === true || it.ALERTA_ESTOQUE_BAIXO === 'true') {
            alertReasons.push('Estoque baixo — última unidade disponível deste produto');
          }
          var alertIcon = alertReasons.length > 0
            ? '<span class="alert-icon" title="' + alertReasons.join('\n') + '">\u26A0</span>' : '';
          var custo = it.PRECO_CUSTO_ORIGINAL != null ? this._fmtCurrency(it.PRECO_CUSTO_ORIGINAL) : '-';
          var precoShopeeVal = it.PRECO_VENDA_SHOPEE != null && it.PRECO_VENDA_SHOPEE !== '' ? it.PRECO_VENDA_SHOPEE : '';
          var precoMLVal = it.PRECO_VENDA_MERCADO_LIVRE != null && it.PRECO_VENDA_MERCADO_LIVRE !== '' ? it.PRECO_VENDA_MERCADO_LIVRE : '';
          var dataEntrada = it.DATA_ENTRADA ? this._fmtDate(it.DATA_ENTRADA) : '-';

          var statusOptionsHtml = '';
          for (var s = 0; s < STATUS_OPTIONS.length; s++) {
            var opt = STATUS_OPTIONS[s];
            var selected = opt.value === it.STATUS ? ' selected' : '';
            statusOptionsHtml += '<option value="' + opt.value + '"' + selected + '>' + opt.label + '</option>';
          }

          html += '<tr data-id="' + id + '" class="estoque-row' + (isOpen ? ' row-open' : '') + (isSaving ? ' row-edited' : '') + '">';
          html += '<td>' + id + '</td>';
          html += '<td>' + (it.CATEGORIA || '') + '</td>';
          html += '<td>' + (it.CODIGO_PRODUTO || '') + '</td>';
          html += '<td>' + (it.DESCRICAO_PRODUTO || '') + '</td>';
          html += '<td>' + dataEntrada + '</td>';
          html += '<td>' + custo + '</td>';

          html += '<td><div class="price-group">';
          html += '<input type="text" class="inline-input" data-field="precoVendaShopee" data-id="' + id + '" value="' + precoShopeeVal + '" placeholder="-" />';
          html += '<button class="catalog-btn" data-action="fill-catalog" data-id="' + id + '" data-codigo="' + (it.CODIGO_PRODUTO || '') + '" title="Preencher com preco do catalogo">&#128269;</button>';
          html += '</div></td>';

          html += '<td><div class="price-group">';
          html += '<input type="text" class="inline-input" data-field="precoVendaMercadoLivre" data-id="' + id + '" value="' + precoMLVal + '" placeholder="-" />';
          html += '</div></td>';

          html += '<td class="' + margemClass + '">' + margemText + '</td>';

          html += '<td><select class="inline-select" data-field="status" data-id="' + id + '">' + statusOptionsHtml + '</select></td>';
          var baixadoBadge = it.BAIXADO === 'S' ? '<span class="badge badge-info">SIM</span>' : '<span class="badge badge-secondary">NÃO</span>';
          html += '<td>' + baixadoBadge + '</td>';
          html += '<td>' + alertIcon + '</td>';
          html += '</tr>';

          html += '<tr class="detail-row' + (isOpen ? ' open' : '') + '" data-detail="' + id + '">';
          html += '<td class="detail-cell" colspan="11">';
          html += '<strong>Referencia origem:</strong> ' + (it.REFERENCIA_ORIGEM || '-') + ' &nbsp;|&nbsp; ';
          html += '<strong>Sincronizado:</strong> ' + (it.DATA_SINCRONIZACAO ? this._fmtDate(it.DATA_SINCRONIZACAO) : '-') + ' &nbsp;|&nbsp; ';
          html += '<strong>Log ID:</strong> ' + (it.LOG_ID || '-');
          html += '</td></tr>';
        }
        tbody.innerHTML = html;

        var self = this;

        var rows = tbody.querySelectorAll('.estoque-row');
        for (var r = 0; r < rows.length; r++) {
          (function (row) {
            row.addEventListener('click', function (e) {
              if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON') return;
              var itemId = row.getAttribute('data-id');
              self._openRows[itemId] = !self._openRows[itemId];
              var detail = tbody.querySelector('[data-detail="' + itemId + '"]');
              if (detail) {
                detail.classList.toggle('open', self._openRows[itemId]);
              }
              row.classList.toggle('row-open', self._openRows[itemId]);
            });
          })(rows[r]);
        }

        var priceInputs = tbody.querySelectorAll('.inline-input[data-field]');
        for (var p = 0; p < priceInputs.length; p++) {
          (function (input) {
            input.addEventListener('focus', function () {
              input.select();
            });
            input.addEventListener('blur', function () {
              self._onPriceBlur(input);
            });
            input.addEventListener('keydown', function (e) {
              if (e.key === 'Enter') {
                input.blur();
              } else if (e.key === 'Escape') {
                var id = input.getAttribute('data-id');
                var item = self._findItem(id);
                if (item) {
                  var field = input.getAttribute('data-field');
                  input.value = item[field] || '';
                }
                input.blur();
              }
            });
          })(priceInputs[p]);
        }

        var statusSelects = tbody.querySelectorAll('.inline-select[data-field="status"]');
        for (var ss = 0; ss < statusSelects.length; ss++) {
          (function (select) {
            select.addEventListener('change', function () {
              self._onStatusChange(select);
            });
          })(statusSelects[ss]);
        }

        var catalogBtns = tbody.querySelectorAll('[data-action="fill-catalog"]');
        for (var cb = 0; cb < catalogBtns.length; cb++) {
          (function (btn) {
            btn.addEventListener('click', function (e) {
              e.stopPropagation();
              self._fillFromCatalog(btn.getAttribute('data-id'), btn.getAttribute('data-codigo'));
            });
          })(catalogBtns[cb]);
        }
      }

      _findItem(estoqueId) {
        for (var i = 0; i < this._items.length; i++) {
          if (this._items[i].ESTOQUE_ID === estoqueId) return this._items[i];
        }
        return null;
      }

      _onPriceBlur(input) {
        var estoqueId = input.getAttribute('data-id');
        var field = input.getAttribute('data-field');
        var rawVal = input.value.replace(/[^\d.,-]/g, '').replace(',', '.');
        var newVal = rawVal !== '' ? parseFloat(rawVal) : null;

        var item = this._findItem(estoqueId);
        if (!item) return;

        var currentVal = item[field];
        if (currentVal !== '' && currentVal != null) {
          currentVal = parseFloat(currentVal) || null;
        } else {
          currentVal = null;
        }

        if (newVal === currentVal) return;

        var self = this;
        input.classList.add('saving');
        this._saving[estoqueId] = true;

        var params = { estoqueId: estoqueId };
        params[field] = newVal;

        google.script.run
          .withSuccessHandler(function (resp) {
            input.classList.remove('saving');
            delete self._saving[estoqueId];
            var data = self._unwrap(resp);
            if (data && data.success) {
              item[field] = newVal;
              if (data.updated > 1) {
                showSuccess(self._shadow, 'Preco atualizado em ' + data.updated + ' itens do mesmo produto.');
              }
              self._invalidateCache();
              self._load();
            } else {
              showError(self._shadow, 'Erro: ' + (data ? data.error : 'desconhecido'));
              self._invalidateCache();
              self._load();
            }
          })
          .withFailureHandler(function (err) {
            input.classList.remove('saving');
            delete self._saving[estoqueId];
            showError(self._shadow, 'Erro ao salvar: ' + (err.message || err));
            self._invalidateCache();
            self._load();
          })
          .apiDispatch('estoque.updateItem', params);
      }

      _onStatusChange(select) {
        var estoqueId = select.getAttribute('data-id');
        var novoStatus = select.value;
        var self = this;

        this._saving[estoqueId] = true;
        select.disabled = true;

        google.script.run
          .withSuccessHandler(function (resp) {
            select.disabled = false;
            delete self._saving[estoqueId];
            var data = self._unwrap(resp);
            if (data && data.success) {
              showSuccess(self._shadow, 'Status alterado para ' + novoStatus + '.');
              self._invalidateCache();
              self._load();
            } else {
              showError(self._shadow, 'Erro: ' + (data ? data.error : 'desconhecido'));
              self._invalidateCache();
              self._load();
            }
          })
          .withFailureHandler(function (err) {
            select.disabled = false;
            delete self._saving[estoqueId];
            showError(self._shadow, 'Erro ao alterar status: ' + (err.message || err));
            self._invalidateCache();
            self._load();
          })
          .apiDispatch('estoque.updateItem', { estoqueId: estoqueId, status: novoStatus });
      }

      _fillFromCatalog(estoqueId, codigoProduto) {
        if (!codigoProduto) return;
        var self = this;

        this._saving[estoqueId] = true;

        google.script.run
          .withSuccessHandler(function (resp) {
            var data = self._unwrap(resp);
            if (!data || data.error) {
              showError(self._shadow, 'Erro: ' + (data ? data.error : 'catalogo vazio'));
              delete self._saving[estoqueId];
              return;
            }

            var params = { estoqueId: estoqueId };
            var hasUpdate = false;
            if (data.precoShopee) {
              params.precoVendaShopee = data.precoShopee;
              hasUpdate = true;
            }
            if (data.precoMercadoLivre) {
              params.precoVendaMercadoLivre = data.precoMercadoLivre;
              hasUpdate = true;
            }

            if (!hasUpdate) {
              showError(self._shadow, 'Catalogo sem precos para este produto.');
              delete self._saving[estoqueId];
              return;
            }

            google.script.run
              .withSuccessHandler(function (resp2) {
                delete self._saving[estoqueId];
                var data2 = self._unwrap(resp2);
                if (data2 && data2.success) {
                  showSuccess(self._shadow, 'Precos preenchidos do catalogo. ' + (data2.updated > 1 ? data2.updated + ' itens atualizados.' : ''));
                  self._invalidateCache();
                  self._load();
                } else {
                  showError(self._shadow, 'Erro ao salvar: ' + (data2 ? data2.error : 'desconhecido'));
                  self._invalidateCache();
                  self._load();
                }
              })
              .withFailureHandler(function (err) {
                delete self._saving[estoqueId];
                showError(self._shadow, 'Erro ao salvar precos: ' + (err.message || err));
                self._invalidateCache();
                self._load();
              })
              .apiDispatch('estoque.updateItem', params);
          })
          .withFailureHandler(function (err) {
            delete self._saving[estoqueId];
            showError(self._shadow, 'Erro ao buscar catalogo: ' + (err.message || err));
          })
          .apiDispatch('estoque.getPrecosCatalogo', { codigoProduto: codigoProduto });
      }

      _reprocessar() {
        var self = this;
        var btn = this._el('btn-reprocess');
        var originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Reprocessando...';

        google.script.run
          .withSuccessHandler(function (resp) {
            btn.disabled = false;
            btn.textContent = originalText;
            var data = self._unwrap(resp);
            if (data && data.error) {
              showError(self._shadow, data.error);
            } else if (data) {
              var msg = 'Reprocessados: ' + (data.baixados || 0) + ' baixados, ' + (data.aindaPendentes || 0) + ' ainda pendentes.';
              showSuccess(self._shadow, msg);
              self._invalidateCache();
              self._load();
            }
          })
          .withFailureHandler(function (err) {
            btn.disabled = false;
            btn.textContent = originalText;
            showError(self._shadow, 'Erro ao reprocessar: ' + (err.message || err));
          })
          .apiDispatch('estoqueBaixa.reprocessarPendentes', {});
      }

      _darBaixa(codigoProduto) {
        if (!codigoProduto) return;
        var overlay = this._el('baixa-overlay');
        this._baixaCodigo = codigoProduto;
        this._el('baixa-produto').textContent = codigoProduto;
        this._el('baixa-qty').value = 1;
        this._el('baixa-status').textContent = '';
        overlay.classList.add('open');
      }

      _confirmarBaixa() {
        var self = this;
        var codigoProduto = this._baixaCodigo;
        var qty = parseInt(this._el('baixa-qty').value, 10) || 1;
        var statusEl = this._el('baixa-status');
        var confirmBtn = this._el('btn-baixa-confirm');
        var cancelBtn = this._el('btn-baixa-cancel');

        if (!codigoProduto) return;
        confirmBtn.disabled = true;
        cancelBtn.disabled = true;
        statusEl.textContent = 'Processando baixa...';

        var idempKey = 'MANUAL_' + codigoProduto + '_' + Date.now();
        var refOrigem = 'MANUAL#' + codigoProduto + '#' + Date.now();

        google.script.run
          .withSuccessHandler(function (resp) {
            confirmBtn.disabled = false;
            cancelBtn.disabled = false;
            var data = self._unwrap(resp);
            if (data && data.success) {
              var msg = 'Baixado(s): ' + (data.baixados || 0) + ' un.';
              if (data.faltantes > 0) msg += ' (' + data.faltantes + ' faltante(s))';
              statusEl.textContent = msg;
              showSuccess(self._shadow, msg);
              setTimeout(function () {
                self._el('baixa-overlay').classList.remove('open');
                self._invalidateCache();
                self._load();
              }, 1000);
            } else {
              statusEl.textContent = 'Erro: ' + (data ? data.error : 'desconhecido');
              showError(self._shadow, 'Erro: ' + (data ? data.error : 'desconhecido'));
            }
          })
          .withFailureHandler(function (err) {
            confirmBtn.disabled = false;
            cancelBtn.disabled = false;
            statusEl.textContent = 'Erro: ' + (err.message || err);
            showError(self._shadow, 'Erro ao baixar: ' + (err.message || err));
          })
          .apiDispatch('estoqueBaixa.baixarPorProduto', {
            codigoProduto: codigoProduto,
            quantidade: qty,
            origem: 'SAIDA_MANUAL',
            referenciaOrigem: refOrigem,
            idempotencyKey: idempKey
          });
      }

      _updateStats(items) {
        var total = this._items.length;
        var disponivel = 0;
        var vendido = 0;
        var alertas = 0;
        for (var i = 0; i < this._items.length; i++) {
          var st = (this._items[i].STATUS || '').toUpperCase();
          var stNorm = st.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
          if (stNorm === 'DISPONIVEL') disponivel++;
          else if (stNorm === 'VENDIDO') vendido++;
          if (this._items[i].ALERTA_ESTOQUE_BAIXO === true || this._items[i].ALERTA_ESTOQUE_BAIXO === 'true') {
            alertas++;
          }
        }
        this._el('stat-total').textContent = total;
        this._el('stat-disponivel').textContent = disponivel;
        this._el('stat-vendido').textContent = vendido;
        this._el('stat-alertas').textContent = alertas;
      }

      _fmtCurrency(value) {
        if (value == null || isNaN(value)) return '-';
        try {
          return FormatterService.formatCurrency(value);
        } catch (e) {
          return 'R$ ' + parseFloat(value).toFixed(2);
        }
      }

      _fmtDate(value) {
        if (!value) return '-';
        try {
          return FormatterService.formatDate(value);
        } catch (e) {
          return String(value);
        }
      }
    }

    customElements.define('estoque-widget', EstoqueWidget);
  })();
</script>
