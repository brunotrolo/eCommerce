<template id="anuncios-shopee-template">
  <style>
    th[data-sort] {
      cursor: pointer;
      user-select: none;
      position: relative;
      padding-right: 24px !important;
    }
    th[data-sort]:hover { background: var(--color-bg-secondary, #f7f8fa); }
    th[data-sort]::after {
      content: '';
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid var(--color-text-tertiary, #b0b7c3);
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    th[data-sort].sort-asc::after,
    th[data-sort].sort-desc::after { opacity: 1; }
    th[data-sort].sort-desc::after {
      border-top: none;
      border-bottom: 5px solid var(--color-text-tertiary, #b0b7c3);
    }
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      margin-top: var(--space-md);
      font-size: var(--font-size-sm);
      color: var(--color-text-secondary);
    }
    .pagination button {
      padding: var(--space-xs) var(--space-sm);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      cursor: pointer;
      font-size: var(--font-size-sm);
    }
    .pagination button:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .pagination button:not(:disabled):hover {
      background: var(--color-bg-secondary, #f7f8fa);
    }
  </style>
  <div class="widget-grid">
    <div class="card">
      <h1>Anúncios Shopee</h1>
      <p class="page-subtitle">Inventário, preço, estoque e vendas da loja Shopee.</p>

      <div class="page-actions">
        <button class="btn" id="btn-sync">Sincronizar Anúncios</button>
        <span class="badge badge-info" id="cache-badge" hidden></span>
      </div>

      <div class="filter-bar">
        <input type="text" id="filter-id" placeholder="ID..." />
        <input type="text" id="filter-sku" placeholder="SKU..." />
        <input type="text" id="filter-nome" placeholder="Nome..." />
        <select id="filter-status">
          <option value="all">Status: Todos</option>
          <option value="ativo">Ativo</option>
          <option value="pausado">Pausado</option>
          <option value="deletado">Deletado</option>
        </select>
      </div>

      <div class="page-summary" id="stat-grid"></div>

      <div class="alert alert-error" id="error-box" hidden></div>
      <div id="result-box" hidden></div>
    </div>
    <div class="card table-container">
      <h3>Inventário de anúncios</h3>
      <table class="table" id="items-table">
        <thead>
          <tr>
            <th data-sort="ITEM_ID">ID</th>
            <th data-sort="SKU">SKU</th>
            <th data-sort="NOME">Nome</th>
            <th data-sort="PRECO">Preço</th>
            <th data-sort="ESTOQUE">Estoque</th>
            <th data-sort="STATUS">Status</th>
            <th data-sort="VENDAS_30D">Vendas 30d</th>
            <th data-sort="AVALIACAO">Avaliação</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</template>
<script>
  (function () {
    if (customElements.get('anuncios-shopee-widget')) return;

    var PAGE_SIZE = 50;
    var _sortState = { field: null, asc: true };
    var _currentPage = 0;
    var _allRows = [];
    var _listenersAttached = false;
    var _filter = { id: '', sku: '', nome: '', status: 'all' };

    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function fmtBRL(v) {
      if (v === '' || v == null || isNaN(v)) return '-';
      return typeof FormatterService !== 'undefined'
        ? FormatterService.formatCurrency(v)
        : 'R$ ' + Number(v).toFixed(2);
    }

    function statusLabel(s) {
      return { ativo: 'Ativo', pausado: 'Pausado', deletado: 'Deletado' }[s] || s || '-';
    }

    function statsHtml(r) {
      return '<div class="stat"><div class="stat-value">' + (r.totalAtivos || 0) + '</div><div class="stat-label">Anúncios ativos</div></div>' +
        '<div class="stat"><div class="stat-value">' + (r.totalPausados || 0) + '</div><div class="stat-label">Pausados</div></div>' +
        '<div class="stat"><div class="stat-value">' + (r.estoqueTotal || 0) + '</div><div class="stat-label">Estoque total</div></div>' +
        '<div class="stat"><div class="stat-value">' + (r.vendasPeriodo || 0) + '</div><div class="stat-label">Vendas 30d</div></div>' +
        '<div class="stat stat-sep"><div class="stat-value">' + (r.avaliacaoMedia || '-') + '</div><div class="stat-label">Avaliação média</div></div>';
    }

    function sortRows(rows) {
      if (!_sortState.field) return rows;
      var f = _sortState.field;
      var sorted = rows.slice();
      sorted.sort(function (a, b) {
        var va = a[f], vb = b[f];
        if (va == null) return 1;
        if (vb == null) return -1;
        if (typeof va === 'string') { va = va.toLowerCase(); vb = (vb || '').toLowerCase(); }
        return va < vb ? -1 : va > vb ? 1 : 0;
      });
      return _sortState.asc ? sorted : sorted.reverse();
    }

    function filterRows() {
      var id = (_filter.id || '').toLowerCase().trim();
      var sku = (_filter.sku || '').toLowerCase().trim();
      var nome = (_filter.nome || '').toLowerCase().trim();
      return _allRows.filter(function (r) {
        if (_filter.status !== 'all' && String(r.STATUS || 'ativo') !== _filter.status) return false;
        if (id && String(r.ITEM_ID || '').toLowerCase().indexOf(id) === -1) return false;
        if (sku && String(r.SKU || '').toLowerCase().indexOf(sku) === -1) return false;
        if (nome && String(r.NOME || '').toLowerCase().indexOf(nome) === -1) return false;
        return true;
      });
    }

    function updateArrows(tableEl) {
      var ths = tableEl.querySelectorAll('th[data-sort]');
      for (var i = 0; i < ths.length; i++) {
        var th = ths[i];
        var f = th.getAttribute('data-sort');
        th.classList.remove('sort-asc', 'sort-desc');
        var arrow = th.querySelector('.sort-arrow');
        if (!arrow) { arrow = document.createElement('span'); arrow.className = 'sort-arrow'; th.appendChild(arrow); }
        arrow.classList.remove('sort-asc', 'sort-desc');
        if (_sortState.field === f) arrow.classList.add(_sortState.asc ? 'sort-asc' : 'sort-desc');
      }
    }

    function buildRow(r) {
      var status = r.STATUS || 'ativo';
      var acoes = '';
      if (status === 'ativo') acoes += '<button class="btn btn-secondary" data-act="pause" data-id="' + esc(r.ITEM_ID) + '">Pausar</button> ';
      else if (status === 'pausado') acoes += '<button class="btn btn-secondary" data-act="activate" data-id="' + esc(r.ITEM_ID) + '">Ativar</button> ';
      acoes += '<button class="btn btn--ghost" data-act="price" data-id="' + esc(r.ITEM_ID) + '" data-nome="' + esc(r.NOME) + '" data-valor="' + r.PRECO + '">Preço</button> ' +
        '<button class="btn btn--ghost" data-act="stock" data-id="' + esc(r.ITEM_ID) + '" data-nome="' + esc(r.NOME) + '" data-valor="' + r.ESTOQUE + '">Estoque</button> ';
      if (status !== 'deletado') acoes += '<button class="btn btn-secondary" data-act="delete" data-id="' + esc(r.ITEM_ID) + '">Deletar</button>';
      return '<tr><td>' + esc(r.ITEM_ID) + '</td><td>' + (r.SKU === '' || r.SKU == null ? '-' : esc(r.SKU)) + '</td><td>' + esc(r.NOME) + '</td><td>' + fmtBRL(r.PRECO) + '</td><td>' +
        (r.ESTOQUE === '' ? '-' : r.ESTOQUE) + '</td><td>' + statusLabel(status) + '</td><td>' +
        (r.VENDAS_30D === '' ? '-' : r.VENDAS_30D) + '</td><td>' + (r.AVALIACAO || '-') + '</td><td>' + acoes + '</td></tr>';
    }

function renderPage(shadow) {
      var tbody = shadow.querySelector('#items-table tbody');
      var sorted = sortRows(filterRows());
      var totalPages = Math.max(1, Math.ceil(sorted.length / PAGE_SIZE));
      if (_currentPage >= totalPages) _currentPage = totalPages - 1;
      if (_currentPage < 0) _currentPage = 0;
      var start = _currentPage * PAGE_SIZE;
      var page = sorted.slice(start, start + PAGE_SIZE);

      var html = '';
      for (var i = 0; i < page.length; i++) html += buildRow(page[i]);
      tbody.innerHTML = html || '<tr><td colspan="9">Nenhum anúncio ainda. Clique em "Sincronizar Anúncios".</td></tr>';

      var pag = shadow.getElementById('pagination');
      if (sorted.length <= PAGE_SIZE) { pag.innerHTML = ''; return; }
      pag.innerHTML = '<button id="pag-prev" ' + (_currentPage === 0 ? 'disabled' : '') + '>&laquo; Anterior</button>' +
        '<span>Página ' + (_currentPage + 1) + ' de ' + totalPages + ' (' + sorted.length + ' itens)</span>' +
        '<button id="pag-next" ' + (_currentPage >= totalPages - 1 ? 'disabled' : '') + '>Próxima &raquo;</button>';
      var prevBtn = pag.querySelector('#pag-prev');
      var nextBtn = pag.querySelector('#pag-next');
      if (prevBtn) prevBtn.addEventListener('click', function () { _currentPage--; renderPage(shadow); });
      if (nextBtn) nextBtn.addEventListener('click', function () { _currentPage++; renderPage(shadow); });
    }

    function renderAll(shadow, data) {
      _allRows = data.lista || [];
      _currentPage = 0;
      _filter = { id: '', sku: '', nome: '', status: 'all' };
      ['filter-id', 'filter-sku', 'filter-nome'].forEach(function (id) {
        var el = shadow.getElementById(id);
        if (el) el.value = '';
      });
      var statusEl = shadow.getElementById('filter-status');
      if (statusEl) statusEl.value = 'all';
      shadow.getElementById('stat-grid').innerHTML = statsHtml(data.resumo || {});
      updateArrows(shadow.querySelector('#items-table'));
      renderPage(shadow);
    }

    function attachListeners(shadow) {
      if (_listenersAttached) return;
      _listenersAttached = true;

      var filterId = shadow.getElementById('filter-id');
      var filterSku = shadow.getElementById('filter-sku');
      var filterNome = shadow.getElementById('filter-nome');
      var filterStatus = shadow.getElementById('filter-status');
      function onTextInput(field) {
        return function () {
          _filter[field] = this.value;
          _currentPage = 0;
          renderPage(shadow);
        };
      }
      if (filterId) filterId.addEventListener('input', onTextInput('id'));
      if (filterSku) filterSku.addEventListener('input', onTextInput('sku'));
      if (filterNome) filterNome.addEventListener('input', onTextInput('nome'));
      if (filterStatus) {
        filterStatus.addEventListener('change', function () {
          _filter.status = filterStatus.value || 'all';
          _currentPage = 0;
          renderPage(shadow);
        });
      }

      shadow.querySelector('#items-table thead').addEventListener('click', function (e) {
        var th = e.target.closest('th[data-sort]');
        if (!th) return;
        var field = th.getAttribute('data-sort');
        if (_sortState.field === field) _sortState.asc = !_sortState.asc;
        else { _sortState.field = field; _sortState.asc = true; }
        updateArrows(shadow.querySelector('#items-table'));
        renderPage(shadow);
      });

      shadow.querySelector('#items-table tbody').addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-act]');
        if (!btn) return;
        var widget = document.querySelector('anuncios-shopee-widget');
        if (!widget) return;
        var itemId = btn.getAttribute('data-id');
        var act = btn.getAttribute('data-act');
        if (act === 'price') widget._updatePrice(widget.shadowRoot, itemId, btn.getAttribute('data-nome'), btn.getAttribute('data-valor'));
        else if (act === 'stock') widget._updateStock(widget.shadowRoot, itemId, btn.getAttribute('data-nome'), btn.getAttribute('data-valor'));
        else if (act === 'pause' || act === 'activate') widget._setStatus(widget.shadowRoot, itemId, act);
        else if (act === 'delete') widget._deleteItem(widget.shadowRoot, itemId);
      });
    }

    function showCacheBadge(shadow, data) {
      var badge = shadow.getElementById('cache-badge');
      if (!badge || !data || !data.atualizadoEm) return;
      badge.hidden = false;
      badge.textContent = 'Usando dados em cache (atualizado em ' + data.atualizadoEm + ')';
    }

    function showError(shadow, msg) {
      var el = shadow.getElementById('error-box');
      el.textContent = msg;
      el.hidden = false;
    }

    class AnunciosShopeeWidget extends HTMLElement {
      connectedCallback() {
        var template = document.getElementById('anuncios-shopee-template');
        var shadow = this.attachShadow({ mode: 'open' });
        shadow.adoptedStyleSheets = [window.__DESIGN_SHEET__];
        shadow.appendChild(template.content.cloneNode(true));
        attachListeners(shadow);

        var self = this;
        shadow.getElementById('btn-sync').addEventListener('click', function () { self._sync(shadow); });

        var cached = window.__DataStore && window.__DataStore.get('anunciosShopee.listings');
        if (cached) { renderAll(shadow, cached); showCacheBadge(shadow, cached); }
        this._load(shadow);
      }

      _load(shadow) {
        var self = this;
        var ds = window.__DataStore;
        if (!ds) { this._fetch(shadow, false); return; }
        ds.getOrFetch('anunciosShopee.listings', 'anunciosShopee.getListings', {})
          .then(function (data) {
            if (data && data.error) { window.__DataStore && window.__DataStore.invalidate('anunciosShopee.listings'); showError(shadow, String(data.error)); return; }
            if (!data || !data.lista) return;
            renderAll(shadow, data);
            if (data.fromCache) showCacheBadge(shadow, data);
          })
          .catch(function (err) {
            window.__DataStore && window.__DataStore.invalidate('anunciosShopee.listings');
            showError(shadow, (err && err.message) || 'Erro ao carregar os anúncios.');
          });
      }

      _fetch(shadow, force) {
        google.script.run
          .withSuccessHandler(function (data) {
            if (!data || !data.lista) return;
            renderAll(shadow, data);
            if (window.__DataStore && force) window.__DataStore.set('anunciosShopee.listings', data);
          })
          .withFailureHandler(function (err) { showError(shadow, (err && err.message) || 'Erro ao carregar os anúncios.'); })
          .apiDispatch('anunciosShopee.getListings', { fromCache: !force });
      }

      _sync(shadow) {
        var self = this;
        if (window.__DataStore) window.__DataStore.invalidate('anunciosShopee.listings');
        withLoading(
          shadow.getElementById('btn-sync'),
          (success, failure) => google.script.run.withSuccessHandler(success).withFailureHandler(failure).apiDispatch('anunciosShopee.syncListings', { forceFresh: true }),
          function (data) { if (data && data.success) self._load(shadow); if (data && data.resumo) shadow.getElementById('stat-grid').innerHTML = statsHtml(data.resumo); },
          function (data) { return data && data.synced ? 'Sincronizados ' + data.synced.itemsAtualizados + ' anúncios • Estoque total: ' + (data.resumo ? data.resumo.estoqueTotal : 0) : 'Sincronizados'; }
        );
      }

      _updatePrice(shadow, itemId, nome, precoAtual) {
        var novo = prompt('Novo preço para "' + nome + '" (atual: ' + precoAtual + '):', precoAtual);
        if (novo === null || novo === '') return;
        novo = String(novo).replace(',', '.');
        var valor = parseFloat(novo);
        if (isNaN(valor) || valor <= 0) { showError(shadow, 'Preço inválido.'); return; }
        this._runAction(shadow, 'anunciosShopee.updatePrice', { itemIds: [itemId], priceList: [{ itemId: itemId, preco: valor }] },
          function (data) { if (data && data.falhas && data.falhas.length > 0) showError(shadow, data.falhas[0].motivo || 'Falha ao confirmar mudança.'); },
          'Preço atualizado para R$ ' + valor.toFixed(2).replace('.', ','));
      }

      _updateStock(shadow, itemId, nome, estoqueAtual) {
        var novo = prompt('Novo estoque para "' + nome + '" (atual: ' + estoqueAtual + '):', estoqueAtual);
        if (novo === null || novo === '') return;
        var valor = parseInt(novo, 10);
        if (isNaN(valor) || valor < 0) { showError(shadow, 'Estoque inválido.'); return; }
        this._runAction(shadow, 'anunciosShopee.updateStock', { itemIds: [itemId], stockList: [{ itemId: itemId, quantidade: valor }] },
          function (data) { if (data && data.falhas && data.falhas.length > 0) showError(shadow, data.falhas[0].motivo || 'Falha ao confirmar mudança.'); },
          'Estoque atualizado para ' + valor);
      }

      _runAction(shadow, action, params, onSuccess, successMessage) {
        var self = this;
        withLoading(
          shadow.getElementById('btn-sync'),
          (success, failure) => google.script.run.withSuccessHandler(success).withFailureHandler(failure).apiDispatch(action, params),
          function (data) { if (onSuccess) onSuccess(data); self._load(shadow); },
          successMessage
        );
      }

      _setStatus(shadow, itemId, act) {
        this._runAction(shadow, act === 'pause' ? 'anunciosShopee.pauseItem' : 'anunciosShopee.activateItem', { itemId: itemId }, null, act === 'pause' ? 'Anúncio pausado.' : 'Anúncio ativado.');
      }

      _deleteItem(shadow, itemId) {
        if (!confirm('Deletar anúncio ' + itemId + ' na Shopee? Esta ação é IRREVERSÍVEL.')) return;
        this._runAction(shadow, 'anunciosShopee.deleteItem', { itemId: itemId }, null, 'Anúncio deletado.');
      }
    }

    customElements.define('anuncios-shopee-widget', AnunciosShopeeWidget);
  })();
</script>
