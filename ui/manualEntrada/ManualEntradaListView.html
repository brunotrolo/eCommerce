<template id="manual-entrada-list-template">
  <style>
    :host { display: block; }

    .table-wrapper {
      overflow-x: auto; border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
    }

    table {
      width: 100%; border-collapse: collapse;
      font-size: var(--font-size-sm); color: var(--color-text);
    }

    th {
      text-align: left; padding: var(--space-sm) var(--space-md);
      background: var(--color-surface-alt); font-weight: var(--font-weight-semibold);
      border-bottom: 1px solid var(--color-border);
      white-space: nowrap; cursor: pointer; user-select: none;
    }
    th:hover { background: var(--color-surface-hover); }
    th .sort-icon { margin-left: var(--space-xs); color: var(--color-text-tertiary); }

    td {
      padding: var(--space-sm) var(--space-md);
      border-bottom: 1px solid var(--color-border-light);
      white-space: nowrap;
    }

    tr:hover td { background: var(--color-surface-hover); }

    .badge {
      display: inline-block; padding: 2px var(--space-sm);
      border-radius: var(--radius-xs); font-size: var(--font-size-xs);
      font-weight: var(--font-weight-medium);
    }
    .badge-success {
      background: var(--color-success-light); color: var(--color-success-text);
    }
  </style>

  <div class="widget-grid">
    <div class="card">
      <h1>Entrada Manual de Produtos</h1>
      <p class="page-subtitle">Entradas registradas manualmente fora do fluxo de NFe.</p>

      <div class="page-actions">
        <button class="btn" id="btn-add">+ Inserir Novo Item</button>
      </div>

      <div class="filter-bar">
        <input type="text" id="filter-codigo" placeholder="Código..." />
        <input type="text" id="filter-categoria" placeholder="Categoria..." />
        <input type="text" id="filter-descricao" placeholder="Descrição..." />
        <input type="text" id="filter-fornecedor" placeholder="Fornecedor..." />
        <input type="text" id="filter-ncm" placeholder="NCM..." />
        <select id="filter-status">
          <option value="">Status: todos</option>
          <option value="Recebido">Recebido</option>
          <option value="Desconsiderar">Desconsiderar</option>
        </select>

      </div>

      <div class="page-summary" id="stats">
        <div class="stat"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total</div></div>
        <div class="stat"><div class="stat-value" id="stat-disponivel">0</div><div class="stat-label">Disponivel</div></div>
        <div class="stat"><div class="stat-value" id="stat-vendido">0</div><div class="stat-label">Vendido</div></div>
        <div class="stat"><div class="stat-value" id="stat-alertas">0</div><div class="stat-label">Alertas</div></div>
        <div class="stat stat-sep"><div class="stat-value" id="stat-custo">R$ 0,00</div><div class="stat-label">Custo Total</div></div>
        <div class="stat"><div class="stat-value" id="stat-preco-shopee">R$ 0,00</div><div class="stat-label">Preco Shopee</div></div>
        <div class="stat"><div class="stat-value" id="stat-preco-ml">R$ 0,00</div><div class="stat-label">Preco ML</div></div>
      </div>

      <div id="content">
        <div class="loading-state">Carregando...</div>
      </div>

      <div class="alert alert-error" id="error-box" hidden></div>
      <div id="result-box" hidden></div>
    </div>
  </div>

  <manual-entrada-widget id="modal-widget"></manual-entrada-widget>
</template>

<script>
(function () {
  if (document.getElementById('manual-entrada-list-widget')) return;

  var template = document.getElementById('manual-entrada-list-template');
  if (!template) return;

  var TAG = 'manual-entrada-list-widget';

  customElements.define(TAG, class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
      this.shadowRoot.appendChild(template.content.cloneNode(true));
      if (window.__DESIGN_SHEET__) {
        this.shadowRoot.adoptedStyleSheets = [window.__DESIGN_SHEET__];
      }
      this._entries = [];
      this._filtered = [];
      this._sortField = 'dataCompra';
      this._sortOrder = 'desc';
    }

    connectedCallback() {
      this._loadData();
      this._bindEvents();
    }

    _bindEvents() {
      var self = this;

      this.shadowRoot.getElementById('btn-add').addEventListener('click', function () {
        var modal = self.shadowRoot.getElementById('modal-widget');
        if (modal) {
          modal.setOnSaveCallback(function () {
            var ds = window.__DataClient;
            if (ds) ds.invalidate('manualEntrada.listEntries');
            self._loadData();
          });
          modal.open();
        }
      });

      var filterIds = ['filter-codigo', 'filter-categoria', 'filter-descricao', 'filter-fornecedor', 'filter-ncm', 'filter-status'];
      for (var f = 0; f < filterIds.length; f++) {
        (function (id) {
          var el = self.shadowRoot.getElementById(id);
          if (!el) return;
          el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', function () {
            self._applyFilters();
          });
        })(filterIds[f]);
      }
    }

    _loadData() {
      var self = this;
      var cacheKey = 'manualEntrada.listEntries';
      var dc = window.__DataClient;

      var cached = dc.get(cacheKey);
      if (cached) {
        self._entries = cached.entries || cached.data && cached.data.entries || [];
        self._applyFilters();
      }

      dc.fetchData('manualEntrada.listEntries', { limit: 500 }, { key: cacheKey })
        .then(function (result) {
          if (result && result.data) {
            self._entries = result.data.entries || [];
          } else if (result && result.entries) {
            self._entries = result.entries || [];
          } else {
            self._entries = [];
          }
          self._applyFilters();
        })
        .catch(function (e) {
          self.shadowRoot.getElementById('content').innerHTML = '';
          showError(self.shadowRoot, 'Erro ao carregar: ' + (e.message || e));
        });
    }

    _applyFilters() {
      var self = this;
      var v = function (id) {
        var el = self.shadowRoot.getElementById(id);
        return el ? el.value.trim().toLowerCase() : '';
      };
      var fCod = v('filter-codigo');
      var fCat = v('filter-categoria');
      var fDesc = v('filter-descricao');
      var fFor = v('filter-fornecedor');
      var fNcm = v('filter-ncm');
      var fStatus = v('filter-status');

      this._filtered = this._entries.filter(function (e) {
        if (fCod && String(e.codigoProduto || '').toLowerCase().indexOf(fCod) === -1) return false;
        if (fCat && String(e.categoria || '').toLowerCase().indexOf(fCat) === -1) return false;
        if (fDesc && String(e.descricaoProduto || '').toLowerCase().indexOf(fDesc) === -1) return false;
        if (fFor && String(e.emitenteNome || '').toLowerCase().indexOf(fFor) === -1) return false;
        if (fNcm && String(e.ncm || '').toLowerCase().indexOf(fNcm) === -1) return false;
        if (fStatus && String(e.status || 'Recebido').toLowerCase() !== fStatus.toLowerCase()) return false;
        return true;
      });

      this._updateStats(this._filtered);
      this._render();
    }

    _updateStats(items) {
      var set = items || [];
      var total = 0;
      var disponivel = 0;
      var vendido = 0;
      var alertas = 0;
      var somaCusto = 0;
      var somaShopee = 0;
      var somaML = 0;
      for (var i = 0; i < set.length; i++) {
        var qtd = parseFloat(set[i].quantidade) || 0;
        var status = String(set[i].status || 'Recebido').trim();
        total += qtd;
        if (status === 'Recebido') disponivel += qtd;
        else if (status === 'Desconsiderar') vendido += qtd;
        var precoShopee = parseFloat(set[i].precoSugeridoShopee) || 0;
        var precoML = parseFloat(set[i].precoSugeridoMercadoLivre) || 0;
        if (precoShopee <= 0 && precoML <= 0) alertas++;
        somaShopee += qtd * precoShopee;
        somaML += qtd * precoML;
        somaCusto += parseFloat(set[i].valorLiquidoItem) || 0;
      }
      this.shadowRoot.getElementById('stat-total').textContent = Math.round(total);
      this.shadowRoot.getElementById('stat-disponivel').textContent = Math.round(disponivel);
      this.shadowRoot.getElementById('stat-vendido').textContent = Math.round(vendido);
      this.shadowRoot.getElementById('stat-alertas').textContent = alertas;
      this.shadowRoot.getElementById('stat-custo').textContent = FormatterService.formatCurrency(somaCusto);
      this.shadowRoot.getElementById('stat-preco-shopee').textContent = FormatterService.formatCurrency(somaShopee);
      this.shadowRoot.getElementById('stat-preco-ml').textContent = FormatterService.formatCurrency(somaML);
    }

    _render() {
      var self = this;
      var content = this.shadowRoot.getElementById('content');

      if (this._filtered.length === 0) {
        content.innerHTML = '<div class="empty-state"><p>Nenhuma entrada manual registrada.</p></div>';
        return;
      }

      var fmt = function (v) {
        if (typeof v !== 'number' || isNaN(v)) return 'R$ 0,00';
        return 'R$ ' + v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
      };

      var fmtDate = function (v) {
        if (!v) return '';
        var s = String(v).trim();
        var m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})(?:\s+\d{2}:\d{2}:\d{2})?$/);
        if (m) return m[1] + '/' + m[2] + '/' + m[3];
        return s;
      };

      var sorted = this._filtered.slice().sort(function (a, b) {
        var field = self._sortField;
        var valA = a[field] || '';
        var valB = b[field] || '';
        if (typeof valA === 'number' && typeof valB === 'number') {
          return self._sortOrder === 'asc' ? valA - valB : valB - valA;
        }
        valA = String(valA).toLowerCase();
        valB = String(valB).toLowerCase();
        if (valA < valB) return self._sortOrder === 'asc' ? -1 : 1;
        if (valA > valB) return self._sortOrder === 'asc' ? 1 : -1;
        return 0;
      });

      var sortIcon = function (field) {
        if (self._sortField !== field) return '';
        return '<span class="sort-icon">' + (self._sortOrder === 'asc' ? '▲' : '▼') + '</span>';
      };

      var html = '<div class="table-wrapper"><table>' +
        '<thead><tr>' +
        '<th data-sort="codigoProduto">Código ' + sortIcon('codigoProduto') + '</th>' +
        '<th data-sort="categoria">Categoria ' + sortIcon('categoria') + '</th>' +
        '<th data-sort="descricaoProduto">Descrição ' + sortIcon('descricaoProduto') + '</th>' +
        '<th data-sort="emitenteNome">Fornecedor ' + sortIcon('emitenteNome') + '</th>' +
        '<th data-sort="quantidade">Qtd ' + sortIcon('quantidade') + '</th>' +
        '<th data-sort="valorUnitario">Vlr Unitário ' + sortIcon('valorUnitario') + '</th>' +
        '<th data-sort="valorLiquidoItem">Vlr Líquido ' + sortIcon('valorLiquidoItem') + '</th>' +
        '<th data-sort="valorUnitarioLiquido">Unit Líquido ' + sortIcon('valorUnitarioLiquido') + '</th>' +
        '<th data-sort="dataCompra">Data Compra ' + sortIcon('dataCompra') + '</th>' +
        '<th data-sort="status">Status ' + sortIcon('status') + '</th>' +
        '</tr></thead><tbody>';

      for (var j = 0; j < sorted.length; j++) {
        var e = sorted[j];
        html += '<tr>' +
          '<td>' + (e.codigoProduto || '') + '</td>' +
          '<td>' + (e.categoria || '') + '</td>' +
          '<td>' + (e.descricaoProduto || '') + '</td>' +
          '<td>' + (e.emitenteNome || '') + '</td>' +
          '<td>' + (e.quantidade || 0) + '</td>' +
          '<td>' + fmt(e.valorUnitario) + '</td>' +
          '<td>' + fmt(e.valorLiquidoItem) + '</td>' +
          '<td>' + fmt(e.valorUnitarioLiquido) + '</td>' +
          '<td>' + fmtDate(e.dataCompra) + '</td>' +
          '<td><span class="badge badge-success">' + (e.status || 'Recebido') + '</span></td>' +
          '</tr>';
      }

      html += '</tbody></table></div>';
      content.innerHTML = html;

      var ths = content.querySelectorAll('th[data-sort]');
      for (var k = 0; k < ths.length; k++) {
        ths[k].addEventListener('click', function () {
          var field = this.getAttribute('data-sort');
          if (self._sortField === field) {
            self._sortOrder = self._sortOrder === 'asc' ? 'desc' : 'asc';
          } else {
            self._sortField = field;
            self._sortOrder = 'asc';
          }
          self._render();
        });
      }
    }
  });
})();
</script>
