<template id="manual-entrada-template">
  <style>
    :host { display: block; }

    .modal-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0, 0, 0, 0.5);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }

    .modal {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      width: 95vw; max-width: 600px;
      max-height: 90vh; overflow-y: auto;
      padding: var(--space-xl);
      box-shadow: var(--shadow-lg);
    }

    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: var(--space-xl);
    }
    .modal-header h2 {
      margin: 0; font-size: var(--font-size-lg); font-weight: var(--font-weight-bold);
      color: var(--color-text);
    }
    .btn-close {
      background: none; border: none; cursor: pointer;
      font-size: var(--font-size-lg); color: var(--color-text-secondary);
      padding: var(--space-xs); border-radius: var(--radius-xs);
    }
    .btn-close:hover { background: var(--color-surface-hover); }

    .form-group { margin-bottom: var(--space-lg); }
    .form-group label {
      display: block; font-size: var(--font-size-sm); font-weight: var(--font-weight-medium);
      color: var(--color-text-secondary); margin-bottom: var(--space-xs);
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: var(--space-sm) var(--space-md);
      border: 1px solid var(--color-border); border-radius: var(--radius-sm);
      font-size: var(--font-size-base); font-family: var(--font-family-base);
      background: var(--color-surface); color: var(--color-text);
      box-sizing: border-box;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none; border-color: var(--color-primary);
      box-shadow: 0 0 0 2px var(--color-primary-light);
    }
    .form-group input.error, .form-group select.error {
      border-color: var(--color-error);
    }
    .form-group .error-msg {
      font-size: var(--font-size-xs); color: var(--color-error-text);
      margin-top: var(--space-xs); display: none;
    }
    .form-group input.error + .error-msg { display: block; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-lg); }

    .product-hint {
      font-size: var(--font-size-xs); color: var(--color-text-tertiary);
      margin-top: var(--space-xs); font-style: italic;
    }

    .autocomplete-wrapper { position: relative; }
    .autocomplete-list {
      position: absolute; top: 100%; left: 0; right: 0;
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-sm); max-height: 150px; overflow-y: auto;
      z-index: 10; display: none;
    }
    .autocomplete-list.show { display: block; }
    .autocomplete-item {
      padding: var(--space-sm) var(--space-md); cursor: pointer;
      font-size: var(--font-size-sm); color: var(--color-text);
    }
    .autocomplete-item:hover { background: var(--color-surface-hover); }

    .summary {
      background: var(--color-surface-alt); border-radius: var(--radius-sm);
      padding: var(--space-md); margin-bottom: var(--space-lg);
      font-size: var(--font-size-sm); color: var(--color-text-secondary);
    }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: var(--space-xs); }
    .summary-row:last-child { margin-bottom: 0; }
    .summary-value { font-weight: var(--font-weight-semibold); color: var(--color-text); }

    .form-actions { display: flex; gap: var(--space-sm); justify-content: flex-end; margin-top: var(--space-xl); }

    .btn {
      padding: var(--space-sm) var(--space-lg); border-radius: var(--radius-sm);
      font-size: var(--font-size-sm); font-weight: var(--font-weight-medium);
      cursor: pointer; border: 1px solid var(--color-border);
      background: var(--color-surface); color: var(--color-text);
    }
    .btn:hover { background: var(--color-surface-hover); }
    .btn-primary {
      background: var(--color-primary); color: var(--color-on-primary);
      border-color: var(--color-primary);
    }
    .btn-primary:hover { background: var(--color-primary-hover); }
    .btn-primary:disabled {
      background: var(--color-disabled); border-color: var(--color-disabled);
      cursor: not-allowed;
    }
  </style>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2>Entrada Manual de Produtos</h2>
        <button class="btn-close" id="btn-close" aria-label="Fechar">&times;</button>
      </div>

      <div class="form-group">
        <label for="product-select">Produto (selecione da planilha)</label>
        <select id="product-select">
          <option value="">Carregando produtos...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="descricao-produto">Nome do Produto</label>
        <input type="text" id="descricao-produto" placeholder="Nome do produto..." />
        <div class="product-hint">Se selecionou na picklist, preenche automático. Senão, digite aqui.</div>
        <div class="error-msg">Nome do produto é obrigatório</div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="quantidade">Quantidade</label>
          <input type="number" id="quantidade" min="0" step="1" />
          <div class="error-msg">Quantidade deve ser > 0</div>
        </div>
        <div class="form-group">
          <label for="valor-unitario">Valor Unitario (R$)</label>
          <input type="number" id="valor-unitario" min="0" step="0.01" />
          <div class="error-msg">Valor deve ser >= 0</div>
        </div>
      </div>

      <div class="form-group">
        <label for="fornecedor">Fornecedor</label>
        <div class="autocomplete-wrapper">
          <input type="text" id="fornecedor" placeholder="Nome do fornecedor..." autocomplete="off" />
          <div class="autocomplete-list" id="fornecedor-list"></div>
        </div>
        <div class="error-msg">Fornecedor e obrigatorio</div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="data-compra">Data da Compra</label>
          <input type="text" id="data-compra" placeholder="DD/MM/AAAA" />
        </div>
        <div class="form-group">
          <label for="valor-outros">Despesas Acessorias (R$)</label>
          <input type="number" id="valor-outros" min="0" step="0.01" value="0" />
        </div>
      </div>

      <div class="form-group">
        <label for="ncm">NCM</label>
        <input type="text" id="ncm" placeholder="Opcional" />
      </div>

      <div class="form-group">
        <label for="observacoes">Observacoes</label>
        <textarea id="observacoes" rows="2" placeholder="Notas livres..."></textarea>
      </div>

      <div class="summary" id="summary" style="display:none;">
        <div class="summary-row">
          <span>Valor Total:</span>
          <span class="summary-value" id="summary-total">R$ 0,00</span>
        </div>
        <div class="summary-row">
          <span>Custo Liquido:</span>
          <span class="summary-value" id="summary-liquido">R$ 0,00</span>
        </div>
        <div class="summary-row">
          <span>Custo Unitario Liquido:</span>
          <span class="summary-value" id="summary-unitario">R$ 0,00</span>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn" id="btn-cancel">Cancelar</button>
        <button class="btn btn-primary" id="btn-confirm" disabled>Confirmar</button>
      </div>

      <div id="error-box" class="alert alert-error" hidden></div>
      <div id="result-box" hidden></div>
    </div>
  </div>
</template>

<script>
(function () {
  var template = document.getElementById('manual-entrada-template');
  if (!template) return;

  var TAG = 'manual-entrada-widget';

  customElements.define(TAG, class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
      this.shadowRoot.appendChild(template.content.cloneNode(true));
      if (window.__DESIGN_SHEET__) {
        this.shadowRoot.adoptedStyleSheets = [window.__DESIGN_SHEET__];
      }
      this._products = [];
      this._suppliers = [];
    }

    connectedCallback() {
      this._loadProducts();
      this._loadSuppliers();
      this._bindEvents();
      this._setDefaultDate();
    }

    open() {
      this.shadowRoot.getElementById('modal-overlay').classList.add('open');
      this._resetForm();
      this._loadProducts();
      this._loadSuppliers();
    }

    close() {
      this.shadowRoot.getElementById('modal-overlay').classList.remove('open');
    }

    setOnSaveCallback(fn) {
      this._onSaveCallback = fn;
    }

    _el(id) {
      return this.shadowRoot.getElementById(id);
    }

    _loadProducts() {
      var self = this;
      var select = this._el('product-select');
      select.innerHTML = '<option value="">Carregando produtos...</option>';

      window.__DataClient.fetchData('nfeEntradaProdutos.getProdutos', {}, { cache: false })
        .then(function (rows) {
          rows = rows || [];

          var grouped = {};
          for (var i = 0; i < rows.length; i++) {
            var r = rows[i];
            var status = String(r.STATUS || '').trim().toLowerCase();
            if (status !== 'recebido') continue;
            var code = String(r.CODIGO_PRODUTO || '').trim();
            if (!code) continue;
            if (!grouped[code]) {
              grouped[code] = {
                codigo: code,
                descricao: r.DESCRICAO_PRODUTO || '',
                fornecedor: r.EMITENTE_NOME || '',
                ncm: r.NCM || ''
              };
            }
          }

          var items = [];
          var codes = Object.keys(grouped);
          for (var j = 0; j < codes.length; j++) {
            items.push(grouped[codes[j]]);
          }
          items.sort(function (a, b) {
            return a.descricao.toLowerCase() < b.descricao.toLowerCase() ? -1 : 1;
          });

          self._products = items;
          select.innerHTML = '<option value="">Selecione (ou digite abaixo)...</option>';
          if (items.length === 0) {
            select.innerHTML = '<option value="">Nenhum produto na planilha</option>';
            return;
          }
          for (var k = 0; k < items.length; k++) {
            var opt = document.createElement('option');
            opt.value = items[k].codigo;
            opt.textContent = items[k].descricao + ' (' + items[k].codigo + ')';
            select.appendChild(opt);
          }
        })
        .catch(function (e) {
            select.innerHTML = '<option value="">Erro ao carregar: ' + (e.message || 'desconhecido') + '</option>';
          });
    }

    _loadSuppliers() {
      var self = this;
      window.__DataClient.fetchData('manualEntrada.getSupplierHistory', {})
        .then(function (data) {
          self._suppliers = (data && data.suppliers) || [];
        })
        .catch(function (e) {
          showError(self.shadowRoot, 'Erro ao carregar fornecedores: ' + ((e && e.message) || 'desconhecido'));
        });
    }

    _bindEvents() {
      var self = this;

      this._el('modal-overlay').addEventListener('click', function (e) {
        if (e.target.id === 'modal-overlay') self.close();
      });
      this._el('btn-close').addEventListener('click', function () { self.close(); });
      this._el('btn-cancel').addEventListener('click', function () { self.close(); });
      this._el('btn-confirm').addEventListener('click', function () { self._submit(); });

      this._el('product-select').addEventListener('change', function () {
        var code = self._el('product-select').value;
        var product = null;
        for (var i = 0; i < self._products.length; i++) {
          if (self._products[i].codigo === code) {
            product = self._products[i];
            break;
          }
        }
        if (product) {
          self._el('descricao-produto').value = product.descricao || '';
          self._el('ncm').value = product.ncm || '';
        }
        self._updateSummary();
        self._validate();
      });

      this._el('descricao-produto').addEventListener('input', function () {
        self._updateSummary();
        self._validate();
      });

      var fornecedor = this._el('fornecedor');
      fornecedor.addEventListener('input', function () {
        self._filterSuppliers(fornecedor.value);
        self._validate();
      });
      fornecedor.addEventListener('focus', function () {
        self._filterSuppliers(fornecedor.value);
      });

      ['quantidade', 'valor-unitario', 'valor-outros'].forEach(function (id) {
        self._el(id).addEventListener('input', function () {
          self._updateSummary();
          self._validate();
        });
      });

      document.addEventListener('click', function (e) {
        if (!self.shadowRoot.contains(e.target)) {
          self._el('fornecedor-list').classList.remove('show');
        }
      });
    }

    _setDefaultDate() {
      var now = new Date();
      var dd = String(now.getDate()).padStart(2, '0');
      var mm = String(now.getMonth() + 1).padStart(2, '0');
      var yyyy = now.getFullYear();
      this._el('data-compra').value = dd + '/' + mm + '/' + yyyy;
    }

    _filterSuppliers(query) {
      var list = this._el('fornecedor-list');
      list.innerHTML = '';
      var q = (query || '').toLowerCase();
      var matches = this._suppliers.filter(function (s) {
        return s.toLowerCase().indexOf(q) !== -1;
      }).slice(0, 10);

      if (matches.length === 0) {
        list.classList.remove('show');
        return;
      }

      var self = this;
      matches.forEach(function (s) {
        var div = document.createElement('div');
        div.className = 'autocomplete-item';
        div.textContent = s;
        div.addEventListener('click', function () {
          self._el('fornecedor').value = s;
          list.classList.remove('show');
          self._validate();
        });
        list.appendChild(div);
      });
      list.classList.add('show');
    }

    _updateSummary() {
      var qty = parseFloat(this._el('quantidade').value) || 0;
      var unit = parseFloat(this._el('valor-unitario').value) || 0;
      var outros = parseFloat(this._el('valor-outros').value) || 0;

      var total = Math.round(qty * unit * 100) / 100;
      var liquido = Math.round((total + outros) * 100) / 100;
      var unitLiq = qty > 0 ? Math.round((liquido / qty) * 100) / 100 : 0;

      var fmt = function (v) { return 'R$ ' + v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.'); };

      this._el('summary-total').textContent = fmt(total);
      this._el('summary-liquido').textContent = fmt(liquido);
      this._el('summary-unitario').textContent = fmt(unitLiq);
      this._el('summary').style.display = 'block';
    }

    _validate() {
      var descricao = this._el('descricao-produto').value.trim();
      var fornecedor = this._el('fornecedor').value.trim();
      var qty = parseFloat(this._el('quantidade').value);
      var unit = parseFloat(this._el('valor-unitario').value);

      var valid = descricao && fornecedor && !isNaN(qty) && qty > 0 && !isNaN(unit) && unit >= 0;
      this._el('btn-confirm').disabled = !valid;
    }

    _submit() {
      var self = this;
      var codigo = this._el('product-select').value;
      var descricao = this._el('descricao-produto').value.trim();

      if (!descricao) {
        showError(this.shadowRoot, 'Informe o nome do produto.');
        return;
      }

      var params = {
        codigoProduto: codigo || 'MANUAL-' + Date.now(),
        descricaoProduto: descricao,
        quantidade: parseFloat(this._el('quantidade').value) || 0,
        valorUnitario: parseFloat(this._el('valor-unitario').value) || 0,
        emitenteNome: this._el('fornecedor').value.trim(),
        dataCompra: this._el('data-compra').value,
        valorOutrosItem: parseFloat(this._el('valor-outros').value) || 0,
        observacoes: this._el('observacoes').value,
        ncm: this._el('ncm').value
      };

      this._el('btn-confirm').disabled = true;

      window.__DataClient.mutateData('manualEntrada.addEntry', params)
        .then(function (result) {
          if (result && result.error) {
            showError(self.shadowRoot, result.error);
            self._el('btn-confirm').disabled = false;
            return;
          }
          var msg = 'Entrada registrada com sucesso!';
          if (result.warnings && result.warnings.length > 0) {
            msg += ' Aviso: ' + result.warnings.join(', ');
          }
          showSuccess(self.shadowRoot, msg);
          self.close();
          if (typeof self._onSaveCallback === 'function') {
            self._onSaveCallback();
          }
        })
        .catch(function (e) {
          showError(self.shadowRoot, 'Erro: ' + (e.message || 'desconhecido'));
          self._el('btn-confirm').disabled = false;
        });
    }

    _resetForm() {
      this._el('product-select').value = '';
      this._el('descricao-produto').value = '';
      this._el('quantidade').value = '';
      this._el('valor-unitario').value = '';
      this._el('fornecedor').value = '';
      this._el('valor-outros').value = '0';
      this._el('observacoes').value = '';
      this._el('ncm').value = '';
      this._el('summary').style.display = 'none';
      this._el('btn-confirm').disabled = true;
      this._setDefaultDate();
    }
  });
})();
</script>
