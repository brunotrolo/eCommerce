<template id="status-view-template">
  <style>
    :host {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--color-text-secondary);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      padding: 4px 0;
      user-select: none;
      background: transparent !important;
      border: none !important;
      border-radius: 0 !important;
      width: auto !important;
      min-width: 0 !important;
      max-width: none !important;
      height: auto !important;
      min-height: 0 !important;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot--online { background: var(--color-success); }
    .dot--offline { background: var(--color-error); }
    .dot--loading { background: var(--color-warning); animation: blink 1s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: 0.4; } }
    .label { font-weight: var(--font-weight-medium); }
    .timing {
      font-family: var(--font-family-mono);
      font-size: 11px;
      color: var(--color-text-tertiary);
    }
    @media (max-width: 640px) {
      :host { font-size: 11px; }
      .timing { font-size: 10px; }
    }
  </style>
  <span class="dot dot--loading" id="dot"></span>
  <span class="label" id="label">Carregando...</span>
  <span class="timing" id="timing"></span>
</template>

<script>
  (function () {
    var _pageLoadTime = performance.timing ? performance.timing.navigationStart : Date.now();
    var _dbgSeq = 0;

    function _fmtBrTs_(d) {
      var pad = function (n) { return String(n).padStart(2, '0'); };
      return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear()
        + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }

    function _logStatusView(msg, extra) {
      var entry = {
        kind: 'StatusView',
        message: msg,
        seq: ++_dbgSeq,
        ts: _fmtBrTs_(new Date())
      };
      if (extra !== undefined) entry.extra = extra;
      console.log('[StatusView]', msg, extra !== undefined ? extra : '');
      if (window.__debugErrors_) {
        window.__debugErrors_.unshift(entry);
        if (window.__debugErrors_.length > 100) window.__debugErrors_.pop();
      }
    }

    _logStatusView('Script carregado');

    class StatusView extends HTMLElement {
      constructor() {
        super();
        _logStatusView('constructor chamado');
        this.attachShadow({ mode: 'open' });
        var tpl = document.getElementById('status-view-template');
        this.shadowRoot.appendChild(tpl.content.cloneNode(true));
        if (window.__DESIGN_SHEET__) {
          this.shadowRoot.adoptedStyleSheets = [window.__DESIGN_SHEET__];
        }
        this._interval = null;
      }

      connectedCallback() {
        _logStatusView('connectedCallback — iniciando fetch');
        this._fetch();
        this._interval = setInterval(this._fetch.bind(this), 10000);
      }

      disconnectedCallback() {
        if (this._interval) clearInterval(this._interval);
      }

      _fetch() {
        var self = this;
        var t0 = Date.now();
        _logStatusView('fetch iniciado, t0=' + t0);
        google.script.run
          .withSuccessHandler(function (resp) {
            var t1 = Date.now();
            var gasMs = t1 - t0;
            var cpuMs = t1 - _pageLoadTime;
            _logStatusView('fetch success', {
              respType: typeof resp,
              respStr: JSON.stringify(resp).substring(0, 300),
              gasMs: gasMs,
              cpuMs: cpuMs
            });
            var data = resp && resp.data ? resp.data : resp;
            _logStatusView('data extraido', {
              dataKeys: data ? Object.keys(data) : null,
              isOnline: data && data.isOnline,
              lastUpdate: data && data.lastUpdate
            });
            self._render(data, gasMs, cpuMs);
          })
          .withFailureHandler(function (err) {
            var t1 = Date.now();
            _logStatusView('fetch FAILURE', {
              error: err ? (err.message || String(err)) : 'unknown',
              gasMs: t1 - t0
            });
            self._render(null, 0, 0);
          })
          .apiDispatch('system.getStatus', {});
      }

      _render(data, gasMs, cpuMs) {
        var dot = this.shadowRoot.getElementById('dot');
        var label = this.shadowRoot.getElementById('label');
        var timing = this.shadowRoot.getElementById('timing');

        _logStatusView('render', {
          dataIsNull: !data,
          isOnline: data && data.isOnline,
          gasMs: gasMs,
          cpuMs: cpuMs
        });

        if (!data || data.isOnline === false) {
          dot.className = 'dot dot--offline';
          label.textContent = 'Offline';
          timing.textContent = '';
          return;
        }

        dot.className = 'dot dot--online';
        label.textContent = 'Online';

        if (data.lastUpdate) {
          label.textContent += ' | ' + data.lastUpdate;
        }

        var totalMs = gasMs + cpuMs;
        var total = (totalMs / 1000).toFixed(2);
        var gas = (gasMs / 1000).toFixed(2);
        var cpu = (cpuMs / 1000).toFixed(2);
        timing.textContent = total + 's (GAS: ' + gas + 's | CPU: ' + cpu + 's)';
      }
    }

    if (!customElements.get('status-view')) {
      customElements.define('status-view', StatusView);
    } else {
      _logStatusView('status-view já definido anteriormente');
    }
  })();
</script>
