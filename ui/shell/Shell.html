<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <?!= include('ui/shared/Styles'); ?>
  </head>
  <body>
    <div class="app-shell">
      <nav class="app-nav">
        <span class="nav-brand">eCommerce</span>
        <button class="btn" data-route="dashboard">Dashboard</button>
        <button class="btn" data-route="pricing">Calculadora</button>
        <button class="btn" data-route="orders">Pedidos</button>
        <button class="btn" data-route="listings">Anúncios</button>
        <button class="btn" data-route="inventoryPricing">Preço e Estoque</button>
        <button class="btn" data-route="nfeEntrada">NFe Entrada</button>
        <button class="btn" data-route="nfeEntradaProdutos">Entrada Produtos</button>
        <button class="btn" data-route="catalog">Catálogo</button>
        <div style="margin-left: auto; display: flex; align-items: center; gap: 4px;">
          <status-view></status-view>
          <button class="btn" id="calc-nav-btn" aria-label="Abrir Calculadora" style="font-size:18px; padding: 6px 10px; min-width: auto;">🧮</button>
          <button class="theme-toggle" id="theme-toggle" aria-label="Alternar tema claro/escuro"></button>
        </div>
      </nav>
      <main id="app-view"></main>
    </div>

    <debug-console-widget></debug-console-widget>

    <?!= include('ui/shared/DesignSystemLoader'); ?>
    <?!= include('ui/shared/UiHelpers'); ?>
    <?!= include('ui/shared/Formatter'); ?>
    <?!= include('ui/shared/DebugConsole'); ?>
    <?!= include('ui/shell/StatusView'); ?>
    <?!= include('ui/dashboard/DashboardView'); ?>
    <?!= include('ui/pricing/PricingView'); ?>
    <?!= include('ui/orders/OrdersView'); ?>
    <?!= include('ui/listings/ListingsView'); ?>
    <?!= include('ui/inventoryPricing/InventoryPricingView'); ?>
    <?!= include('ui/nfeEntrada/NFeEntradaView'); ?>
    <?!= include('ui/nfeEntradaProdutos/NFeEntradaProdutosView'); ?>
    <?!= include('ui/catalog/CatalogView'); ?>
    <?!= include('ui/calculator/CalculatorView'); ?>

    <calculator-widget></calculator-widget>

    <script>
      // Cada rota é um micro-frontend independente: um Web Component com
      // Shadow DOM próprio (ver *View.html). O Shell só monta/desmonta a tag.
      var ROUTES = {
        dashboard: 'dashboard-widget',
        pricing: 'pricing-calculator-widget',
        orders: 'orders-widget',
        listings: 'listings-widget',
        inventoryPricing: 'inventory-pricing-widget',
        nfeEntrada: 'nfe-entrada-widget',
        nfeEntradaProdutos: 'nfe-entrada-produtos-widget',
        catalog: 'catalog-widget'
      };

      function navigate(route) {
        var view = document.getElementById('app-view');
        view.innerHTML = '';
        var tag = ROUTES[route] ? route : 'dashboard';
        view.appendChild(document.createElement(ROUTES[tag]));
        window.location.hash = tag;
        document.querySelectorAll('.app-nav button[data-route]').forEach(function (btn) {
          btn.classList.toggle('btn-active', btn.dataset.route === tag);
        });
      }

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        var toggle = document.getElementById('theme-toggle');
        if (toggle) {
          toggle.textContent = theme === 'dark' ? '\u2600' : '\u263E';
        }
      }

      function initTheme() {
        var stored = localStorage.getItem('theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        applyTheme(theme);
        document.getElementById('theme-toggle').addEventListener('click', function () {
          var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
          applyTheme(next);
          localStorage.setItem('theme', next);
        });
      }

      document.querySelectorAll('.app-nav button[data-route]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          navigate(btn.dataset.route);
        });
      });

      initTheme();
      navigate((window.location.hash || '#dashboard').replace('#', ''));

      document.getElementById('calc-nav-btn').addEventListener('click', function () {
        var calcWidget = document.querySelector('calculator-widget');
        if (calcWidget && calcWidget.shadowRoot) {
          calcWidget.shadowRoot.getElementById('calc-overlay').setAttribute('open', '');
        }
      });
    </script>
  </body>
</html>
