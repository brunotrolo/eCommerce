    <script>
      // Cada rota é um micro-frontend independente: um Web Component com
      // Shadow DOM próprio (ver *View.html). O Shell só monta/desmonta a tag.
      var ROUTES = {
        dashboard: 'dashboard-widget',
        orders: 'orders-widget',
        listings: 'listings-widget',
        nfeEntrada: 'nfe-entrada-widget',
        nfeEntradaProdutos: 'nfe-entrada-produtos-widget',
        catalog: 'catalog-widget',
        estoque: 'estoque-widget',
        manualEntrada: 'manual-entrada-list-widget',
        manualSaida: 'manual-saida-list-widget',
        carteiraShopee: 'carteira-shopee-widget'
      };

      function navigate(route) {
        var view = document.getElementById('app-view');
        view.innerHTML = '';
        var tag = ROUTES[route] ? route : 'dashboard';
        view.appendChild(document.createElement(ROUTES[tag]));
        window.location.hash = tag;
        document.querySelectorAll('.app-nav button[data-route]').forEach(function (btn) {
          btn.classList.toggle('btn-active', btn.dataset.route === tag);
        });
      }

      function applyTheme(theme) {
        document.documentElement.dataset.theme = theme;
        var toggle = document.getElementById('theme-toggle');
        if (toggle) {
          toggle.textContent = theme === 'dark' ? '\u2600' : '\u263E';
        }
      }

      function initTheme() {
        var stored = localStorage.getItem('theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        applyTheme(theme);
        document.getElementById('theme-toggle').addEventListener('click', function () {
          var next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
          applyTheme(next);
          localStorage.setItem('theme', next);
        });
      }

      // Gerenciamento de dropdowns (hover em desktop, click em mobile)
      var openDropdown = null;

      function toggleDropdown(event) {
        var toggle = event.currentTarget;
        var container = toggle.closest('.nav-dropdown');
        var isOpen = toggle.getAttribute('aria-expanded') === 'true';

        // Fechar dropdown aberto anterior
        if (openDropdown && openDropdown !== container) {
          var prevToggle = openDropdown.querySelector('.nav-dropdown-toggle');
          prevToggle.setAttribute('aria-expanded', 'false');
          openDropdown.removeAttribute('open');
        }

        // Toggle current
        toggle.setAttribute('aria-expanded', !isOpen);
        if (!isOpen) {
          container.setAttribute('open', '');
          openDropdown = container;
        } else {
          container.removeAttribute('open');
          openDropdown = null;
        }
      }

      function closeDropdownAfterNavigation() {
        if (openDropdown) {
          var toggle = openDropdown.querySelector('.nav-dropdown-toggle');
          toggle.setAttribute('aria-expanded', 'false');
          openDropdown.removeAttribute('open');
          openDropdown = null;
        }
      }

      function closeDropdownOnClickOutside(event) {
        var isClickInsideNav = event.target.closest('.app-nav');
        if (!isClickInsideNav && openDropdown) {
          var toggle = openDropdown.querySelector('.nav-dropdown-toggle');
          toggle.setAttribute('aria-expanded', 'false');
          openDropdown.removeAttribute('open');
          openDropdown = null;
        }
      }

      function handleDropdownKeyboard(event) {
        var menu = event.currentTarget;
        var toggle = menu.previousElementSibling;
        var items = Array.from(menu.querySelectorAll('.nav-dropdown-item'));
        var currentIndex = items.indexOf(document.activeElement);

        switch (event.key) {
          case 'Escape':
            toggle.setAttribute('aria-expanded', 'false');
            menu.parentElement.removeAttribute('open');
            openDropdown = null;
            toggle.focus();
            event.preventDefault();
            break;

          case 'ArrowDown':
            var nextIndex = Math.min(currentIndex + 1, items.length - 1);
            items[nextIndex].focus();
            event.preventDefault();
            break;

          case 'ArrowUp':
            var prevIndex = Math.max(currentIndex - 1, 0);
            items[prevIndex].focus();
            event.preventDefault();
            break;

          case 'Home':
            items[0] && items[0].focus();
            event.preventDefault();
            break;

          case 'End':
            items[items.length - 1] && items[items.length - 1].focus();
            event.preventDefault();
            break;
        }
      }

      function initializeDropdowns() {
        // Listeners nos toggles (click para abrir/fechar)
        document.querySelectorAll('.nav-dropdown-toggle').forEach(function (toggle) {
          toggle.addEventListener('click', toggleDropdown);

          // Hover em desktop (simulado com mouseenter/mouseleave)
          toggle.closest('.nav-dropdown').addEventListener('mouseenter', function () {
            toggle.setAttribute('aria-expanded', 'true');
            if (openDropdown && openDropdown !== this) {
              openDropdown.querySelector('.nav-dropdown-toggle').setAttribute('aria-expanded', 'false');
            }
            openDropdown = this;
          });

          toggle.closest('.nav-dropdown').addEventListener('mouseleave', function () {
            toggle.setAttribute('aria-expanded', 'false');
            if (openDropdown === this) openDropdown = null;
          });
        });

        // Listeners nos items de dropdown
        document.querySelectorAll('.nav-dropdown-item').forEach(function (item) {
          item.addEventListener('click', function () {
            navigate(item.dataset.route);
            closeDropdownAfterNavigation();
          });
        });

        // Listeners nos menus (navegação por teclado)
        document.querySelectorAll('.nav-dropdown-menu').forEach(function (menu) {
          menu.addEventListener('keydown', handleDropdownKeyboard);
        });

        // Fechar ao clicar fora
        document.addEventListener('click', closeDropdownOnClickOutside);
      }

      // Estender navigate() para atualizar dropdown items ativos
      var originalNavigate = window.navigate;
      window.navigate = function (route) {
        originalNavigate(route);

        // Atualizar .nav-dropdown-item-active
        document.querySelectorAll('.nav-dropdown-item').forEach(function (item) {
          item.classList.toggle('nav-dropdown-item-active', item.dataset.route === route);
        });
      };

      // Listeners em botões diretos (Dashboard)
      document.querySelectorAll('.app-nav > button[data-route]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          navigate(btn.dataset.route);
        });
      });

      // Inicializar dropdowns após tudo carregado
      initializeDropdowns();

      initTheme();
      navigate((window.location.hash || '#dashboard').replace('#', ''));

      if (window.__DataStore) {
        window.__DataStore.preFetch([
          { key: 'config.config', action: 'config.getConfig', params: {} },
          { key: 'dashboard.summary', action: 'dashboard.getSummary', params: {} },
          { key: 'nfeEntrada.recent', action: 'nfeEntrada.getRecent', params: { limit: 20 } },
          { key: 'nfeEntradaProdutos.produtos', action: 'nfeEntradaProdutos.getProdutos', params: {} },
          { key: 'catalog.products.code.asc', action: 'catalog.getProducts', params: { sortBy: 'code', sortOrder: 'asc' } },
          { key: 'orders.all.30', action: 'orders.listUnified', params: { marketplace: 'all', limit: 30 } },
          { key: 'listings.all', action: 'listings.listUnified', params: { marketplace: 'all' } },
          { key: 'estoque.Items.DISPONIVEL', action: 'estoque.getItems', params: { status: 'DISPONIVEL' } },
          { key: 'manualEntrada.listEntries', action: 'manualEntrada.listEntries', params: { limit: 500 } },
          { key: 'manualSaida.listExits', action: 'manualSaida.listExits', params: { limit: 500 } }
        ]);
      }

      document.getElementById('calc-nav-btn').addEventListener('click', function () {
        var calcWidget = document.querySelector('calculator-widget');
        if (calcWidget && calcWidget.shadowRoot) {
          calcWidget.shadowRoot.getElementById('calc-overlay').setAttribute('open', '');
        }
      });


    </script>
