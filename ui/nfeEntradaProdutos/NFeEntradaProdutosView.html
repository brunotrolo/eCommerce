<template id="nfe-entrada-produtos-template">
  <style>
    #result-box {
      margin-bottom: var(--space-lg);
    }
    .nfe-prod-table { margin-top: var(--space-md); }
    .nfe-prod-table .table { width: 100%; }
    .nfe-empty {
      text-align: center;
      padding: var(--space-section) var(--space-lg);
      color: var(--color-text-secondary);
    }
    .nfe-prod-table .table tbody tr { cursor: pointer; }
    .nfe-prod-table .table tbody tr:hover { background: var(--color-surface-hover); }
    .nfe-sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 9990;
      display: none;
    }
    .nfe-sidebar-overlay[open] { display: block; }
    .nfe-sidebar {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 25vw;
      max-width: 25vw;
      background: var(--color-surface);
      border-left: 1px solid var(--color-border);
      z-index: 9995;
      display: none;
      flex-direction: column;
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.15);
    }
    .nfe-sidebar[open] { display: flex; }
    .nfe-sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-sm) var(--space-md);
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    .nfe-sidebar-header h3 { margin: 0; font-size: var(--font-size-md); font-weight: var(--font-weight-semibold); }
    .nfe-sidebar-close {
      background: none;
      border: none;
      font-size: var(--font-size-xl);
      cursor: pointer;
      color: var(--color-text-secondary);
      padding: var(--space-xs);
      line-height: 1;
    }
    .nfe-sidebar-close:hover { color: var(--color-text); }
    .nfe-sidebar-body {
      flex: 1;
      overflow: auto;
      padding: var(--space-md);
    }
    .nfe-sidebar-body .table { width: 100%; }
    .nfe-sidebar-empty {
      text-align: center;
      padding: var(--space-section);
      color: var(--color-text-secondary);
    }
    .calc-section {
      margin-bottom: var(--space-md);
      padding: var(--space-md);
      background: var(--color-surface-alt);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
    }
    .calc-section h4 {
      margin: 0 0 var(--space-sm) 0;
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--color-text-secondary);
      text-transform: uppercase;
      letter-spacing: var(--letter-spacing-micro);
    }
    .calc-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-xs) 0;
      font-size: var(--font-size-sm);
    }
    .calc-row.total {
      border-top: 2px solid var(--color-border);
      margin-top: var(--space-xs);
      padding-top: var(--space-sm);
      font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-md);
    }
    .calc-label { color: var(--color-text-secondary); }
    .calc-value { font-weight: var(--font-weight-medium); }
    .calc-formula {
      margin-top: var(--space-sm);
      padding: var(--space-sm);
      background: var(--color-surface);
      border-radius: var(--radius-sm);
      font-family: monospace;
      font-size: var(--font-size-xs);
      color: var(--color-text-secondary);
      text-align: center;
    }
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #ccc;
      border-radius: 22px;
      transition: 0.3s;
    }
    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.3s;
    }
    .toggle-switch input:checked + .toggle-slider {
      background-color: #22c55e;
    }
    .toggle-switch input:checked + .toggle-slider:before {
      transform: translateX(18px);
    }
    th[data-sort] {
      cursor: pointer;
      user-select: none;
      position: relative;
      padding-right: 24px !important;
    }
    th[data-sort]:hover { background: var(--color-bg-secondary, #f7f8fa); }
    th[data-sort]::after {
      content: '';
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid var(--color-text-tertiary, #b0b7c3);
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    th[data-sort].sort-asc::after,
    th[data-sort].sort-desc::after { opacity: 1; }
    th[data-sort].sort-desc::after {
      border-top: none;
      border-bottom: 5px solid var(--color-text-tertiary, #b0b7c3);
    }
  </style>

  <div class="widget-grid">
    <div class="card">
      <h1>Entrada de Produtos</h1>
      <p class="page-subtitle">Todos os itens das NFes importadas — uma linha por produto por NF.</p>

      <div class="page-actions">
        <button class="btn" id="btn-processar">Processar NFes não processadas</button>
        <span id="process-status" class="status-text"></span>
      </div>

      <div id="error-box" class="alert alert-error" hidden></div>
      <div id="result-box" hidden></div>

      <div class="filter-bar">
        <input type="text" id="filter-nf" placeholder="NF..." />
        <input type="text" id="filter-codigo" placeholder="Código..." />
        <input type="text" id="filter-categoria" placeholder="Categoria..." />
        <input type="text" id="filter-descricao" placeholder="Descrição..." />
        <input type="text" id="filter-ncm" placeholder="NCM..." />
        <select id="filter-status">
          <option value="">Status: todos</option>
          <option value="Recebido">Recebido</option>
          <option value="Desconsiderar">Desconsiderar</option>
        </select>
        <div class="filter-hint">Filtros combinados por coluna — digite e filtra na hora.</div>
      </div>

      <div class="page-summary" id="summary">
        <div class="stat"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total</div></div>
        <div class="stat"><div class="stat-value" id="stat-disponivel">0</div><div class="stat-label">Disponivel</div></div>
        <div class="stat"><div class="stat-value" id="stat-vendido">0</div><div class="stat-label">Vendido</div></div>
        <div class="stat"><div class="stat-value" id="stat-alertas">0</div><div class="stat-label">Alertas</div></div>
        <div class="stat stat-sep"><div class="stat-value" id="stat-custo">R$ 0,00</div><div class="stat-label">Custo Total</div></div>
        <div class="stat"><div class="stat-value" id="stat-preco-shopee">R$ 0,00</div><div class="stat-label">Preco Shopee</div></div>
        <div class="stat"><div class="stat-value" id="stat-preco-ml">R$ 0,00</div><div class="stat-label">Preco ML</div></div>
      </div>

      <div class="card" id="estoque-card" hidden>
        <h2>Itens Importados</h2>
        <p class="card-hint">Clique em um item para ver a memória de cálculo.</p>
        <div class="nfe-prod-table" id="estoque-table"></div>
      </div>
    </div>
  </div>

  <div class="nfe-sidebar-overlay" id="sidebar-overlay"></div>
  <aside class="nfe-sidebar" id="sidebar">
    <div class="nfe-sidebar-header">
      <h3 id="sidebar-title">Memória de Cálculo</h3>
      <button class="nfe-sidebar-close" id="sidebar-close" aria-label="Fechar">&times;</button>
    </div>
    <div class="nfe-sidebar-body" id="sidebar-body">
      <div class="nfe-sidebar-empty">Carregando...</div>
    </div>
  </aside>
</template>

<script>
  (function () {
    var template = document.getElementById('nfe-entrada-produtos-template');

    customElements.define(
      'nfe-entrada-produtos-widget',
      class extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: 'open' });
          this.shadowRoot.appendChild(template.content.cloneNode(true));
          if (window.__DESIGN_SHEET__) {
            this.shadowRoot.adoptedStyleSheets = [window.__DESIGN_SHEET__];
          }
          this._allItems = [];
          this._sortState = { field: null, asc: true };
        }

        _sortIcon(field) {
          var s = this._sortState;
          if (s.field !== field) return ' <span class="sort-arrow"></span>';
          return s.asc
            ? ' <span class="sort-arrow sort-asc"></span>'
            : ' <span class="sort-arrow sort-desc"></span>';
        }

        _sortItems(items) {
          var s = this._sortState;
          if (!s.field) return items;
          var sorted = items.slice();
          sorted.sort(function (a, b) {
            var va = a[s.field];
            var vb = b[s.field];
            if (va == null) return 1;
            if (vb == null) return -1;
            if (typeof va === 'string') {
              va = va.toLowerCase();
              vb = (vb || '').toLowerCase();
            }
            return va < vb ? -1 : va > vb ? 1 : 0;
          });
          return s.asc ? sorted : sorted.reverse();
        }

        _updateSortArrows(tableEl) {
          var self = this;
          var ths = tableEl.querySelectorAll('th[data-sort]');
          for (var i = 0; i < ths.length; i++) {
            var th = ths[i];
            var field = th.getAttribute('data-sort');
            th.classList.remove('sort-asc', 'sort-desc');
            var arrow = th.querySelector('.sort-arrow');
            if (!arrow) {
              arrow = document.createElement('span');
              arrow.className = 'sort-arrow';
              th.appendChild(arrow);
            }
            arrow.classList.remove('sort-asc', 'sort-desc');
            if (self._sortState.field === field) {
              arrow.classList.add(self._sortState.asc ? 'sort-asc' : 'sort-desc');
            }
          }
        }

        connectedCallback() {
          var self = this;
          var btnProcessar = this.shadowRoot.getElementById('btn-processar');
          var status = this.shadowRoot.getElementById('process-status');
          var overlay = this.shadowRoot.getElementById('sidebar-overlay');
          var closeBtn = this.shadowRoot.getElementById('sidebar-close');

          btnProcessar.addEventListener('click', function () {
            btnProcessar.disabled = true;
            btnProcessar.textContent = 'Processando...';
            status.textContent = 'Lendo NFes e desagregando produtos...';
            self.shadowRoot.getElementById('error-box').hidden = true;
            self._hideResult();

            google.script.run
              .withSuccessHandler(function (result) {
                btnProcessar.disabled = false;
                btnProcessar.textContent = 'Processar NFes não processadas';
                status.textContent = '';

              if (result.error) {
                showError(self.shadowRoot, result.error);
                return;
              }

              var data = result.data || {};
              var html = '<div class="alert alert-success">' +
                '<strong>' + (data.totalNfProcessed || 0) + '</strong> NF(s) processada(s), ' +
                '<strong>' + (data.totalProductsInserted || 0) + '</strong> produto(s) inserido(s).</div>';

              if (data.errors && data.errors.length > 0) {
                html += '<div class="alert alert-warning" style="margin-top: var(--space-md)">';
                for (var i = 0; i < data.errors.length; i++) {
                  html += '<div>NF ' + (data.errors[i].numeroNf || '') + ': ' + (data.errors[i].reason || '') + '</div>';
                }
                html += '</div>';
              }

self._showResult(html);
                self._loadProdutos();
                })
                .withFailureHandler(function (err) {
                  btnProcessar.disabled = false;
                  btnProcessar.textContent = 'Processar NFes não processadas';
                  status.textContent = '';
                  showError(self.shadowRoot, err.message || String(err));
                })
              .apiDispatch('nfeEntradaProdutos.processarTodasNfs', {});
          });

          var filterIds = ['filter-nf', 'filter-codigo', 'filter-categoria', 'filter-descricao', 'filter-ncm', 'filter-status'];
          for (var f = 0; f < filterIds.length; f++) {
            (function (id) {
              var el = self.shadowRoot.getElementById(id);
              el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', function () {
                self._applyFilter();
              });
            })(filterIds[f]);
          }

          overlay.addEventListener('click', function () { self._closeSidebar(); });
          closeBtn.addEventListener('click', function () { self._closeSidebar(); });

          var cached = window.__DataStore && window.__DataStore.get('nfeEntradaProdutos.produtos');
          if (cached) {
            var items = (cached && cached.data) || cached || [];
            if (Array.isArray(items) && items.length > 0) {
              self._allItems = items;
              self._applyFilter();
              self.shadowRoot.getElementById('estoque-card').hidden = false;
            }
          }
          this._loadProdutos();
        }

        _applyFilter() {
          var self = this;
          var v = function (id) {
            var el = self.shadowRoot.getElementById(id);
            return el ? el.value.trim().toLowerCase() : '';
          };
          var fNf = v('filter-nf');
          var fCod = v('filter-codigo');
          var fCat = v('filter-categoria');
          var fDesc = v('filter-descricao');
          var fNcm = v('filter-ncm');
          var fStatus = v('filter-status');

          var items = this._allItems.filter(function (item) {
            if (fNf && String(item.NUMERO_NF || '').toLowerCase().indexOf(fNf) === -1) return false;
            if (fCod && String(item.CODIGO_PRODUTO || '').toLowerCase().indexOf(fCod) === -1) return false;
            if (fCat && String(item.CATEGORIA || '').toLowerCase().indexOf(fCat) === -1) return false;
            if (fDesc && String(item.DESCRICAO_PRODUTO || '').toLowerCase().indexOf(fDesc) === -1) return false;
            if (fNcm && String(item.NCM || '').toLowerCase().indexOf(fNcm) === -1) return false;
            if (fStatus && String(item.STATUS || 'Recebido').toLowerCase() !== fStatus.toLowerCase()) return false;
            return true;
          });

          this._updateStats(items);

          var table = this.shadowRoot.getElementById('estoque-table');
          items = this._sortItems(items);
          this._renderTable(table, items);

          var toggles = table.querySelectorAll('.toggle-switch input');
          for (var t = 0; t < toggles.length; t++) {
            toggles[t].addEventListener('change', function () {
              var nf = this.getAttribute('data-nf');
              var cod = this.getAttribute('data-cod');
              var st = this.checked ? 'Recebido' : 'Desconsiderar';
              self._updateStatus(nf, cod, st);
            });
          }
        }

        _updateStats(items) {
          var set = items || [];
          var total = 0;
          var disponivel = 0;
          var vendido = 0;
          var alertas = 0;
          var somaCusto = 0;
          var somaShopee = 0;
          var somaML = 0;
          for (var i = 0; i < set.length; i++) {
            var qtd = parseFloat(set[i].QUANTIDADE) || 0;
            var status = String(set[i].STATUS || 'Recebido').trim();
            total += qtd;
            if (status === 'Recebido') disponivel += qtd;
            else if (status === 'Desconsiderar') vendido += qtd;
            var precoShopee = parseFloat(set[i].PRECO_SUGERIDO_SHOPEE) || 0;
            var precoML = parseFloat(set[i].PRECO_SUGERIDO_MERCADO_LIVRE) || 0;
            if (precoShopee <= 0 && precoML <= 0) alertas++;
            somaShopee += qtd * precoShopee;
            somaML += qtd * precoML;
            var vLiq = parseFloat(set[i].VALOR_LIQUIDO_ITEM);
            if (isNaN(vLiq)) vLiq = parseFloat(set[i].VALOR_TOTAL) || 0;
            somaCusto += vLiq;
          }
          this.shadowRoot.getElementById('stat-total').textContent = Math.round(total);
          this.shadowRoot.getElementById('stat-disponivel').textContent = Math.round(disponivel);
          this.shadowRoot.getElementById('stat-vendido').textContent = Math.round(vendido);
          this.shadowRoot.getElementById('stat-alertas').textContent = alertas;
          this.shadowRoot.getElementById('stat-custo').textContent = FormatterService.formatCurrency(somaCusto);
          this.shadowRoot.getElementById('stat-preco-shopee').textContent = FormatterService.formatCurrency(somaShopee);
          this.shadowRoot.getElementById('stat-preco-ml').textContent = FormatterService.formatCurrency(somaML);
        }

        _hideResult() {
          this.shadowRoot.getElementById('result-box').hidden = true;
        }

        _showResult(html) {
          var box = this.shadowRoot.getElementById('result-box');
          box.innerHTML = html;
          box.hidden = false;
        }

        _updateStatus(numeroNf, codigoProduto, status) {
          google.script.run
            .withSuccessHandler(function (result) {
              var data = result.data || result;
              if (data.error) console.error('[NFeProdutos] updateStatus error:', data.error);
            })
            .withFailureHandler(function (err) {
              console.error('[NFeProdutos] updateStatus failure:', err);
            })
            .apiDispatch('nfeEntradaProdutos.updateStatus', {
              numeroNf: numeroNf,
              codigoProduto: codigoProduto,
              status: status
            });
        }

        _loadProdutos() {
          var self = this;
          var ds = window.__DataStore;

          if (ds && ds.has('nfeEntradaProdutos.produtos')) {
            var cached = ds.get('nfeEntradaProdutos.produtos');
            var items = (cached && cached.data) || cached || [];
            if (Array.isArray(items) && items.length > 0) {
              self._allItems = items;
              self._applyFilter();
              self.shadowRoot.getElementById('estoque-card').hidden = false;
            }
            return;
          }

          google.script.run
            .withSuccessHandler(function (result) {
              var card = self.shadowRoot.getElementById('estoque-card');
              var table = self.shadowRoot.getElementById('estoque-table');

              if (result.error) {
                card.hidden = false;
                table.innerHTML = '<div class="nfe-empty">' + result.error + '</div>';
                return;
              }

              var data = result.data || {};
              var items = (data && data.data) || [];
              self._allItems = items;
              if (ds) ds.set('nfeEntradaProdutos.produtos', items);

              if (items.length === 0) {
                card.hidden = false;
                table.innerHTML = '<div class="nfe-empty">Nenhum produto encontrado.</div>';
                return;
              }

              self._applyFilter();
              card.hidden = false;
            })
            .withFailureHandler(function (err) {
              var table = self.shadowRoot.getElementById('estoque-table');
              var card = self.shadowRoot.getElementById('estoque-card');
              card.hidden = false;
              table.innerHTML = '<div class="nfe-empty">Erro ao carregar produtos: ' + (err.message || String(err)) + '</div>';
            })
            .apiDispatch('nfeEntradaProdutos.getProdutos', {});
        }

        _renderTable(table, items) {
          var self = this;
          var html = '<div class="table-container"><table class="table" id="prod-table">' +
            '<thead><tr>' +
            '<th data-sort="NUMERO_NF">NF' + this._sortIcon('NUMERO_NF') + '</th>' +
            '<th data-sort="CODIGO_PRODUTO">Código' + this._sortIcon('CODIGO_PRODUTO') + '</th>' +
            '<th data-sort="CATEGORIA">Categoria' + this._sortIcon('CATEGORIA') + '</th>' +
            '<th data-sort="DESCRICAO_PRODUTO">Descrição' + this._sortIcon('DESCRICAO_PRODUTO') + '</th>' +
            '<th data-sort="NCM">NCM' + this._sortIcon('NCM') + '</th>' +
            '<th data-sort="QUANTIDADE">Qtd' + this._sortIcon('QUANTIDADE') + '</th>' +
            '<th data-sort="vUnitLiq">Vl Unit. Líquido' + this._sortIcon('vUnitLiq') + '</th>' +
            '<th data-sort="vLiq">Vl Líquido Item' + this._sortIcon('vLiq') + '</th>' +
            '<th data-sort="STATUS">Status' + this._sortIcon('STATUS') + '</th>' +
            '</tr></thead><tbody>';

          for (var j = 0; j < items.length; j++) {
            var item = items[j];
            var isRecebido = (item.STATUS || 'Recebido') === 'Recebido';
            var nf = item.NUMERO_NF || '';
            var codProd = item.CODIGO_PRODUTO || '';
            var vUnitLiq = parseFloat(item.VALOR_UNITARIO_LIQUIDO);
            if (isNaN(vUnitLiq)) vUnitLiq = parseFloat(item.VALOR_UNITARIO) || 0;
            var vLiq = parseFloat(item.VALOR_LIQUIDO_ITEM);
            if (isNaN(vLiq)) vLiq = parseFloat(item.VALOR_TOTAL) || (vUnitLiq * (parseFloat(item.QUANTIDADE) || 0));
            var enriched = Object.assign({}, item, { vUnitLiq: vUnitLiq, vLiq: vLiq });
            html += '<tr data-index="' + j + '" class="prod-row">' +
              '<td>' + nf + '</td>' +
              '<td>' + codProd + '</td>' +
              '<td>' + (item.CATEGORIA || '') + '</td>' +
              '<td>' + (item.DESCRICAO_PRODUTO || '').toUpperCase() + '</td>' +
              '<td>' + (item.NCM || '') + '</td>' +
              '<td>' + (Math.round(parseFloat(item.QUANTIDADE) || 0)) + '</td>' +
              '<td>' + FormatterService.formatCurrency(vUnitLiq) + '</td>' +
              '<td>' + FormatterService.formatCurrency(vLiq) + '</td>' +
              '<td><label class="toggle-switch"><input type="checkbox" data-nf="' + nf + '" data-cod="' + codProd + '"' + (isRecebido ? ' checked' : '') + ' /><span class="toggle-slider"></span></label></td>' +
              '</tr>';
          }

          html += '</tbody></table></div>';
          table.innerHTML = html;

          var tableEl = table.querySelector('#prod-table');
          self._updateSortArrows(tableEl);
          var ths = tableEl.querySelectorAll('th[data-sort]');
          for (var t = 0; t < ths.length; t++) {
            ths[t].addEventListener('click', function () {
              var field = this.getAttribute('data-sort');
              if (self._sortState.field === field) {
                self._sortState.asc = !self._sortState.asc;
              } else {
                self._sortState.field = field;
                self._sortState.asc = true;
              }
              self._applyFilter();
            });
          }

          var allItems = items;
          var prodRows = table.querySelectorAll('.prod-row');
          for (var k = 0; k < prodRows.length; k++) {
            prodRows[k].addEventListener('click', function (e) {
              if (e.target.closest('.toggle-switch')) return;
              var idx = parseInt(this.getAttribute('data-index'), 10);
              self._openSidebar(allItems[idx]);
            });
          }
        }

        _openSidebar(item) {
          var self = this;
          var overlay = this.shadowRoot.getElementById('sidebar-overlay');
          var sidebar = this.shadowRoot.getElementById('sidebar');
          var title = this.shadowRoot.getElementById('sidebar-title');
          var body = this.shadowRoot.getElementById('sidebar-body');

          var nf = item.NUMERO_NF || '';
          var codProd = item.CODIGO_PRODUTO || '';
          var desc = (item.DESCRICAO_PRODUTO || '').toUpperCase();

          title.textContent = desc + ' — NF ' + nf;
          body.innerHTML = '<div class="nfe-sidebar-empty">Carregando...</div>';
          overlay.setAttribute('open', '');
          sidebar.setAttribute('open', '');

          var qty = Math.round(parseFloat(item.QUANTIDADE) || 0);
          var vUnit = parseFloat(item.VALOR_UNITARIO) || 0;
          var vOutros = parseFloat(item.VALOR_OUTROS_ITEM) || 0;
          var vDesc = parseFloat(item.VALOR_DESCONTO_ITEM) || 0;
          var vUnitLiq = parseFloat(item.VALOR_UNITARIO_LIQUIDO);
          if (isNaN(vUnitLiq)) vUnitLiq = vUnit;
          var vLiq = parseFloat(item.VALOR_LIQUIDO_ITEM);
          if (isNaN(vLiq)) vLiq = parseFloat(item.VALOR_TOTAL) || (vUnitLiq * qty);
          var tipoDesc = item.TIPO_DESCONTO || 'NENHUM';
          var tipoOutros = item.TIPO_OUTROS || 'NENHUM';

          var calcHtml = '<div class="calc-section">' +
            '<h4>Dados do Item</h4>' +
            '<div class="calc-row"><span class="calc-label">NF</span><span class="calc-value">' + nf + '</span></div>' +
            '<div class="calc-row"><span class="calc-label">Data Emissão</span><span class="calc-value">' + FormatterService.formatDate(item.DATA_EMISSAO) + '</span></div>' +
            '<div class="calc-row"><span class="calc-label">Emitente</span><span class="calc-value">' + (item.EMITENTE_NOME || '-') + '</span></div>' +
            '<div class="calc-row"><span class="calc-label">Código</span><span class="calc-value">' + codProd + '</span></div>' +
            '<div class="calc-row"><span class="calc-label">Descrição</span><span class="calc-value">' + desc + '</span></div>' +
            '<div class="calc-row"><span class="calc-label">NCM</span><span class="calc-value">' + (item.NCM || '-') + '</span></div>' +
            '<div class="calc-row"><span class="calc-label">CFOP</span><span class="calc-value">' + (item.CFOP || '-') + '</span></div>' +
            '</div>' +

            '<div class="calc-section">' +
            '<h4>Memória de Cálculo</h4>' +
            '<div class="calc-row"><span class="calc-label">Qtd</span><span class="calc-value">' + qty + '</span></div>' +
            '<div class="calc-row"><span class="calc-label">Vl Unitário (A)</span><span class="calc-value">' + FormatterService.formatCurrency(vUnit) + '</span></div>' +
            '<div class="calc-row"><span class="calc-label">Vl Total (A × Qtd)</span><span class="calc-value">' + FormatterService.formatCurrency(vUnit * qty) + '</span></div>' +
            '<div class="calc-row"><span class="calc-label">Vl Outros (B) [' + tipoOutros + ']</span><span class="calc-value">' + FormatterService.formatCurrency(vOutros) + '</span></div>' +
            '<div class="calc-row"><span class="calc-label">Vl Desconto (C) [' + tipoDesc + ']</span><span class="calc-value">' + FormatterService.formatCurrency(vDesc) + '</span></div>' +
            '<div class="calc-row"><span class="calc-label">Vl Unitário Líquido (A+B-C)</span><span class="calc-value">' + FormatterService.formatCurrency(vUnitLiq) + '</span></div>' +
            '<div class="calc-row total"><span class="calc-label">Vl Líquido Item ((A+B-C) × Qtd)</span><span class="calc-value">' + FormatterService.formatCurrency(vLiq) + '</span></div>' +
            '<div class="calc-formula">' +
            FormatterService.formatCurrency(vUnit) + ' + ' +
            FormatterService.formatCurrency(vOutros) + ' - ' +
            FormatterService.formatCurrency(vDesc) + ' = ' +
            FormatterService.formatCurrency(vUnitLiq) + ' × ' +
            qty + ' = ' +
            '<strong>' + FormatterService.formatCurrency(vLiq) + '</strong></div>' +
            '</div>' +

            '<div class="calc-section">' +
            '<h4>Impostos</h4>' +
            '<div class="calc-row"><span class="calc-label">Alíquota ICMS</span><span class="calc-value">' + (item.ALIQUOTA_ICMS || '0') + '%</span></div>' +
            '<div class="calc-row"><span class="calc-label">Vl ICMS Item</span><span class="calc-value">' + FormatterService.formatCurrency(item.VALOR_ICMS_ITEM) + '</span></div>' +
            '</div>';

          body.innerHTML = calcHtml;
        }

        _closeSidebar() {
          var overlay = this.shadowRoot.getElementById('sidebar-overlay');
          var sidebar = this.shadowRoot.getElementById('sidebar');
          overlay.removeAttribute('open');
          sidebar.removeAttribute('open');
        }
      }
    );
  })();
</script>
